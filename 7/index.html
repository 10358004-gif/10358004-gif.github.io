<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>火柴人勇者：飛空島的黃金樹</title>
  <style>
    :root {
      --bg-1: #edf5ff;
      --bg-2: #dfeefc;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(157, 191, 214, 0.6);
      --text: #1d2d3a;
      --muted: #527282;
      --accent: #2f9a7d;
      --accent-strong: #19765f;
      --gold: #f6c85d;
      --danger: #d95d4d;
      --shadow-blue: rgba(74, 150, 255, 0.35);
      --stone-dark: #4d5661;
      --stone-mid: #65717d;
      --stone-light: #8d98a3;
      --wood-deep: #9d6d42;
      --wood-mid: #c79152;
      --wood-light: #e5c182;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #edf7ff, #dfeefb 35%, #eef8f4);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 18px 14px 24px;
      overflow-x: hidden;
    }

    body.force-landscape-mode {
      overflow: hidden;
    }

    body.force-portrait-mode {
      overflow: auto;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px 18px 12px;
      border: 1px solid rgba(136, 168, 191, 0.4);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 60px rgba(17, 36, 46, 0.12);
      backdrop-filter: blur(7px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #398b79;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      letter-spacing: -0.04em;
      color: #1e2d3a;
    }

    .restart-btn {
      border: 0;
      border-radius: 12px;
      background: #224d5d;
      color: white;
      min-height: 42px;
      padding: 9px 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .restart-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid rgba(153, 179, 190, 0.5);
      border-radius: 12px;
      background: rgba(248, 251, 253, 0.9);
      color: #486676;
      font-weight: 800;
    }

    .hud-item strong {
      color: #173a48;
      font-variant-numeric: tabular-nums;
    }

    #lives {
      letter-spacing: 0.08em;
      color: #e2675a;
    }

    .sound-toggle {
      border: 1px solid rgba(153, 179, 190, 0.5);
      cursor: pointer;
      background: rgba(248, 251, 253, 0.9);
      pointer-events: auto;
    }

    .screen {
      position: relative;
      border: 5px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #afebff, #d7f5d7);
      box-shadow: 0 10px 24px rgba(27, 69, 84, 0.14);
      width: 100%;
      max-width: 100%;
      height: min(72vh, 540px);
      min-height: 320px;
      aspect-ratio: 16 / 9;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: linear-gradient(180deg, #c6ebff 0%, #dfeefc 40%, #d9f7db 100%);
    }

    .game-shell.force-landscape {
      width: 100vw;
      max-width: none;
      min-height: 100vh;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #bfeaff;
      box-shadow: none;
    }

    .game-shell.force-landscape header,
    .game-shell.force-landscape .instructions {
      display: none;
    }

    .game-shell.force-landscape .screen {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      min-height: 100vh;
      border: 0;
      border-radius: 0;
      aspect-ratio: auto;
    }

    .game-shell.force-landscape .hud {
      position: absolute;
      z-index: 11;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      margin: 0;
      pointer-events: none;
    }

    .level-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 3;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      color: #284d5d;
      font-size: 0.8rem;
      font-weight: 800;
      pointer-events: none;
    }

    .touch-controls {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      padding: 14px 16px 16px;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .joystick-wrap {
      position: relative;
      width: 118px;
      height: 118px;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      border-radius: 50%;
      background: rgba(29, 56, 64, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.34);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.08);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .joystick-wrap.is-active {
      background: rgba(29, 56, 64, 0.34);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.12), 0 0 16px rgba(91, 168, 255, 0.28);
    }

    .joystick-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.08);
    }

    .joystick-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46%;
      height: 46%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.38);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      transform: translate(calc(-50% + var(--stick-x, 0px)), calc(-50% + var(--stick-y, 0px)));
      transition: transform 0.08s ease-out;
    }

    .joystick-arrow {
      position: absolute;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.86rem;
      font-weight: 700;
      pointer-events: none;
    }

    .joystick-arrow.up { top: 8px; left: 50%; transform: translateX(-50%); }
    .joystick-arrow.right { right: 8px; top: 50%; transform: translateY(-50%); }
    .joystick-arrow.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .joystick-arrow.left { left: 8px; top: 50%; transform: translateY(-50%); }

    .action-pad {
      position: relative;
      width: 136px;
      height: 116px;
      pointer-events: none;
    }

    .action-btn {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      background: rgba(59, 109, 158, 0.34);
      color: white;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 25px rgba(21, 52, 80, 0.18);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .action-btn.jump {
      left: 0;
      bottom: 0;
    }

    .action-btn.skill {
      right: 0;
      top: 0;
      background: rgba(151, 86, 62, 0.34);
    }

    .action-btn.is-pressed {
      transform: scale(1.1);
      box-shadow: 0 0 18px rgba(91, 168, 255, 0.72), 0 0 30px rgba(91, 168, 255, 0.4);
      background: rgba(74, 150, 255, 0.42);
    }

    .action-btn.skill.is-pressed {
      box-shadow: 0 0 18px rgba(91, 168, 255, 0.72), 0 0 30px rgba(91, 168, 255, 0.4);
      background: rgba(81, 143, 255, 0.44);
    }

    .instructions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #617a82;
      font-size: 0.88rem;
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid #d9e5e8;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #f8fbff;
      color: #23485d;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .orientation-screen {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 28, 38, 0.7);
      backdrop-filter: blur(8px);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .orientation-screen[hidden] {
      display: none;
    }

    .orientation-panel {
      max-width: 420px;
      padding: 24px 22px 22px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      background: rgba(24, 42, 52, 0.88);
      box-shadow: 0 22px 60px rgba(13, 23, 30, 0.3);
    }

    .rotate-icon {
      display: inline-grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
      border-radius: 18px;
      background: rgba(50, 137, 133, 0.2);
      font-size: 2rem;
    }

    .orientation-panel h2 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 3.5vw, 2.1rem);
    }

    .orientation-panel p {
      margin: 0 0 18px;
      color: #dfeaf0;
      line-height: 1.7;
      font-size: 0.98rem;
    }

    .orientation-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .orientation-btn {
      min-width: 140px;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      background: #2f9a7d;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .orientation-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .overlay {
      position: absolute;
      z-index: 7;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(15, 26, 38, 0.22);
      backdrop-filter: blur(2px);
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay-box {
      width: min(390px, 84%);
      padding: 22px 20px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 253, 249, 0.96);
      text-align: center;
      box-shadow: 0 18px 40px rgba(12, 25, 33, 0.18);
      animation: popup 0.18s ease-out;
    }

    @keyframes popup {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .overlay-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(48, 144, 110, 0.12);
      font-size: 1.7rem;
    }

    .overlay-box h3 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 1.8rem);
      color: #173440;
    }

    .overlay-box p {
      margin: 10px 0 18px;
      line-height: 1.7;
      color: #536b76;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .overlay-btn {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 9px 16px;
      font-weight: 800;
      cursor: pointer;
      background: #2f9a7d;
      color: white;
    }

    .overlay-btn.secondary {
      background: #eff4f7;
      color: #23485d;
      border: 1px solid rgba(35, 72, 93, 0.15);
    }

    @media (pointer: coarse), (max-width: 780px) {
      body {
        padding: 0;
        background: linear-gradient(180deg, #bfe7ff, #d7f7f4);
      }

      .game-shell {
        width: 100%;
        min-height: 100dvh;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        display: flex;
        flex-direction: column;
      }

      .game-shell header,
      .instructions {
        display: none;
      }

      .hud {
        position: relative;
        z-index: 11;
        top: auto;
        left: auto;
        right: auto;
        gap: 6px;
        margin: 0;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-left)) 0;
        pointer-events: none;
      }

      .hud-item {
        min-height: 34px;
        font-size: 0.68rem;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.78);
        border-color: rgba(255, 255, 255, 0.8);
      }

      .sound-toggle {
        font-size: 0;
      }

      .sound-toggle::first-letter {
        font-size: 0.9rem;
      }

      .screen {
        position: relative;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        height: calc(100dvh - 120px);
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .screen canvas {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }

      .touch-controls {
        display: flex;
        padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .joystick-wrap {
        width: clamp(82px, 20vw, 112px);
        height: clamp(82px, 20vw, 112px);
      }

      .action-pad {
        width: clamp(110px, 26vw, 136px);
        height: clamp(94px, 22vw, 116px);
      }

      .action-btn {
        width: clamp(52px, 12vw, 60px);
        height: clamp(52px, 12vw, 60px);
        font-size: clamp(0.7rem, 2.8vw, 0.82rem);
      }

      .level-tag {
        top: max(48px, calc(env(safe-area-inset-top) + 44px));
        left: max(10px, env(safe-area-inset-left));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Stickman Platform Quest</p>
        <h1>火柴人勇者：飛空島的黃金樹</h1>
      </div>
      <button class="restart-btn" id="restartBtn" type="button">重新開始本關 ↻</button>
    </header>

    <section class="hud" aria-label="遊戲狀態">
      <div class="hud-item">關卡 <strong id="levelDisplay">1 / 4</strong></div>
      <div class="hud-item">生命 <strong id="lives">♥ ♥ ♥</strong></div>
      <div class="hud-item">分數 <strong id="score">0</strong></div>
      <div class="hud-item">寶劍 <strong id="weaponDisplay">⚔️ +0</strong></div>
      <button class="hud-item sound-toggle" id="soundToggle" type="button" aria-label="關閉音效與音樂" aria-pressed="true">🔊 音效＋音樂</button>
    </section>

    <section class="screen" aria-label="遊戲畫面">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div class="level-tag" id="levelName">第 1 關・新手訓練</div>

      <div class="touch-controls" aria-label="觸控操作">
        <div class="joystick-wrap" id="joystick" aria-label="方向輪盤">
          <div class="joystick-ring"></div>
          <span class="joystick-arrow up">▲</span>
          <span class="joystick-arrow right">▶</span>
          <span class="joystick-arrow down">▼</span>
          <span class="joystick-arrow left">◀</span>
          <div class="joystick-handle" id="joystickHandle"></div>
        </div>

        <div class="action-pad">
          <button class="action-btn jump" type="button" data-action="jump">跳躍</button>
          <button class="action-btn skill" type="button" data-action="skill">火球</button>
        </div>
      </div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-box">
          <div class="overlay-icon" id="overlayIcon">🏁</div>
          <h3 id="overlayTitle">恭喜過關！</h3>
          <p id="overlayMessage"></p>
          <div class="overlay-actions">
            <button class="overlay-btn" id="nextLevelBtn" type="button">下一關 →</button>
            <button class="overlay-btn secondary" id="retryBtn" type="button" hidden>重試</button>
            <button class="overlay-btn secondary" id="lifeRewardBtn" type="button" hidden>❤️ 生命 +1</button>
            <button class="overlay-btn secondary" id="swordRewardBtn" type="button" hidden>⚔️ 寶劍升級</button>
          </div>
        </div>
      </div>
    </section>

    <div class="instructions">
      <span>躲開陷阱、擊退敵人、收集金幣，喚醒黃金樹。</span>
      <div class="key-list" aria-label="操作說明">
        <kbd>←</kbd><kbd>→</kbd><span>移動</span>
        <kbd>Space</kbd><span>跳躍</span>
        <kbd>X</kbd><span>火球</span>
        <kbd>R</kbd><span>重置</span>
      </div>
    </div>
  </main>

  <section class="orientation-screen" id="orientationScreen" aria-label="選擇遊戲方向">
    <div class="orientation-panel">
      <div class="rotate-icon" aria-hidden="true">📱↻</div>
      <h2>選擇遊戲方向</h2>
      <p>建議橫向遊玩，操作更舒適；也可切換到直向模式。請選擇你的遊玩方向，開始冒險。</p>
      <div class="orientation-actions">
        <button class="orientation-btn" id="startLandscapeBtn" type="button">橫向遊玩</button>
        <button class="orientation-btn secondary" id="startPortraitBtn" type="button">直向遊玩</button>
      </div>
    </div>
  </section>

  <script>

      function playTone(kind) {
        if (!game.audioEnabled) return;
        ensureAudio();
        const ctxAudio = game.audioContext;
        if (!ctxAudio) return;

        const tones = {
          jump: { start: 420, end: 700, duration: 0.12, wave: "triangle" },
          fireball: { start: 650, end: 90, duration: 0.18, wave: "sawtooth" },
          coin: { start: 900, end: 1180, duration: 0.09, wave: "sine" },
          hit: { start: 200, end: 80, duration: 0.20, wave: "square" },
          clear: { start: 520, end: 1100, duration: 0.24, wave: "sine" },
          stomp: { start: 300, end: 500, duration: 0.14, wave: "triangle" }
        };
        const config = tones[kind];
        if (!config) return;

        const now = ctxAudio.currentTime;
        const oscillator = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        oscillator.type = config.wave;
        oscillator.frequency.setValueAtTime(config.start, now);
        oscillator.frequency.exponentialRampToValueAtTime(config.end, now + config.duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + config.duration);
        oscillator.connect(gain);
        gain.connect(ctxAudio.destination);
        oscillator.start(now);
        oscillator.stop(now + config.duration);
      }

      function scheduleMusicNote(frequency, startTime, duration, volume, wave) {
        const ctxAudio = game.audioContext;

        const gain = ctxAudio.createGain();
        oscillator.type = wave;
        oscillator.frequency.setValueAtTime(frequency, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        oscillator.connect(gain);
        gain.connect(ctxAudio.destination);
        oscillator.start(startTime);
        oscillator.stop(startTime + duration);
      }

            }
            game.nextMusicTime += beatDuration;

      function placeHazardSafely(hazard, levelWidth, usePatrolRange = false) {
        const hazardWidth = hazard.w || 0;
        const flagX = levelWidth - 38;
        const minX = usePatrolRange && Number.isFinite(hazard.min)
          ? Math.max(0, hazard.min)
          : Math.max(0, hazard.x - 36);
        const maxX = usePatrolRange && Number.isFinite(hazard.max)
          ? Math.min(levelWidth - hazardWidth, hazard.max - hazardWidth)
          : Math.min(levelWidth - hazardWidth, hazard.x + 36);
        const rangeEnd = Math.max(minX, maxX);
        const isSafe = (x) => x + hazardWidth <= flagX - FLAG_SAFE_RADIUS || x >= flagX + FLAG_SAFE_RADIUS;

        for (let attempt = 0; attempt < MAX_HAZARD_PLACEMENT_ATTEMPTS; attempt += 1) {
          const x = minX + Math.random() * (rangeEnd - minX);
          if (isSafe(x)) return { ...hazard, x };
        }

        const safeLeftEnd = Math.min(levelWidth - hazardWidth, flagX - FLAG_SAFE_RADIUS - hazardWidth);
        if (safeLeftEnd >= 0) {
          return { ...hazard, x: Math.max(0, Math.min(hazard.x, safeLeftEnd)) };
        }

        const safeRightStart = flagX + FLAG_SAFE_RADIUS;
        if (safeRightStart <= levelWidth - hazardWidth) {
          return { ...hazard, x: Math.max(safeRightStart, Math.min(hazard.x, levelWidth - hazardWidth)) };
        }

        return null;
      }

      function trapStateMachine(trap, delta) {
        trap.stateTimer += delta;

        const hiddenTime = trap.cooldown || 1.5;
        const warningTime = 0.5;
        const riseTime = 0.14;
        const holdTime = 0.85;
        const retractTime = 0.35;

        if (trap.state === 0) {
          trap.isDangerous = false;
          trap.phase = 0;
          if (trap.stateTimer >= hiddenTime) {
            trap.state = 1;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 1) {
          trap.isDangerous = false;
          trap.phase = 0;
          if (trap.stateTimer >= warningTime) {
            trap.state = 2;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 2) {
          trap.isDangerous = true;
          trap.phase = Math.min(1, trap.stateTimer / riseTime);
          if (trap.stateTimer >= holdTime) {
            trap.state = 3;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 3) {
          trap.isDangerous = false;
          trap.phase = 1 - Math.min(1, trap.stateTimer / retractTime);
          if (trap.stateTimer >= retractTime) {
            trap.state = 0;
            trap.stateTimer = 0;
          }
        }
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function beingOnGroundForPlatform(actor, solid) {
        const box = { x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
        const below = actor.vy >= 0 && actor.y + PLAYER_HEIGHT <= solid.y + 10;
        if (!rectsOverlap(box, solid)) return false;
        if (below) {
          actor.y = solid.y - PLAYER_HEIGHT;
          actor.vy = 0;
          actor.grounded = true;
          return true;
        }
        return false;
      }

      function moveEntityWithPlatform(actor, solids, delta) {
        actor.x += actor.vx * delta;
        for (const solid of solids) {
          if (rectsOverlap({ x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (actor.vx > 0) actor.x = solid.x - PLAYER_WIDTH;
            else if (actor.vx < 0) actor.x = solid.x + solid.w;
          }
        }

        const prevY = actor.y;
        actor.vy += GRAVITY * delta;
        actor.y += actor.vy * delta;
        actor.grounded = false;

        for (const solid of solids) {
          if (rectsOverlap({ x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (actor.vy >= 0 && prevY + PLAYER_HEIGHT <= solid.y + 8) {
              actor.y = solid.y - PLAYER_HEIGHT;
              actor.vy = 0;
              actor.grounded = true;
            } else if (actor.vy < 0 && prevY >= solid.y + solid.h - 4) {
              actor.y = solid.y + solid.h;
              actor.vy = 0;
            }
          }
        }
      }

      function collectCoins() {
        const box = { x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
        for (const coin of game.level.coins) {
          if (coin.collected) continue;
          if (rectsOverlap(box, { x: coin.x - 12, y: coin.y - 12, w: 24, h: 24 })) {
            coin.collected = true;
            collectedCoinIds.add(coin.id);
            game.score += 100;
            playTone("coin");
            updateHud();
          }
        }
      }

      function updateFireballs(delta) {
        for (let i = game.fireballs.length - 1; i >= 0; i -= 1) {
          const ball = game.fireballs[i];
          const previousY = ball.y;
          ball.x += ball.vx * delta;
          ball.y += ball.vy * delta;
          ball.vy += 520 * delta;
          ball.life -= delta;

          const firebox = { x: ball.x - 12, y: ball.y - 12, w: 24, h: 24 };
          let hit = false;

          for (const enemy of game.level.enemies) {
            if (!enemy.alive) continue;
            if (rectsOverlap(firebox, enemy)) {
              enemy.alive = false;
              game.score += 150;
              hit = true;
              playTone("stomp");
              updateHud();
              break;
            }
          }

          const boss = game.level.boss;
          if (!hit && boss && boss.hp > 0 && rectsOverlap(firebox, boss)) {
            boss.hp -= 1 + game.swordLevel;
            game.score += 250;
            hit = true;
            playTone("stomp");
            updateHud();
          }

          if (!hit) {
            for (const bird of game.attackingBirds) {
              if (!bird.alive) continue;
              if (rectsOverlap(firebox, { x: bird.x - 16, y: bird.y - 9, w: 32, h: 18 })) {
                bird.alive = false;
                game.score += 120;
                hit = true;
                playTone("stomp");
                updateHud();
                break;
              }
            }
          }

          if (!hit && ball.bouncesLeft > 0 && ball.vy > 0) {
            const landingSurface = [...game.level.ground, ...game.level.platforms].find((surface) =>
              ball.x >= surface.x - 12
              && ball.x <= surface.x + surface.w + 12
              && previousY + 12 <= surface.y
              && ball.y + 12 >= surface.y
            );
            if (landingSurface) {
              ball.y = landingSurface.y - 12;
              ball.vy = -260;
              ball.bouncesLeft -= 1;
            }
          }

          if (hit || ball.life <= 0 || ball.x < 0 || ball.x > game.level.width) {
            game.fireballs.splice(i, 1);
          }
        }
      }

      function fireEnemyProjectile(source, type) {
        const startX = source.x + source.w / 2;
        const startY = source.y + source.h * 0.45;
        const targetX = player.x + PLAYER_WIDTH / 2;
        const targetY = player.y + PLAYER_HEIGHT / 2;
        const dx = targetX - startX;
        const dy = targetY - startY;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const speed = type === "acid" ? 235 : 275;

        game.enemyProjectiles.push({
          x: startX,
          y: startY,
          vx: dx / distance * speed,
          vy: dy / distance * speed - (type === "acid" ? 65 : 0),
          gravity: type === "acid" ? 180 : 0,
          type,
          life: 3
        });
      }

      function updateEnemies(delta) {
        const canAttack = game.currentLevelIndex >= 2;
        for (let index = 0; index < game.level.enemies.length; index += 1) {
          const enemy = game.level.enemies[index];
          if (!enemy.alive) continue;

          enemy.x += enemy.dir * enemy.speed * delta;
          if (enemy.x <= enemy.min) {
            enemy.x = enemy.min;
            enemy.dir = 1;
          } else if (enemy.x + enemy.w >= enemy.max) {
            enemy.x = Math.max(enemy.min, enemy.max - enemy.w);
            enemy.dir = -1;
          }

          if (!canAttack) continue;
          enemy.attackCooldown -= delta;
          if (enemy.attackCooldown <= 0 && Math.abs(player.x - enemy.x) < 540) {
            fireEnemyProjectile(enemy, enemy.attackType);
            enemy.attackCooldown = 2.2 + Math.random() * 1.2;
          }
        }

        const boss = game.level.boss;
        if (!boss || boss.hp <= 0) return;
        boss.x += boss.dir * boss.speed * delta;
        if (boss.x <= boss.min) {
          boss.x = boss.min;
          boss.dir = 1;
        } else if (boss.x + boss.w >= boss.max) {
          boss.x = Math.max(boss.min, boss.max - boss.w);
          boss.dir = -1;
        }
        if (!canAttack) return;
        boss.attackCooldown -= delta;
        if (boss.attackCooldown <= 0 && Math.abs(player.x - boss.x) < 620) {
          fireEnemyProjectile(boss, "acid");
          boss.attackCooldown = 2.8;
        }
      }

      function updateEnemyProjectiles(delta) {
        const playerBox = { x: player.x + 4, y: player.y + 4, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 8 };
        for (let index = game.enemyProjectiles.length - 1; index >= 0; index -= 1) {
          const projectile = game.enemyProjectiles[index];
          projectile.x += projectile.vx * delta;
          projectile.y += projectile.vy * delta;
          projectile.vy += projectile.gravity * delta;
          projectile.life -= delta;
          const radius = projectile.type === "acid" ? 10 : 11;
          const projectileBox = { x: projectile.x - radius, y: projectile.y - radius, w: radius * 2, h: radius * 2 };
          if (rectsOverlap(playerBox, projectileBox)) {
            loseLife();
            game.enemyProjectiles.splice(index, 1);
            continue;
          }
          if (projectile.life <= 0 || projectile.y > FLOOR_Y + 20 || projectile.x < 0 || projectile.x > game.level.width) {
            game.enemyProjectiles.splice(index, 1);
          }
        }
      }

      function updateAttackingBirds(delta) {
        game.birdAttackTimer -= delta;
        if (game.birdAttackTimer <= 0) {
          const direction = Math.random() < 0.5 ? -1 : 1;
          const x = Math.max(24, Math.min(game.level.width - 24, player.x + direction * (WIDTH * 0.55)));
          const startY = 100 + Math.random() * 95;
          const targetX = player.x + PLAYER_WIDTH / 2;
          const targetY = player.y + PLAYER_HEIGHT / 2;
          const dx = targetX - x;
          const dy = targetY - startY;
          const distance = Math.max(1, Math.hypot(dx, dy));
          game.attackingBirds.push({
            x,
            y: startY,
            vx: dx / distance * 235,
            vy: dy / distance * 235,
            life: 3.2,
            alive: true
          });
          game.birdAttackTimer = 8 + Math.random() * 5;
        }

        const playerBox = { x: player.x + 4, y: player.y + 4, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 8 };
        for (let index = game.attackingBirds.length - 1; index >= 0; index -= 1) {
          const bird = game.attackingBirds[index];
          bird.x += bird.vx * delta;
          bird.y += bird.vy * delta;
          bird.life -= delta;
          if (bird.alive && rectsOverlap(playerBox, { x: bird.x - 16, y: bird.y - 9, w: 32, h: 18 })) {
            bird.alive = false;
            loseLife();
          }
          if (!bird.alive || bird.life <= 0 || bird.y > FLOOR_Y + 30 || bird.x < 0 || bird.x > game.level.width) {
            game.attackingBirds.splice(index, 1);
          }
        }
      }

      function castFireball() {
        if (game.state !== "playing" || game.skillCooldown > 0) return;
        game.skillCooldown = 0.75;
        playTone("fireball");
        game.fireballs.push({
          x: player.x + PLAYER_WIDTH / 2 + player.facing * 24,
          y: player.y + PLAYER_HEIGHT * 0.45,
          vx: player.facing * 620,
          vy: 0,
          life: 2.0,
          bouncesLeft: 2
        });
      }

      function handleEnemyCollisions() {
        const playerBox = { x: player.x + 4, y: player.y + 2, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 4 };
        const prevBottom = player.y + PLAYER_HEIGHT;

        for (const enemy of game.level.enemies) {
          if (!enemy.alive) continue;
          if (rectsOverlap(playerBox, enemy)) {
            if (player.vy > 0 && prevBottom <= enemy.y + 10) {
              enemy.alive = false;
              player.vy = -JUMP_VELOCITY * 0.54;
              game.score += 150;
              playTone("stomp");
              updateHud();
            } else {
              loseLife();
              return;
            }
          }
        }

        const boss = game.level.boss;
        if (boss && boss.hp > 0 && rectsOverlap(playerBox, boss)) {
          if (player.vy > 0 && prevBottom <= boss.y + 12) {
            boss.hp -= 1 + game.swordLevel;
            player.vy = -JUMP_VELOCITY * 0.58;
            game.score += 250;
            playTone("stomp");
            updateHud();
          } else {
            loseLife();
          }
        }
      }

      function checkSpikes() {
        const box = { x: player.x + 4, y: player.y + 3, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 6 };
        for (const spike of game.level.spikes) {
          const collisionBox = { x: spike.x + 2, y: FLOOR_Y - spike.h, w: spike.w - 4, h: spike.h + 8 };
          if (spike.isDangerous && rectsOverlap(box, collisionBox)) {
            loseLife();
            return;
          }
        }
      }

      function updateSpikes(delta) {
        for (const spike of game.level.spikes) {
          trapStateMachine(spike, delta);
        }
      }

      function handleExit() {
        const finishZone = { x: game.level.width - 86, y: FLOOR_Y - 82, w: 48, h: 82 };
        if (!game.level.boss || game.level.boss.hp <= 0) {
          if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, finishZone)) {
            completeLevel();
          }
        }
      }

      function updateControls(delta) {
        const keyboardLeft = keys.has("ArrowLeft") || keys.has("KeyA");
        const keyboardRight = keys.has("ArrowRight") || keys.has("KeyD");
        const stickX = joystickState.x;

        let moveRequest = 0;
        if (keyboardLeft && !keyboardRight) moveRequest = -1;
        else if (keyboardRight && !keyboardLeft) moveRequest = 1;
        else if (Math.abs(stickX) > 0.14) moveRequest = stickX;

        if (moveRequest !== 0) {
          player.facing = moveRequest > 0 ? 1 : -1;
        }

        player.vx = moveRequest * SPEED;

        if (joystickState.y < -0.6 && !joystickState.jumpTriggered) {
          game.jumpQueued = true;
          joystickState.jumpTriggered = true;
        } else if (joystickState.y > -0.25) {
          joystickState.jumpTriggered = false;
        }

        if (game.jumpQueued && player.grounded) {
          player.vy = -JUMP_VELOCITY;
          player.grounded = false;
          playTone("jump");
        }
        game.jumpQueued = false;
        if (joystickState.y > 0.65 && !player.grounded) {
          player.vy = Math.max(player.vy, JUMP_VELOCITY * 0.65);
        }

        if (game.skillQueued) {
          castFireball();
          game.skillQueued = false;
        }

        if (game.skillCooldown > 0) {
          game.skillCooldown = Math.max(0, game.skillCooldown - delta);
        }
      }

      function updatePlayer(delta) {
        const solids = [...game.level.ground, ...game.level.platforms];

        const prevY = player.y;
        moveEntityWithPlatform(player, solids, delta);

        if (player.y > HEIGHT + 80) {
          loseLife();
          return;
        }

        if (player.x < 0) player.x = 0;
        if (player.x > game.level.width - PLAYER_WIDTH) player.x = game.level.width - PLAYER_WIDTH;

        for (const solid of solids) {
          if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (player.vy >= 0 && prevY + PLAYER_HEIGHT <= solid.y + 8) {
              player.y = solid.y - PLAYER_HEIGHT;
              player.vy = 0;
              player.grounded = true;
            }
          }
        }

        collectCoins();
        handleEnemyCollisions();
        if (game.state !== "playing") return;
        checkSpikes();
        handleExit();

        const targetCamera = Math.max(0, Math.min(game.level.width - WIDTH, player.x - WIDTH * 0.45));
        game.cameraX += (targetCamera - game.cameraX) * Math.min(1, delta * 6);
      }

      function update(delta) {
        if (game.state !== "playing") {
          return;
        }

        const step = Math.min(delta, 0.033);
        game.animationTime += step;
        updateJoystickHandle(step);
        player.invulnerable = Math.max(0, player.invulnerable - step);
        updateSpikes(step);
        updateControls(step);
        updateEnemies(step);
        updateFireballs(step);
        updateEnemyProjectiles(step);
        updateAttackingBirds(step);
        updatePlayer(step);
        if (game.state !== "playing") return;
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        sky.addColorStop(0, "#9cd8f3");
        sky.addColorStop(1, "#deefff");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let i = 0; i < 30; i += 1) {
          const x = ((i * 131.5 - game.cameraX * 0.08) % (WIDTH + 40)) - 20;
          const y = 40 + (i * 28) % 200;
          ctx.fillStyle = i % 5 === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.55)";
          ctx.fillRect(x, y, 1.8, 1.8);
        }

        ctx.fillStyle = "#f6d76d";
        ctx.beginPath();
        ctx.arc(792 - game.cameraX * 0.12, 92, 36, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(134, 197, 160, 0.5)";
        for (let i = 0; i < 7; i += 1) {
          const mx = i * 180 - game.cameraX * 0.12;
          ctx.beginPath();
          ctx.moveTo(mx, HEIGHT);
          ctx.lineTo(mx + 90, 260 + (i % 3) * 18);
          ctx.lineTo(mx + 180, HEIGHT);
          ctx.closePath();
          ctx.fill();
        }

        drawSkyBirds();
        drawPineForest();
      }

      function drawBird(x, y, size, phase, color) {
        const wingLift = Math.sin(phase) * size * 4;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = Math.max(1.2, size * 1.6);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x - size * 9, y);
        ctx.quadraticCurveTo(x - size * 5, y - size * 5 - wingLift, x, y);
        ctx.quadraticCurveTo(x + size * 5, y - size * 5 - wingLift, x + size * 9, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(x, y + size, size * 3, size * 1.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(x + size * 2, y + size);
        ctx.lineTo(x + size * 5, y + size * 0.5);
        ctx.lineTo(x + size * 4, y + size * 1.6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawSkyBirds() {
        for (const bird of skyBirds) {
          const x = ((bird.x + game.animationTime * bird.speed) % (WIDTH + 80)) - 40;
          drawBird(x, bird.y, bird.size, game.animationTime * 5 + bird.phase, "rgba(45, 73, 82, 0.62)");
        }
      }

      function drawPine(x, baseY, size, colors) {
        const trunkWidth = Math.max(3, size * 0.11);
        ctx.fillStyle = colors.trunk;
        ctx.fillRect(x - trunkWidth / 2, baseY - size * 0.18, trunkWidth, size * 0.2);
        for (let layer = 0; layer < 3; layer += 1) {
          const top = baseY - size + layer * size * 0.24;
          const halfWidth = size * (0.25 + layer * 0.1);
          const bottom = top + size * 0.48;
          ctx.fillStyle = colors.shade[layer];
          ctx.beginPath();
          ctx.moveTo(x, top);
          ctx.lineTo(x - halfWidth, bottom);
          ctx.lineTo(x + halfWidth, bottom);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = colors.light[layer];
          ctx.beginPath();
          ctx.moveTo(x, top + size * 0.06);
          ctx.lineTo(x - halfWidth * 0.7, bottom - size * 0.04);
          ctx.lineTo(x, bottom - size * 0.12);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawPineForest() {
        const layers = [
          { parallax: 0.16, baseY: 412, size: 96, spacing: 82, offset: 23,
            shade: ["#6e9a77", "#557e62", "#426b52"], light: ["#8eb596", "#719d7a", "#5a8767"], trunk: "#765a44" },
          { parallax: 0.28, baseY: 455, size: 128, spacing: 104, offset: 61,
            shade: ["#477b59", "#35694a", "#2d5a40"], light: ["#67966e", "#4d805d", "#3e7152"], trunk: "#654b38" },
          { parallax: 0.4, baseY: 500, size: 158, spacing: 132, offset: 7,
            shade: ["#315d42", "#254e38", "#204330"], light: ["#4c7a54", "#39684a", "#2f5b41"], trunk: "#594331" }
        ];
        for (let layerIndex = 0; layerIndex < layers.length; layerIndex += 1) {
          const layer = layers[layerIndex];
          const colors = {
            shade: layer.shade,
            light: layer.light,
            trunk: layer.trunk
          };
          const count = Math.ceil(WIDTH / layer.spacing) + 2;
          for (let index = -1; index < count; index += 1) {
            const worldX = index * layer.spacing + layer.offset;
            const screenX = ((worldX - game.cameraX * layer.parallax + WIDTH) % (WIDTH + layer.spacing)) - layer.spacing / 2;
            const size = layer.size * (0.8 + ((index * 17 + 50) % 7) / 20);
            drawPine(screenX, layer.baseY, size, colors);
          }
        }
      }

      function drawCrackedStoneTile(x, y, w, h) {
        const seed = Math.abs(Math.sin(x * 12.9898 + y * 78.233 + game.level.tileSeed) * 43758.5453) % 1;
        let randomState = seed || 0.5;
        const random = () => {
          randomState = (randomState * 9301 + 49297) % 233280;
          return randomState / 233280;
        };
        ctx.fillStyle = "#48515c";
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = "rgba(25, 30, 36, 0.75)";
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, Math.max(0, w - 1), Math.max(0, h - 1));
        ctx.strokeStyle = "rgba(28, 34, 41, 0.75)";
        ctx.lineWidth = 1.25;
        const crackCount = 1 + Math.floor(random() * 3);
        for (let index = 0; index < crackCount; index += 1) {
          const startX = x + 5 + random() * Math.max(1, w - 12);
          const startY = y + 3 + random() * Math.max(1, h - 8);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(startX + (random() - 0.5) * 8, startY + 4 + random() * 5);
          ctx.lineTo(startX + (random() - 0.5) * 16, startY + 8 + random() * 8);
          ctx.stroke();
        }
      }

      function drawGround() {
        for (const segment of game.level.ground) {
          const sx = segment.x - game.cameraX;
          if (sx + segment.w < -20 || sx > WIDTH + 20) continue;
          ctx.save();
          ctx.beginPath();
          ctx.rect(sx, segment.y, segment.w, segment.h);
          ctx.clip();
          const tileW = 56;
          const tileH = 34;
          for (let row = 0; row * tileH < segment.h; row += 1) {
            const offset = row % 2 === 0 ? 0 : tileW / 2;
            for (let x = -offset; x < segment.w; x += tileW) {
              const drawX = sx + x;
              const drawY = segment.y + row * tileH;
              drawCrackedStoneTile(drawX, drawY, tileW, tileH);
            }
          }
          ctx.restore();
        }
      }

      function drawPlatforms() {
        const solids = [...game.level.platforms, ...game.level.ground];
        for (const platform of game.level.platforms) {
          const sx = platform.x - game.cameraX;
          if (sx + platform.w < -10 || sx > WIDTH + 10) continue;
          ctx.fillStyle = "#b57d53";
          ctx.fillRect(sx, platform.y, platform.w, platform.h);
          ctx.fillStyle = "#f0c87d";
          ctx.fillRect(sx, platform.y, platform.w, 6);
          ctx.fillStyle = "rgba(120, 70, 40, 0.2)";
          for (let i = 0; i < platform.w; i += 16) {
            ctx.fillRect(sx + i, platform.y + 8, 8, 2);
          }
        }

      }

      function drawSpikes() {
        for (const spike of game.level.spikes) {
          const sx = spike.x - game.cameraX;
          if (sx + spike.w < -10 || sx > WIDTH + 10) continue;

          const slotX = sx - 8;
          const slotWidth = spike.w + 16;
          ctx.fillStyle = "#252d36";
          ctx.fillRect(slotX, FLOOR_Y - 4, slotWidth, 20);
          ctx.fillStyle = "rgba(12, 17, 23, 0.65)";
          ctx.fillRect(slotX + 4, FLOOR_Y, slotWidth - 8, 12);
          ctx.fillStyle = "rgba(151, 164, 176, 0.28)";
          ctx.fillRect(slotX, FLOOR_Y - 4, slotWidth, 2);

          if (spike.state === 1) {
            const pulse = 0.35 + (Math.sin((spike.stateTimer / 0.5) * Math.PI * 4 - Math.PI / 2) + 1) * 0.3;
            ctx.save();
            ctx.globalAlpha = pulse;
            ctx.strokeStyle = "#ff403b";
            ctx.shadowColor = "#ff302a";
            ctx.shadowBlur = 12;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(slotX + 8, FLOOR_Y + 2);
            ctx.lineTo(slotX + slotWidth - 8, FLOOR_Y + 2);
            ctx.stroke();
            ctx.restore();
          }

          if (spike.state !== 2 && spike.state !== 3) continue;
          const riseProgress = Math.max(0, Math.min(1, spike.phase || 0));
          const maxHeight = 34;
          const baseY = FLOOR_Y + 8;
          const activeHeight = riseProgress * maxHeight;
          const tipY = baseY - activeHeight;
          const count = Math.max(2, Math.floor(spike.w / 16));
          const unit = spike.w / count;

          ctx.fillStyle = spike.isDangerous ? "#db6a59" : "#7d8d9b";
          ctx.strokeStyle = spike.isDangerous ? "#a93d3a" : "#596978";

          for (let i = 0; i < count; i += 1) {
            const px = sx + i * unit;
            const yTop = tipY;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.lineTo(px + unit * 0.5, yTop);
            ctx.lineTo(px + unit, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }
      }

      function drawCoins() {
        for (const coin of game.level.coins) {
          if (coin.collected) continue;
          const x = coin.x - game.cameraX;
          const bob = Math.sin(game.animationTime * 5 + coin.x * 0.7) * 4;
          ctx.fillStyle = "rgba(245, 196, 78, 0.23)";
          ctx.beginPath();
          ctx.arc(x, coin.y + bob, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f5ca49";
          ctx.strokeStyle = "#d9982e";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, coin.y + bob, 9, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#fff2ae";
          ctx.fillRect(x - 1, coin.y + bob - 7, 2, 14);
        }
      }

      function drawRoundedRectPath(context, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        context.beginPath();
        context.moveTo(x + r, y);
        context.lineTo(x + width - r, y);
        context.quadraticCurveTo(x + width, y, x + width, y + r);
        context.lineTo(x + width, y + height - r);
        context.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
        context.lineTo(x + r, y + height);
        context.quadraticCurveTo(x, y + height, x, y + height - r);
        context.lineTo(x, y + r);
        context.quadraticCurveTo(x, y, x + r, y);
        context.closePath();
      }

      function drawEnemies() {
        for (const enemy of game.level.enemies) {
          if (!enemy.alive) continue;
          const x = enemy.x - game.cameraX;
          ctx.fillStyle = "#d45a52";
          drawRoundedRectPath(ctx, x, enemy.y + 10, enemy.w, enemy.h - 10, 9);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(x + 9, enemy.y + 18, 4, 0, Math.PI * 2);
          ctx.arc(x + 20, enemy.y + 18, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#1b1d27";
          ctx.beginPath();
          ctx.arc(x + 9, enemy.y + 18, 1.8, 0, Math.PI * 2);
          ctx.arc(x + 20, enemy.y + 18, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        const boss = game.level.boss;
        if (boss && boss.hp > 0) {
          const x = boss.x - game.cameraX;
          ctx.fillStyle = "#69366a";
          drawRoundedRectPath(ctx, x, boss.y + 10, boss.w, boss.h - 10, 16);
          ctx.fill();
          ctx.fillStyle = "#f19a72";
          ctx.beginPath();
          ctx.moveTo(x + 8, boss.y + 16);
          ctx.lineTo(x + 12, boss.y + 2);
          ctx.lineTo(x + 28, boss.y + 18);
          ctx.lineTo(x + 45, boss.y + 2);
          ctx.lineTo(x + 50, boss.y + 18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fff4dd";
          ctx.fillRect(x + 14, boss.y + 30, 12, 7);
          ctx.fillRect(x + 33, boss.y + 30, 12, 7);
          ctx.fillStyle = "#2a1b27";
          ctx.fillRect(x + 17, boss.y + 31, 5, 4);
          ctx.fillRect(x + 37, boss.y + 31, 5, 4);

          ctx.fillStyle = "#5c3752";
          ctx.fillRect(x, boss.y - 12, boss.w, 6);
          ctx.fillStyle = "#ffc86f";
          ctx.fillRect(x, boss.y - 12, boss.w * (boss.hp / boss.maxHp), 6);
        }
      }

      function drawFireballs() {
        for (const fireball of game.fireballs) {
          const x = fireball.x - game.cameraX;
          const y = fireball.y;
          ctx.save();
          ctx.translate(x, y);
          ctx.shadowBlur = 18;
          ctx.shadowColor = "#ff8e3d";
          ctx.fillStyle = "#ff8d4f";
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffe082";
          ctx.beginPath();
          ctx.arc(2, 0, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawEnemyProjectiles() {
        for (const projectile of game.enemyProjectiles) {
          const x = projectile.x - game.cameraX;
          const y = projectile.y;
          ctx.save();
          ctx.translate(x, y);
          if (projectile.type === "acid") {
            ctx.shadowBlur = 14;
            ctx.shadowColor = "#8bf05c";
            ctx.fillStyle = "#83d94e";
            ctx.beginPath();
            ctx.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#d8ff8d";
            ctx.beginPath();
            ctx.arc(-2, -3, 3, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.shadowBlur = 16;
            ctx.shadowColor = "#ff693d";
            ctx.fillStyle = "#ed563b";
            ctx.beginPath();
            ctx.arc(0, 0, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ffd26e";
            ctx.beginPath();
            ctx.arc(-2, -2, 4, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawAttackingBirds() {
        for (const bird of game.attackingBirds) {
          if (!bird.alive) continue;
          const x = bird.x - game.cameraX;
          const facing = bird.vx < 0 ? -1 : 1;
          ctx.save();
          ctx.translate(x, bird.y);
          ctx.scale(facing, 1);
          drawBird(0, 0, 1.35, game.animationTime * 13, "#4c3a2f");
          ctx.fillStyle = "#e7a63f";
          ctx.beginPath();
          ctx.moveTo(6, 1);
          ctx.lineTo(15, 5);
          ctx.lineTo(6, 8);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function drawPlayer() {
        if (player.invulnerable > 0 && Math.floor(game.animationTime * 18) % 2 === 0) return;
        const x = player.x - game.cameraX + PLAYER_WIDTH / 2;
        const y = player.y;
        const runSwing = player.grounded && Math.abs(player.vx) > 20 ? Math.sin(game.animationTime * 18) * 6 : 0;
        ctx.save();
        ctx.strokeStyle = "#182229";
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y + 8, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#1b2b35";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x, y + 17);
        ctx.lineTo(x, y + 33);
        ctx.moveTo(x, y + 22);
        ctx.lineTo(x - 11, y + 29 - runSwing * 0.5);
        ctx.moveTo(x, y + 22);
        ctx.lineTo(x + 11, y + 29 + runSwing * 0.5);
        ctx.moveTo(x, y + 33);
        ctx.lineTo(x - 8 - runSwing * 0.4, y + 47);
        ctx.moveTo(x, y + 33);
        ctx.lineTo(x + 8 + runSwing * 0.4, y + 47);
        ctx.stroke();
        ctx.restore();
      }

      function drawExitPillar() {
        const x = game.level.width - 70 - game.cameraX;
        ctx.fillStyle = "#4f5d66";
        ctx.fillRect(x, FLOOR_Y - 84, 12, 84);
        ctx.fillStyle = "#f5f7f8";
        ctx.fillRect(x + 12, FLOOR_Y - 76, 40, 30);
        ctx.fillStyle = "#38a46f";
        ctx.beginPath();
        ctx.moveTo(x + 12, FLOOR_Y - 76);
        ctx.lineTo(x + 32, FLOOR_Y - 76);
        ctx.lineTo(x + 32, FLOOR_Y - 58);
        ctx.lineTo(x + 12, FLOOR_Y - 58);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#d57d64";
        ctx.fillRect(x + 32, FLOOR_Y - 58, 20, 16);
      }

      function draw() {
        drawBackground();
        drawGround();
        drawPlatforms();
        drawSpikes();
        drawCoins();
        drawEnemies();
        drawFireballs();
        drawEnemyProjectiles();
        drawAttackingBirds();
        drawExitPillar();
        drawPlayer();
      }

      function loop(timestamp) {
        const delta = game.lastTime ? (timestamp - game.lastTime) / 1000 : 0;
        game.lastTime = timestamp;
        update(delta);
        requestAnimationFrame(loop);
        draw();
      }

      function setJoystickFromPointer(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const len = Math.hypot(dx, dy);
        const maxRadius = Math.min(rect.width, rect.height) * 0.25;
        let clampedX = dx;
        let clampedY = dy;
        if (len > maxRadius) {
          const scale = maxRadius / len;
          clampedX *= scale;
          clampedY *= scale;
        }

        const normalizedX = Math.max(-1, Math.min(1, clampedX / maxRadius));
        const normalizedY = Math.max(-1, Math.min(1, clampedY / maxRadius));
        joystickState.x = normalizedX;
        joystickState.y = normalizedY;
        joystickState.handleX = clampedX;
        joystickState.handleY = clampedY;
        if (normalizedY > -0.25) joystickState.jumpTriggered = false;
        joystickHandle.style.setProperty("--stick-x", `${clampedX}px`);
        joystickHandle.style.setProperty("--stick-y", `${clampedY}px`);
      }

      function updateJoystickHandle(delta) {
        if (joystickState.active) return;
        const blend = 1 - Math.exp(-16 * delta);
        joystickState.handleX += (0 - joystickState.handleX) * blend;
        joystickState.handleY += (0 - joystickState.handleY) * blend;
        if (Math.hypot(joystickState.handleX, joystickState.handleY) < 0.35) {
          joystickState.handleX = 0;
          joystickState.handleY = 0;
        }
        joystickHandle.style.setProperty("--stick-x", `${joystickState.handleX}px`);
        joystickHandle.style.setProperty("--stick-y", `${joystickState.handleY}px`);
      }

      function releaseJoystick() {
        joystickState.active = false;
        joystickState.pointerId = null;
        joystickState.x = 0;
        joystickState.y = 0;
        joystickState.jumpTriggered = false;
        player.vx = 0;
        joystick.classList.remove("is-active");
      }

      function bindTouchControls() {
        const actionButtons = document.querySelectorAll(".action-btn");

        joystick.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          joystickState.active = true;
          joystickState.pointerId = event.pointerId;
          joystick.classList.add("is-active");
          joystick.setPointerCapture?.(event.pointerId);
          setJoystickFromPointer(event.clientX, event.clientY);
        });

        joystick.addEventListener("pointermove", (event) => {
          if (!joystickState.active || joystickState.pointerId !== event.pointerId) return;
          event.preventDefault();
          setJoystickFromPointer(event.clientX, event.clientY);
        });

        joystick.addEventListener("pointerup", (event) => {
          if (joystickState.pointerId !== event.pointerId) return;
          releaseJoystick();
        });
        joystick.addEventListener("pointercancel", releaseJoystick);
        joystick.addEventListener("lostpointercapture", releaseJoystick);

        actionButtons.forEach((button) => {
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            button.dataset.pointerId = String(event.pointerId);
            button.setPointerCapture?.(event.pointerId);
            button.classList.add("is-pressed");
            ensureAudio();
            if (button.dataset.action === "jump") {
              game.jumpQueued = true;
            }
            if (button.dataset.action === "skill") {
              game.skillQueued = true;
            }
          });

          const releaseAction = (event) => {
            if (button.dataset.pointerId !== String(event.pointerId)) return;
            button.dataset.pointerId = "";
            button.classList.remove("is-pressed");
          };
          button.addEventListener("pointerup", releaseAction);
          button.addEventListener("pointercancel", releaseAction);
          button.addEventListener("lostpointercapture", releaseAction);
        });
      }

      function bindKeyboard() {
        window.addEventListener("keydown", (event) => {
          ensureAudio();
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
            event.preventDefault();
          }
          if (event.code === "KeyR") {
            restartLevel();
            return;
          }
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"].includes(event.code)) {
            keys.add(event.code);
          }
          if (["Space", "ArrowUp", "KeyW"].includes(event.code) && !event.repeat) {
            game.jumpQueued = true;
          }
          if (event.code === "KeyX" && !event.repeat) {
            game.skillQueued = true;
          }
        });

        window.addEventListener("keyup", (event) => {
          keys.delete(event.code);
        });

        window.addEventListener("blur", () => keys.clear());
      }

      function resizeCanvas() {
        if (canvas.width !== 960 || canvas.height !== HEIGHT) {
          canvas.width = 960;
          canvas.height = HEIGHT;
        }
        WIDTH = canvas.width;
      }

      function setupUI() {
        soundToggle.addEventListener("click", () => {
          game.audioEnabled = !game.audioEnabled;
          soundToggle.textContent = game.audioEnabled ? "🔊 音效＋音樂" : "🔇 靜音";
          soundToggle.setAttribute("aria-label", game.audioEnabled ? "關閉音效與音樂" : "開啟音效與音樂");
          soundToggle.setAttribute("aria-pressed", String(game.audioEnabled));
          if (game.audioEnabled) {
            ensureAudio();
            startBackgroundMusic();
          } else {
            stopBackgroundMusic();
          }
        });

        restartBtn.addEventListener("click", () => {
          buildLevel(game.currentLevelIndex);
          resetPlayerState();
          overlay.hidden = true;
        });

        nextLevelBtn.addEventListener("click", () => {
          goToNextLevel();
        });

        lifeRewardBtn.addEventListener("click", () => claimReward("life"));
        swordRewardBtn.addEventListener("click", () => claimReward("sword"));

        retryBtn.addEventListener("click", () => {
          buildLevel(game.currentLevelIndex);
          resetPlayerState();
          overlay.hidden = true;
          game.state = "playing";
        });

        startLandscapeBtn.addEventListener("click", () => startGame("landscape"));
        startPortraitBtn.addEventListener("click", () => startGame("portrait"));

      }

      function initGame() {
        buildLevel(0);
        updateHud();
        resetPlayerState();
        setupUI();
        bindKeyboard();
        bindTouchControls();
        resizeCanvas();
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", () => requestAnimationFrame(resizeCanvas));
      window.visualViewport?.addEventListener("resize", resizeCanvas);
      if ("ResizeObserver" in window) {
        new ResizeObserver(resizeCanvas).observe(gameScreen);
      }
      initGame();
    })();
  </script>
</body>
