<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>火柴人勇者：飛空島的黃金樹</title>
  <style>
    :root {
      --bg-1: #edf5ff;
      --bg-2: #dfeefc;
      --panel: rgba(255, 255, 255, 0.9);
      --panel-border: rgba(157, 191, 214, 0.6);
      --text: #1d2d3a;
      --muted: #527282;
      --accent: #2f9a7d;
      --accent-strong: #19765f;
      --gold: #f6c85d;
      --danger: #d95d4d;
      --shadow-blue: rgba(74, 150, 255, 0.35);
      --stone-dark: #4d5661;
      --stone-mid: #65717d;
      --stone-light: #8d98a3;
      --wood-deep: #9d6d42;
      --wood-mid: #c79152;
      --wood-light: #e5c182;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #edf7ff, #dfeefb 35%, #eef8f4);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 18px 14px 24px;
      overflow: hidden;
    }

    body.force-landscape-mode {
      overflow: hidden;
    }

    body.force-portrait-mode {
      overflow: auto;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px 18px 12px;
      border: 1px solid rgba(136, 168, 191, 0.4);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 60px rgba(17, 36, 46, 0.12);
      backdrop-filter: blur(7px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #398b79;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      letter-spacing: -0.04em;
      color: #1e2d3a;
    }

    .restart-btn {
      border: 0;
      border-radius: 12px;
      background: #224d5d;
      color: white;
      min-height: 42px;
      padding: 9px 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .restart-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .hud-item {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid rgba(153, 179, 190, 0.5);
      border-radius: 12px;
      background: rgba(248, 251, 253, 0.9);
      color: #486676;
      font-weight: 800;
    }

    .hud-item strong {
      color: #173a48;
      font-variant-numeric: tabular-nums;
    }

    #lives {
      letter-spacing: 0.08em;
      color: #e2675a;
    }

    .sound-toggle {
      border: 1px solid rgba(153, 179, 190, 0.5);
      cursor: pointer;
      background: rgba(248, 251, 253, 0.9);
    }

    .screen {
      position: relative;
      border: 5px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #afebff, #d7f5d7);
      box-shadow: 0 10px 24px rgba(27, 69, 84, 0.14);
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16 / 9;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #c6ebff 0%, #dfeefc 40%, #d9f7db 100%);
    }

    .game-shell.force-landscape {
      width: 100vw;
      max-width: none;
      min-height: 100vh;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #bfeaff;
      box-shadow: none;
    }

    .game-shell.force-landscape header,
    .game-shell.force-landscape .instructions {
      display: none;
    }

    .game-shell.force-landscape .screen {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      min-height: 100vh;
      border: 0;
      border-radius: 0;
      aspect-ratio: auto;
    }

    .game-shell.force-landscape .hud {
      position: absolute;
      z-index: 11;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      margin: 0;
      pointer-events: none;
    }

    .level-tag {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 3;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      color: #284d5d;
      font-size: 0.8rem;
      font-weight: 800;
      pointer-events: none;
    }

    .touch-controls {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      padding: 14px 16px 16px;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .joystick-wrap {
      position: relative;
      width: 118px;
      height: 118px;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      border-radius: 50%;
      background: rgba(29, 56, 64, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.34);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.08);
    }

    .joystick-ring {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.34);
      background: rgba(255, 255, 255, 0.08);
    }

    .joystick-handle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 46%;
      height: 46%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.38);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      transform: translate(calc(-50% + var(--stick-x, 0px)), calc(-50% + var(--stick-y, 0px)));
      transition: transform 0.08s ease-out;
    }

    .joystick-arrow {
      position: absolute;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.86rem;
      font-weight: 700;
      pointer-events: none;
    }

    .joystick-arrow.up { top: 8px; left: 50%; transform: translateX(-50%); }
    .joystick-arrow.right { right: 8px; top: 50%; transform: translateY(-50%); }
    .joystick-arrow.down { bottom: 8px; left: 50%; transform: translateX(-50%); }
    .joystick-arrow.left { left: 8px; top: 50%; transform: translateY(-50%); }

    .action-pad {
      position: relative;
      width: 136px;
      height: 116px;
      pointer-events: none;
    }

    .action-btn {
      position: absolute;
      width: 60px;
      height: 60px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      background: rgba(59, 109, 158, 0.34);
      color: white;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      box-shadow: 0 10px 25px rgba(21, 52, 80, 0.18);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .action-btn.jump {
      left: 0;
      bottom: 0;
    }

    .action-btn.skill {
      right: 0;
      top: 0;
      background: rgba(151, 86, 62, 0.34);
    }

    .action-btn.is-pressed {
      transform: scale(1.1);
      box-shadow: 0 0 18px rgba(91, 168, 255, 0.75), 0 0 30px rgba(91, 168, 255, 0.4);
      background: rgba(74, 150, 255, 0.42);
    }

    .action-btn.skill.is-pressed {
      box-shadow: 0 0 18px rgba(93, 184, 255, 0.72), 0 0 30px rgba(52, 129, 232, 0.46);
      background: rgba(81, 143, 255, 0.44);
    }

    .instructions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      color: #617a82;
      font-size: 0.88rem;
    }

    .key-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid #d9e5e8;
      border-bottom-width: 3px;
      border-radius: 7px;
      background: #f8fbff;
      color: #23485d;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .orientation-screen {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 28, 38, 0.7);
      backdrop-filter: blur(8px);
      color: white;
      text-align: center;
      padding: 20px;
    }

    .orientation-screen[hidden] {
      display: none;
    }

    .orientation-panel {
      max-width: 420px;
      padding: 24px 22px 22px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 20px;
      background: rgba(24, 42, 52, 0.88);
      box-shadow: 0 22px 60px rgba(13, 23, 30, 0.3);
    }

    .rotate-icon {
      display: inline-grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
      border-radius: 18px;
      background: rgba(50, 137, 133, 0.2);
      font-size: 2rem;
    }

    .orientation-panel h2 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 3.5vw, 2.1rem);
    }

    .orientation-panel p {
      margin: 0 0 18px;
      color: #dfeaf0;
      line-height: 1.7;
      font-size: 0.98rem;
    }

    .orientation-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .orientation-btn {
      min-width: 140px;
      min-height: 46px;
      border: 0;
      border-radius: 12px;
      background: #2f9a7d;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .orientation-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .intro-overlay {
      position: absolute;
      z-index: 12;
      inset: 0;
      display: none;
      background: radial-gradient(circle at 50% 30%, rgba(157, 209, 255, 0.4), rgba(202, 230, 255, 0.08) 35%, rgba(16, 32, 52, 0.52));
      overflow: hidden;
    }

    .intro-overlay.visible {
      display: block;
      animation: introBackdropIn 0.95s ease forwards;
    }

    .intro-panel {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 26px 34px;
      pointer-events: none;
    }

    .story-box {
      position: relative;
      width: min(820px, 92%);
      padding: 30px 34px 82px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(203, 233, 255, 0.12), rgba(81, 121, 151, 0.14));
      box-shadow: 0 30px 90px rgba(4, 17, 32, 0.42), inset 0 0 20px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(1px);
      pointer-events: auto;
      opacity: 0;
      transform: translateY(28px) scale(0.82) rotateX(10deg);
      animation: storyBoxIn 1s cubic-bezier(0.17, 0.84, 0.22, 1) 0.18s forwards;
    }

    .story-box::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .story-box::after {
      content: "";
      position: absolute;
      inset: -18% 18% auto 18%;
      height: 70%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.21), transparent 68%);
      filter: blur(26px);
      pointer-events: none;
      opacity: 0.8;
    }

    .story-title {
      margin: 0 0 12px;
      color: rgba(255, 255, 255, 0.94);
      font-size: clamp(1.2rem, 2vw, 1.85rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(14px);
      animation: storyTitleIn 0.7s ease 0.48s forwards;
    }

    .story-copy {
      margin: 0;
      min-height: 185px;
      color: rgba(245, 250, 255, 0.97);
      font-size: clamp(1.12rem, 1.9vw, 1.48rem);
      line-height: 1.95;
      letter-spacing: 0.04em;
      text-shadow: 0 3px 18px rgba(8, 30, 34, 0.28);
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(3px);
      animation: storyTextIn 0.7s ease 0.7s forwards;
    }

    .story-cursor {
      display: inline-block;
      width: 0.7ch;
      margin-left: 2px;
      color: rgba(255, 255, 255, 0.92);
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes introBackdropIn {
      from {
        opacity: 0;
        background: rgba(16, 32, 52, 0.18);
        backdrop-filter: blur(0px);
      }
      to {
        opacity: 1;
        background: radial-gradient(circle at 50% 30%, rgba(157, 209, 255, 0.48), rgba(202, 230, 255, 0.12) 34%, rgba(16, 32, 52, 0.7));
        backdrop-filter: blur(1px);
      }
    }

    @keyframes storyBoxIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.82) rotateX(10deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
      }
    }

    @keyframes storyTitleIn {
      from {
        opacity: 0;
        transform: translateY(14px);
        letter-spacing: 0.2em;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 0.12em;
      }
    }

    @keyframes storyTextIn {
      from {
        opacity: 0;
        transform: translateY(10px);
        filter: blur(3px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes introButtonsIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .intro-actions {
      position: absolute;
      right: 26px;
      bottom: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
      opacity: 0;
      transform: translateY(10px);
      animation: introButtonsIn 0.45s ease 1s forwards;
    }

    .skip-btn,
    .continue-btn {
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(22, 52, 80, 0.7), rgba(11, 28, 42, 0.6));
      color: white;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(2px);
      opacity: 0;
      transform: translateY(8px);
      animation: introFadeIn 0.5s ease forwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .skip-btn:hover,
    .continue-btn:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 10px 24px rgba(17, 64, 84, 0.3);
    }

    .skip-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 9px 14px;
      font-size: 0.85rem;
    }

    .continue-btn {
      padding: 10px 22px;
      font-size: 0.92rem;
    }

    @keyframes introFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .particle-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.9;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(104, 235, 146, 0.84);
      box-shadow: 0 0 10px rgba(104, 235, 146, 0.8);
      animation: floatUp var(--dur) ease-in infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translate3d(0, 0, 0) scale(0.7);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translate3d(var(--dx), -110px, 0) scale(1);
        opacity: 0;
      }
    }

    .overlay {
      position: absolute;
      z-index: 7;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(15, 26, 38, 0.22);
      backdrop-filter: blur(2px);
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay-box {
      width: min(390px, 84%);
      padding: 22px 20px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 253, 249, 0.96);
      text-align: center;
      box-shadow: 0 18px 40px rgba(12, 25, 33, 0.18);
      animation: popup 0.18s ease-out;
    }

    @keyframes popup {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .overlay-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      background: rgba(48, 144, 110, 0.12);
      font-size: 1.7rem;
    }

    .overlay-box h3 {
      margin: 0;
      font-size: clamp(1.4rem, 2.4vw, 1.8rem);
      color: #173440;
    }

    .overlay-box p {
      margin: 10px 0 18px;
      line-height: 1.7;
      color: #536b76;
    }

    .overlay-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .overlay-btn {
      border: 0;
      border-radius: 12px;
      min-height: 42px;
      padding: 9px 16px;
      font-weight: 800;
      cursor: pointer;
      background: #2f9a7d;
      color: white;
    }

    .overlay-btn.secondary {
      background: #eff4f7;
      color: #23485d;
      border: 1px solid rgba(35, 72, 93, 0.15);
    }

    @media (pointer: coarse), (max-width: 780px) {
      body {
        padding: 0;
        background: linear-gradient(180deg, #bfe7ff, #d7f7f4);
      }

      .game-shell {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .game-shell header,
      .instructions {
        display: none;
      }

      .hud {
        position: absolute;
        z-index: 11;
        top: max(8px, env(safe-area-inset-top));
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        gap: 6px;
        margin: 0;
        pointer-events: none;
      }

      .hud-item {
        min-height: 34px;
        font-size: 0.68rem;
        padding: 4px 6px;
        background: rgba(255, 255, 255, 0.78);
        border-color: rgba(255, 255, 255, 0.8);
      }

      .screen {
        width: 100%;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .screen canvas {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        aspect-ratio: auto;
      }

      .touch-controls {
        display: flex;
        padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      }

      .joystick-wrap {
        width: clamp(82px, 20vw, 112px);
        height: clamp(82px, 20vw, 112px);
      }

      .action-pad {
        width: clamp(110px, 26vw, 136px);
        height: clamp(94px, 22vw, 116px);
      }

      .action-btn {
        width: clamp(52px, 12vw, 60px);
        height: clamp(52px, 12vw, 60px);
        font-size: clamp(0.7rem, 2.8vw, 0.82rem);
      }

      .level-tag {
        top: max(48px, calc(env(safe-area-inset-top) + 44px));
        left: max(10px, env(safe-area-inset-left));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">Stickman Platform Quest</p>
        <h1>火柴人勇者：飛空島的黃金樹</h1>
      </div>
      <button class="restart-btn" id="restartBtn" type="button">重新開始本關 ↻</button>
    </header>

    <section class="hud" aria-label="遊戲狀態">
      <div class="hud-item">關卡 <strong id="levelDisplay">1 / 5</strong></div>
      <div class="hud-item">生命 <strong id="lives">♥ ♥ ♥</strong></div>
      <div class="hud-item">分數 <strong id="score">0</strong></div>
      <button class="hud-item sound-toggle" id="soundToggle" type="button" aria-label="關閉音效" aria-pressed="true">🔊 音效</button>
    </section>

    <section class="screen" aria-label="遊戲畫面">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div class="level-tag" id="levelName">第 1 關・新手訓練</div>

      function ensureAudio() {
        if (!game.audioEnabled) return;
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        if (!game.audioContext) {
          game.audioContext = new AudioCtor();
        }
        if (game.audioContext.state === "suspended") {
          game.audioContext.resume().catch(() => {});
        }
      }

      function playTone(kind) {
        if (!game.audioEnabled) return;
        ensureAudio();
        const ctxAudio = game.audioContext;
        if (!ctxAudio) return;

        const tones = {
          jump: { start: 420, end: 700, duration: 0.12, wave: "triangle" },
          fireball: { start: 650, end: 90, duration: 0.18, wave: "sawtooth" },
          coin: { start: 900, end: 1180, duration: 0.09, wave: "sine" },
          hit: { start: 200, end: 80, duration: 0.20, wave: "square" },
          clear: { start: 520, end: 1100, duration: 0.24, wave: "sine" },
          stomp: { start: 300, end: 500, duration: 0.14, wave: "triangle" }
        };
        const config = tones[kind];
        if (!config) return;

        const now = ctxAudio.currentTime;
        const oscillator = ctxAudio.createOscillator();
        const gain = ctxAudio.createGain();
        oscillator.type = config.wave;
        oscillator.frequency.setValueAtTime(config.start, now);
        oscillator.frequency.exponentialRampToValueAtTime(config.end, now + config.duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.12, now + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + config.duration);
        oscillator.connect(gain);
        gain.connect(ctxAudio.destination);
        oscillator.start(now);
        oscillator.stop(now + config.duration);
      }

      function updateHud() {
        levelDisplay.textContent = `${game.currentLevelIndex + 1} / ${baseLevelTemplates.length}`;
        livesDisplay.textContent = `${"♥ ".repeat(Math.max(0, game.lives)).trim()}${game.lives < 3 ? ` ${"♡ ".repeat(3 - game.lives).trim()}` : ""}`;

        levelName.textContent = `第 ${game.currentLevelIndex + 1} 關・${game.level?.name || "新手訓練"}`;

        player.y = FLOOR_Y - PLAYER_HEIGHT;
        player.vx = 0;
        player.vy = 0;
        player.grounded = false;
        player.facing = 1;

        game.skillQueued = false;

        joystickState.y = 0;
        joystickState.targetX = 0;
        joystickState.targetY = 0;

        joystickHandle.style.setProperty("--stick-y", "0px");
      }

      function makeLevel(template) {
        return {
          name: template.name,
          width: template.width,
          ground: template.ground.map(([start, end]) => ({ x: start, y: FLOOR_Y, w: end - start, h: 90 })),
          platforms: template.platforms.map((p) => ({ ...p, h: 16 })),
          spikes: template.spikes.map((spike) => ({ ...spike, dangerous: false, stateTimer: 0 })),
          enemies: template.enemies.map((e) => ({ ...e })),
          coins: template.coins.map((coin, index) => ({ ...coin, id: `${game.currentLevelIndex}-${index}`, collected: collectedCoinIds.has(`${game.currentLevelIndex}-${index}`) })),
          boss: template.boss ? { ...template.boss, hp: template.boss.hp, maxHp: template.boss.maxHp, alive: true } : null,
          trapCycle: 0,
          tileSeed: Math.random() * 1024
        };
      }

      function buildLevel(index) {
        game.level = makeLevel(baseLevelTemplates[index]);
        updateHud();
      }

      function restartLevel() {
        if (game.state === "playing") {
          game.state = "playing";
        }
        buildLevel(game.currentLevelIndex);
        resetPlayerState();
        overlay.hidden = true;
      }

          retryBtn.hidden = false;

      function completeLevel() {
        playTone("clear");

          game.state = "cleared";
        }
      }

      function loseLife() {
        if (game.state !== "playing" || player.invulnerable > 0) return;
        playTone("hit");
        game.lives -= 1;
        updateHud();

        buildLevel(game.currentLevelIndex);
        resetPlayerState();

      function goToNextLevel() {
        if (game.state !== "cleared") return;

        buildLevel(game.currentLevelIndex);
        resetPlayerState();
        overlay.hidden = true;
        game.state = "playing";

      function addParticles() {
        const fragmentCount = 18;
        particleLayer.innerHTML = "";
        for (let i = 0; i < fragmentCount; i += 1) {
          const dot = document.createElement("span");
          dot.className = "particle";
          const left = Math.random() * 100;
          const top = Math.random() * 100;
          const dx = (Math.random() - 0.5) * 120;
          const dur = 8 + Math.random() * 8;
          dot.style.left = `${left}%`;
          dot.style.top = `${top}%`;
          dot.style.setProperty("--dx", `${dx}px`);
          dot.style.setProperty("--dur", `${dur}s`);
          particleLayer.appendChild(dot);
        }
      }

      function runStorySequence() {
        const story = STORY_TEXT;
        let index = 0;
        let stage = 0;
        let speed = 42;
        let active = true;
        let forceComplete = false;
        let introTransitionTimer = null;

        storyText.innerHTML = "";
        storyText.classList.remove("story-complete");

        function startGameFromIntro() {
          if (introTransitionTimer) return;
          introTransitionTimer = setTimeout(() => {
            game.state = "playing";
            introOverlay.classList.remove("visible");
            game.started = true;
          }, 800);
        }

        function renderChar() {
          if (!active) return;
          if (forceComplete) {
            storyText.innerHTML = `${story}<span class="story-cursor"></span>`;
            storyText.classList.add("story-complete");
            return;
          }
          const visible = story.slice(0, index);
          const cursor = '<span class="story-cursor">|</span>';
          storyText.innerHTML = `${visible}${cursor}`;
          index += 1;
          if (index <= story.length) {
            const timeout = Math.max(22, speed - stage * 6);
            setTimeout(renderChar, timeout);
          } else {
            storyText.innerHTML = `${story}<span class="story-cursor"></span>`;
            storyText.classList.add("story-complete");
            setTimeout(startGameFromIntro, 1200);
          }
        }

        renderChar();

        function finish() {
          if (forceComplete) return;
          forceComplete = true;
          storyText.innerHTML = `${story}<span class="story-cursor"></span>`;
          storyText.classList.add("story-complete");
          active = false;
          setTimeout(startGameFromIntro, 450);
        }

        document.addEventListener("pointerdown", (event) => {
          if (game.state !== "intro") return;
          if (event.target.closest("button")) return;
          finish();
        }, { once: false });

        continueBtn.addEventListener("click", () => {
          if (game.state !== "intro") return;
          finish();
        });

        skipIntroBtn.addEventListener("click", () => {
          if (game.state !== "intro") return;
          finish();
          setTimeout(() => {
            game.state = "playing";
            introOverlay.classList.remove("visible");
            game.started = true;
          }, 250);
        });

        setTimeout(() => {
          if (!forceComplete) {
            finish();
          }
        }, 10000);
      }

      function beginIntro() {
        introOverlay.classList.remove("visible");
        game.state = "playing";
        game.started = true;
      }

      function applyOrientationMode(mode) {
        const gameShell = document.querySelector(".game-shell");
        const isLandscape = mode === "landscape";
        orientationLockMode = mode;

        if (isLandscape) {
          gameShell.classList.add("force-landscape");
          document.body.classList.add("force-landscape-mode");
          document.body.classList.remove("force-portrait-mode");
        } else {
          gameShell.classList.remove("force-landscape");
          document.body.classList.remove("force-landscape-mode");
          document.body.classList.add("force-portrait-mode");
        }
      }

      function startGame(mode) {
        ensureAudio();
        orientationScreen.hidden = true;
        applyOrientationMode(mode);
        introOverlay.classList.remove("visible");
        game.state = "playing";
        game.started = true;
        game.canInput = true;
        resizeCanvas();
      }

      function autoStartForOrientation() {
        if (orientationLockMode) return;
        if (!game.mobileMode) return;
        const isLandscapeNow = window.matchMedia("(orientation: landscape)").matches || window.innerWidth > window.innerHeight;
        if (isLandscapeNow) {
          startGame("landscape");
        }
      }

      function trapStateMachine(trap, delta) {
        if (trap.state === undefined) trap.state = 0;
        trap.stateTimer += delta;

        const hiddenTime = trap.cooldown || 1.5;
        const riseTime = 0.32;
        const holdTime = 1.1;
        const retractTime = 0.35;

        if (trap.state === 0) {
          trap.dangerous = false;
          trap.phase = 0;
          if (trap.stateTimer >= hiddenTime) {
            trap.state = 1;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 1) {
          trap.dangerous = false;
          trap.phase = Math.min(1, trap.stateTimer / riseTime);
          if (trap.stateTimer >= riseTime) {
            trap.state = 2;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 2) {
          trap.dangerous = true;
          trap.phase = 1;
          if (trap.stateTimer >= holdTime) {
            trap.state = 3;
            trap.stateTimer = 0;
          }
        } else if (trap.state === 3) {
          trap.dangerous = false;
          trap.phase = 1 - Math.min(1, trap.stateTimer / retractTime);
          if (trap.stateTimer >= retractTime) {
            trap.state = 0;
            trap.stateTimer = 0;
          }
        }
      }

      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function beingOnGroundForPlatform(actor, solid) {
        const box = { x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
        const below = actor.vy >= 0 && actor.y + PLAYER_HEIGHT <= solid.y + 10;
        if (!rectsOverlap(box, solid)) return false;
        if (below) {
          actor.y = solid.y - PLAYER_HEIGHT;
          actor.vy = 0;
          actor.grounded = true;
          return true;
        }
        return false;
      }

      function moveEntityWithPlatform(actor, solids, delta) {
        actor.x += actor.vx * delta;
        for (const solid of solids) {
          if (rectsOverlap({ x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (actor.vx > 0) actor.x = solid.x - PLAYER_WIDTH;
            else if (actor.vx < 0) actor.x = solid.x + solid.w;
          }
        }

        const prevY = actor.y;
        actor.vy += GRAVITY * delta;
        actor.y += actor.vy * delta;
        actor.grounded = false;

        for (const solid of solids) {
          if (rectsOverlap({ x: actor.x, y: actor.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (actor.vy >= 0 && prevY + PLAYER_HEIGHT <= solid.y + 8) {
              actor.y = solid.y - PLAYER_HEIGHT;
              actor.vy = 0;
              actor.grounded = true;
            } else if (actor.vy < 0 && prevY >= solid.y + solid.h - 4) {
              actor.y = solid.y + solid.h;
              actor.vy = 0;
            }
          }
        }
      }

      function collectCoins() {
        const box = { x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
        for (const coin of game.level.coins) {
          if (coin.collected) continue;
          if (rectsOverlap(box, { x: coin.x - 12, y: coin.y - 12, w: 24, h: 24 })) {
            coin.collected = true;
            collectedCoinIds.add(coin.id);
            game.score += 100;
            playTone("coin");
            updateHud();
          }
        }
      }

      function updateFireballs(delta) {
        for (let i = game.fireballs.length - 1; i >= 0; i -= 1) {
          const ball = game.fireballs[i];
          ball.x += ball.vx * delta;
          ball.y += ball.vy * delta;
          ball.vy += 70 * delta;
          ball.life -= delta;

          const firebox = { x: ball.x - 12, y: ball.y - 12, w: 24, h: 24 };
          let hit = false;

          for (const enemy of game.level.enemies) {
            if (!enemy.alive) continue;
            if (rectsOverlap(firebox, enemy)) {
              enemy.alive = false;
              game.score += 150;
              hit = true;
              playTone("stomp");
              updateHud();
              break;
            }
          }

          const boss = game.level.boss;
          if (!hit && boss && boss.hp > 0 && rectsOverlap(firebox, boss)) {
            boss.hp -= 1;
            game.score += 250;
            hit = true;
            playTone("stomp");
            updateHud();
          }

          if (hit || ball.life <= 0 || ball.x < 0 || ball.x > game.level.width) {
            game.fireballs.splice(i, 1);
          }
        }
      }

      function castFireball() {
        if (game.state !== "playing" || game.skillCooldown > 0) return;
        game.skillCooldown = 0.75;
        playTone("fireball");
        game.fireballs.push({
          x: player.x + PLAYER_WIDTH / 2 + player.facing * 24,
          y: player.y + PLAYER_HEIGHT * 0.45,
          vx: player.facing * 620,
          vy: 0,
          life: 2.0
        });
      }

      function handleEnemyCollisions() {
        const playerBox = { x: player.x + 4, y: player.y + 2, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 4 };
        const prevBottom = player.y + PLAYER_HEIGHT;

        for (const enemy of game.level.enemies) {
          if (!enemy.alive) continue;
          if (rectsOverlap(playerBox, enemy)) {
            if (player.vy > 0 && prevBottom <= enemy.y + 10) {
              enemy.alive = false;
              player.vy = -JUMP_VELOCITY * 0.54;
              game.score += 150;
              playTone("stomp");
              updateHud();
            } else {
              loseLife();
              return;
            }
          }
        }

        const boss = game.level.boss;
        if (boss && boss.hp > 0 && rectsOverlap(playerBox, boss)) {
          if (player.vy > 0 && prevBottom <= boss.y + 12) {
            boss.hp -= 1;
            player.vy = -JUMP_VELOCITY * 0.58;
            game.score += 250;
            playTone("stomp");
            updateHud();
          } else {
            loseLife();
          }
        }
      }

      function checkSpikes() {
        const box = { x: player.x + 4, y: player.y + 3, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 6 };
        for (const spike of game.level.spikes) {
          if (spike.dangerous && rectsOverlap(box, spike)) {
            loseLife();
            return;
          }
        }
      }

      function updateSpikes(delta) {
        for (const spike of game.level.spikes) {
          trapStateMachine(spike, delta);
        }
      }

      function handleExit() {
        const finishZone = { x: game.level.width - 86, y: FLOOR_Y - 82, w: 48, h: 82 };
        if (!game.level.boss || game.level.boss.hp <= 0) {
          if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, finishZone)) {
            completeLevel();
          }
        }
      }

      function updateControls(delta) {
        const keyboardLeft = keys.has("ArrowLeft") || keys.has("KeyA");
        const keyboardRight = keys.has("ArrowRight") || keys.has("KeyD");
        const stickX = joystickState.x;

        let moveRequest = 0;
        if (keyboardLeft && !keyboardRight) moveRequest = -1;
        else if (keyboardRight && !keyboardLeft) moveRequest = 1;
        else if (Math.abs(stickX) > 0.14) moveRequest = stickX;

        if (moveRequest !== 0) {
          player.facing = moveRequest > 0 ? 1 : -1;
        }

        player.vx = moveRequest * SPEED;

        if (game.jumpQueued && player.grounded) {
          player.vy = -JUMP_VELOCITY;
          player.grounded = false;
          playTone("jump");
        }
        game.jumpQueued = false;

        if (game.skillQueued) {
          castFireball();
          game.skillQueued = false;
        }

        if (game.skillCooldown > 0) {
          game.skillCooldown = Math.max(0, game.skillCooldown - delta);
        }
      }

      function updatePlayer(delta) {
        const solids = [...game.level.ground, ...game.level.platforms];

        const prevY = player.y;
        moveEntityWithPlatform(player, solids, delta);

        if (player.y > HEIGHT + 80) {
          loseLife();
          return;
        }

        if (player.x < 0) player.x = 0;
        if (player.x > game.level.width - PLAYER_WIDTH) player.x = game.level.width - PLAYER_WIDTH;

        for (const solid of solids) {
          if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
            if (player.vy >= 0 && prevY + PLAYER_HEIGHT <= solid.y + 8) {
              player.y = solid.y - PLAYER_HEIGHT;
              player.vy = 0;
              player.grounded = true;
            }
          }
        }

        collectCoins();
        handleEnemyCollisions();
        if (game.state !== "playing") return;
        checkSpikes();
        handleExit();

        const targetCamera = Math.max(0, Math.min(game.level.width - WIDTH, player.x - WIDTH * 0.45));
        game.cameraX += (targetCamera - game.cameraX) * Math.min(1, delta * 6);
      }

      function update(delta) {
        if (game.state === "intro") {
          return;
        }

        if (game.state !== "playing") {
          return;
        }

        const step = Math.min(delta, 0.033);
        game.animationTime += step;
        player.invulnerable = Math.max(0, player.invulnerable - step);
        updateSpikes(step);
        updateControls(step);
        updateFireballs(step);
        updatePlayer(step);
        if (game.state !== "playing") return;
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        sky.addColorStop(0, "#9cd8f3");
        sky.addColorStop(1, "#deefff");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let i = 0; i < 30; i += 1) {
          const x = ((i * 131.5 - game.cameraX * 0.08) % (WIDTH + 40)) - 20;
          const y = 40 + (i * 28) % 200;
          ctx.fillStyle = i % 5 === 0 ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.55)";
          ctx.fillRect(x, y, 1.8, 1.8);
        }

        ctx.fillStyle = "#f6d76d";
        ctx.beginPath();
        ctx.arc(792 - game.cameraX * 0.12, 92, 36, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(134, 197, 160, 0.5)";
        for (let i = 0; i < 7; i += 1) {
          const mx = i * 180 - game.cameraX * 0.12;
          ctx.beginPath();
          ctx.moveTo(mx, HEIGHT);
          ctx.lineTo(mx + 90, 260 + (i % 3) * 18);
          ctx.lineTo(mx + 180, HEIGHT);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawCrackedStoneTile(x, y, w, h) {
        ctx.fillStyle = "#5f6975";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#6d7985";
        ctx.fillRect(x, y + 2, w, 4);

        const cracks = [
          [0.18, 0.18, 0.72, 0.42],
          [0.54, 0.22, 0.75, 0.68],
          [0.14, 0.62, 0.6, 0.8],
          [0.72, 0.2, 0.9, 0.45],
          [0.35, 0.12, 0.42, 0.76],
          [0.8, 0.58, 0.92, 0.88]
        ];

        ctx.strokeStyle = "rgba(30, 36, 42, 0.45)";
        ctx.lineWidth = 1.2;
        for (const crack of cracks) {
          const ax = x + w * crack[0];
          const ay = y + h * crack[1];
          const bx = x + w * crack[2];
          const by = y + h * crack[3];
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(bx, by);
          ctx.stroke();
        }
      }

      function drawGround() {
        for (const segment of game.level.ground) {
          const sx = segment.x - game.cameraX;
          if (sx + segment.w < -20 || sx > WIDTH + 20) continue;
          const tileW = 56;
          for (let x = 0; x < segment.w; x += tileW) {
            const drawX = sx + x;
            const tileH = Math.min(40, segment.h);
            drawCrackedStoneTile(drawX, segment.y, Math.min(tileW, segment.w - x), tileH);
          }

          const slotX = segment.x + segment.w * 0.5 - 96;
          const slotScreenX = slotX - game.cameraX;
          if (slotScreenX + 190 > 0 && slotScreenX < WIDTH) {
            ctx.fillStyle = "rgba(16, 23, 31, 0.5)";
            ctx.fillRect(slotScreenX, segment.y + 6, 192, 45);
            ctx.fillStyle = "rgba(32, 39, 48, 0.9)";
            ctx.fillRect(slotScreenX + 8, segment.y + 10, 176, 27);
          }
        }
      }

      function drawPlatforms() {
        const solids = [...game.level.platforms, ...game.level.ground];
        for (const platform of game.level.platforms) {
          const sx = platform.x - game.cameraX;
          if (sx + platform.w < -10 || sx > WIDTH + 10) continue;
          ctx.fillStyle = "#b57d53";
          ctx.fillRect(sx, platform.y, platform.w, platform.h);
          ctx.fillStyle = "#f0c87d";
          ctx.fillRect(sx, platform.y, platform.w, 6);
          ctx.fillStyle = "rgba(120, 70, 40, 0.2)";
          for (let i = 0; i < platform.w; i += 16) {
            ctx.fillRect(sx + i, platform.y + 8, 8, 2);
          }
        }

        for (const segment of game.level.ground) {
          const sx = segment.x - game.cameraX;
          if (sx + segment.w < -20 || sx > WIDTH + 20) continue;
          const trapSlot = { x: segment.x + segment.w * 0.5 - 96, y: segment.y, w: 192, h: 58 };
          const tx = trapSlot.x - game.cameraX;
          ctx.fillStyle = "rgba(17, 21, 26, 0.78)";
          ctx.fillRect(tx, trapSlot.y + 12, trapSlot.w, 28);
        }
      }

      function drawSpikes() {
        for (const spike of game.level.spikes) {
          const sx = spike.x - game.cameraX;
          if (sx + spike.w < -10 || sx > WIDTH + 10) continue;

          const riseProgress = Math.max(0, Math.min(1, spike.phase || 0));
          const maxHeight = 26;
          const hiddenDepth = 24;
          const baseY = spike.y + 12;
          const activeHeight = riseProgress * maxHeight;
          const tipY = spike.dangerous ? baseY - activeHeight : baseY + hiddenDepth - riseProgress * hiddenDepth;
          const count = Math.max(2, Math.floor(spike.w / 16));
          const unit = spike.w / count;

          ctx.fillStyle = spike.dangerous ? "#db6a59" : "#7d8d9b";
          ctx.strokeStyle = spike.dangerous ? "#a93d3a" : "#596978";

          for (let i = 0; i < count; i += 1) {
            const px = sx + i * unit;
            const yTop = tipY;
            ctx.beginPath();
            ctx.moveTo(px, baseY);
            ctx.lineTo(px + unit * 0.5, yTop);
            ctx.lineTo(px + unit, baseY);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }
      }

      function drawCoins() {
        for (const coin of game.level.coins) {
          if (coin.collected) continue;
          const x = coin.x - game.cameraX;
          const bob = Math.sin(game.animationTime * 5 + coin.x * 0.7) * 4;
          ctx.fillStyle = "rgba(245, 196, 78, 0.23)";
          ctx.beginPath();
          ctx.arc(x, coin.y + bob, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f5ca49";
          ctx.strokeStyle = "#d9982e";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, coin.y + bob, 9, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = "#fff2ae";
          ctx.fillRect(x - 1, coin.y + bob - 7, 2, 14);
        }
      }

      function drawEnemies() {
        for (const enemy of game.level.enemies) {
          if (!enemy.alive) continue;
          const x = enemy.x - game.cameraX;
          ctx.fillStyle = "#d45a52";
          ctx.beginPath();
          ctx.roundRect(x, enemy.y + 10, enemy.w, enemy.h - 10, 9);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(x + 9, enemy.y + 18, 4, 0, Math.PI * 2);
          ctx.arc(x + 20, enemy.y + 18, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#1b1d27";
          ctx.beginPath();
          ctx.arc(x + 9, enemy.y + 18, 1.8, 0, Math.PI * 2);
          ctx.arc(x + 20, enemy.y + 18, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }

        const boss = game.level.boss;
        if (boss && boss.hp > 0) {
          const x = boss.x - game.cameraX;
          ctx.fillStyle = "#69366a";
          ctx.beginPath();
          ctx.roundRect(x, boss.y + 10, boss.w, boss.h - 10, 16);
          ctx.fill();
          ctx.fillStyle = "#f19a72";
          ctx.beginPath();
          ctx.moveTo(x + 8, boss.y + 16);
          ctx.lineTo(x + 12, boss.y + 2);
          ctx.lineTo(x + 28, boss.y + 18);
          ctx.lineTo(x + 45, boss.y + 2);
          ctx.lineTo(x + 50, boss.y + 18);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#fff4dd";
          ctx.fillRect(x + 14, boss.y + 30, 12, 7);
          ctx.fillRect(x + 33, boss.y + 30, 12, 7);
          ctx.fillStyle = "#2a1b27";
          ctx.fillRect(x + 17, boss.y + 31, 5, 4);
          ctx.fillRect(x + 37, boss.y + 31, 5, 4);

          ctx.fillStyle = "#5c3752";
          ctx.fillRect(x, boss.y - 12, boss.w, 6);
          ctx.fillStyle = "#ffc86f";
          ctx.fillRect(x, boss.y - 12, boss.w * (boss.hp / boss.maxHp), 6);
        }
      }

      function drawFireballs() {
        for (const fireball of game.fireballs) {
          const x = fireball.x - game.cameraX;
          const y = fireball.y;
          ctx.save();
          ctx.translate(x, y);
          ctx.shadowBlur = 18;
          ctx.shadowColor = "#ff8e3d";
          ctx.fillStyle = "#ff8d4f";
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#ffe082";
          ctx.beginPath();
          ctx.arc(2, 0, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawPlayer() {
        if (player.invulnerable > 0 && Math.floor(game.animationTime * 18) % 2 === 0) return;
        const x = player.x - game.cameraX + PLAYER_WIDTH / 2;
        const y = player.y;
        const runSwing = player.grounded && Math.abs(player.vx) > 20 ? Math.sin(game.animationTime * 18) * 6 : 0;
        ctx.save();
        ctx.strokeStyle = "#182229";
        ctx.lineWidth = 4.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y + 8, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#1b2b35";
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(x, y + 17);
        ctx.lineTo(x, y + 33);
        ctx.moveTo(x, y + 22);
        ctx.lineTo(x - 11, y + 29 - runSwing * 0.5);
        ctx.moveTo(x, y + 22);
        ctx.lineTo(x + 11, y + 29 + runSwing * 0.5);
        ctx.moveTo(x, y + 33);
        ctx.lineTo(x - 8 - runSwing * 0.4, y + 47);
        ctx.moveTo(x, y + 33);
        ctx.lineTo(x + 8 + runSwing * 0.4, y + 47);
        ctx.stroke();
        ctx.restore();
      }

      function drawExitPillar() {
        const x = game.level.width - 70 - game.cameraX;
        ctx.fillStyle = "#4f5d66";
        ctx.fillRect(x, FLOOR_Y - 84, 12, 84);
        ctx.fillStyle = "#f5f7f8";
        ctx.fillRect(x + 12, FLOOR_Y - 76, 40, 30);
        ctx.fillStyle = "#38a46f";
        ctx.beginPath();
        ctx.moveTo(x + 12, FLOOR_Y - 76);
        ctx.lineTo(x + 32, FLOOR_Y - 76);
        ctx.lineTo(x + 32, FLOOR_Y - 58);
        ctx.lineTo(x + 12, FLOOR_Y - 58);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#d57d64";
        ctx.fillRect(x + 32, FLOOR_Y - 58, 20, 16);
      }

      function draw() {
        drawBackground();
        drawGround();
        drawPlatforms();
        drawSpikes();
        drawCoins();
        drawEnemies();
        drawFireballs();
        drawExitPillar();
        drawPlayer();
      }

      function loop(timestamp) {
        const delta = game.lastTime ? (timestamp - game.lastTime) / 1000 : 0;
        game.lastTime = timestamp;
        update(delta);
        requestAnimationFrame(loop);
        draw();
      }

      function setJoystickFromPointer(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const len = Math.hypot(dx, dy);
        const maxRadius = rect.width * 0.39;
        let clampedX = dx;
        let clampedY = dy;
        if (len > maxRadius) {
          const scale = maxRadius / len;
          clampedX *= scale;
          clampedY *= scale;
        }

        const normalizedX = Math.max(-1, Math.min(1, clampedX / maxRadius));
        const normalizedY = Math.max(-1, Math.min(1, clampedY / maxRadius));
        joystickState.x = normalizedX;
        joystickState.y = normalizedY;
        joystickHandle.style.setProperty("--stick-x", `${clampedX}px`);
        joystickHandle.style.setProperty("--stick-y", `${clampedY}px`);
      }

      function releaseJoystick() {
        joystickState.active = false;
        joystickState.pointerId = null;
        joystickState.x = 0;
        joystickState.y = 0;
        joystickHandle.style.setProperty("--stick-x", "0px");
        joystickHandle.style.setProperty("--stick-y", "0px");
      }

      function bindTouchControls() {
        const actionButtons = document.querySelectorAll(".action-btn");

        joystick.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          joystickState.active = true;
          joystickState.pointerId = event.pointerId;
          joystick.setPointerCapture?.(event.pointerId);
          setJoystickFromPointer(event.clientX, event.clientY);
        });

        joystick.addEventListener("pointermove", (event) => {
          if (!joystickState.active || joystickState.pointerId !== event.pointerId) return;
          event.preventDefault();
          setJoystickFromPointer(event.clientX, event.clientY);
        });

        joystick.addEventListener("pointerup", (event) => {
          if (joystickState.pointerId !== event.pointerId) return;
          releaseJoystick();
        });
        joystick.addEventListener("pointercancel", releaseJoystick);
        joystick.addEventListener("lostpointercapture", releaseJoystick);

        actionButtons.forEach((button) => {
          button.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            button.classList.add("is-pressed");
            ensureAudio();
            if (button.dataset.action === "jump") {
              game.jumpQueued = true;
            }
            if (button.dataset.action === "skill") {
              game.skillQueued = true;
            }
          });

          button.addEventListener("pointerup", () => {
            button.classList.remove("is-pressed");
          });
          button.addEventListener("pointerleave", () => {
            button.classList.remove("is-pressed");
          });
          button.addEventListener("pointercancel", () => {
            button.classList.remove("is-pressed");
          });
        });
      }

      function bindKeyboard() {
        window.addEventListener("keydown", (event) => {
          ensureAudio();
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
            event.preventDefault();
          }
          if (event.code === "KeyR") {
            restartLevel();
            return;
          }
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW", "KeyS"].includes(event.code)) {
            keys.add(event.code);
          }
          if (["Space", "ArrowUp", "KeyW"].includes(event.code) && !event.repeat) {
            game.jumpQueued = true;
          }
          if (event.code === "KeyX" && !event.repeat) {
            game.skillQueued = true;
          }
        });

        window.addEventListener("keyup", (event) => {
          keys.delete(event.code);
        });

        window.addEventListener("blur", () => keys.clear());
      }

      function resizeCanvas() {
        const rect = gameScreen.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const ratio = 16 / 9;
        let nextWidth = Math.round(rect.width);
        let nextHeight = Math.round(nextWidth / ratio);

        if (nextHeight > rect.height) {
          nextHeight = Math.round(rect.height);
          nextWidth = Math.round(nextHeight * ratio);
        }

        if (canvas.width === nextWidth && canvas.height === nextHeight) return;
        canvas.width = nextWidth;
        canvas.height = nextHeight;
        WIDTH = canvas.width;
      }

      function setupUI() {
        soundToggle.addEventListener("click", () => {
          game.audioEnabled = !game.audioEnabled;
          soundToggle.textContent = game.audioEnabled ? "🔊 音效" : "🔇 靜音";
          soundToggle.setAttribute("aria-label", game.audioEnabled ? "關閉音效" : "開啟音效");
          soundToggle.setAttribute("aria-pressed", String(game.audioEnabled));
          if (game.audioEnabled) ensureAudio();
        });

        restartBtn.addEventListener("click", () => {
          buildLevel(game.currentLevelIndex);
          resetPlayerState();
          overlay.hidden = true;
        });

        nextLevelBtn.addEventListener("click", () => {
          goToNextLevel();
        });

        retryBtn.addEventListener("click", () => {
          buildLevel(game.currentLevelIndex);
          resetPlayerState();
          overlay.hidden = true;
          game.state = "playing";
        });

        startLandscapeBtn.addEventListener("click", () => startGame("landscape"));
        startPortraitBtn.addEventListener("click", () => startGame("portrait"));

        window.addEventListener("resize", () => {
          if (!orientationLockMode && game.mobileMode) {
            autoStartForOrientation();
          }
        });

        window.addEventListener("orientationchange", () => {
          if (!orientationLockMode && game.mobileMode) {
            autoStartForOrientation();
          }
        });

        skipIntroBtn.addEventListener("click", () => {
          if (game.state !== "intro") return;
          game.state = "playing";
          introOverlay.classList.remove("visible");
          game.started = true;
        });
      }

      function initGame() {
        buildLevel(0);
        updateHud();
        resetPlayerState();
        setupUI();
        bindKeyboard();
        bindTouchControls();
        resizeCanvas();
        if (game.mobileMode) {
          autoStartForOrientation();
        }
        requestAnimationFrame(loop);
      }

      window.addEventListener("resize", resizeCanvas);
      initGame();
    })();
  </script>
</body>
</html>
