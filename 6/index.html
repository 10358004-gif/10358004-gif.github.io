<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="操控黑色火柴人，挑戰五個逐漸升級的平台闖關與最終 Boss。">
    <title>火柴人勇者：五大試煉</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            color: #233642;
            background: #edf5f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 25px 16px;
            background:
                radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.9), transparent 25rem),
                linear-gradient(145deg, #f3f8f6, #e3eff2);
        }

        button {
            font: inherit;
        }

        .game {
            width: min(1120px, 100%);
            margin: 0 auto;
            padding: 22px;
            border: 1px solid #dce8e7;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 20px 60px rgba(35, 67, 74, 0.13);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .eyebrow {
            margin: 0 0 4px;
            color: #398b79;
            font-size: 0.75rem;
            font-weight: 850;
            letter-spacing: 0.15em;
        }

        h1 {
            margin: 0;
            color: #1a3039;
            font-size: clamp(1.35rem, 3vw, 2rem);
            letter-spacing: -0.035em;
        }

        .restart,
        .overlay-button {
            min-height: 42px;
            padding: 9px 15px;
            border: 0;
            border-radius: 11px;
            background: #233f4b;
            color: white;
            font-weight: 750;
            cursor: pointer;
            transition: transform 150ms ease, background 150ms ease;
        }

        .restart:hover,
        .overlay-button:hover {
            transform: translateY(-2px);
            background: #356577;
        }

        button:focus-visible {
            outline: 3px solid #f3a955;
            outline-offset: 3px;
        }

        .hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 47px;
            padding: 8px 13px;
            border: 1px solid #e1eae8;
            border-radius: 12px;
            background: #f7faf8;
            color: #45606a;
            font-size: 0.91rem;
            font-weight: 750;
        }

        .hud-item strong {
            color: #203d48;
            font-size: 1.02rem;
            font-variant-numeric: tabular-nums;
        }

        .sound-toggle {
            border: 1px solid #e1eae8;
            cursor: pointer;
        }

        #lives {
            color: #e56761;
            letter-spacing: 0.1em;
        }

        .stage-name {
            overflow: hidden;
            max-width: 175px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .screen {
            position: relative;
            overflow: hidden;
            border: 5px solid white;
            border-radius: 16px;
            background: #a9e3ed;
            box-shadow: 0 7px 21px rgba(34, 76, 84, 0.15);
        }

        .touch-controls {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 18px;
            background: #193640;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .touch-button {
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 15px;
            background: rgba(26, 48, 57, 0.58);
            color: white;
            font-size: 1.35rem;
            font-weight: 850;
            box-shadow: 0 3px 8px rgba(15, 35, 42, 0.2);
            pointer-events: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .touch-button:active,
        .touch-button.is-pressed {
            background: rgba(49, 132, 100, 0.62);
            transform: scale(0.94);
        }

        .joystick {
            position: relative;
            display: grid;
            width: 118px;
            height: 118px;
            flex: 0 0 auto;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            background: rgba(26, 48, 57, 0.38);
            touch-action: none;
        }

        .joystick:active,
        .joystick.is-pressed {
            background: rgba(26, 48, 57, 0.5);
        }

        .joystick-arrow {
            position: absolute;
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.88rem;
            line-height: 1;
            pointer-events: none;
        }

        .joystick-arrow.up {
            top: 9px;
            left: 50%;
            transform: translateX(-50%);
        }

        .joystick-arrow.right {
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
        }

        .joystick-arrow.down {
            bottom: 9px;
            left: 50%;
            transform: translateX(-50%);
        }

        .joystick-arrow.left {
            top: 50%;
            left: 9px;
            transform: translateY(-50%);
        }

        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 48%;
            height: 48%;
            border: 1px solid rgba(255, 255, 255, 0.78);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.38);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            pointer-events: none;
            transform: translate(calc(-50% + var(--stick-x, 0px)), calc(-50% + var(--stick-y, 0px)));
        }

        .action-pad {
            position: relative;
            display: block;
            width: 168px;
            height: 142px;
        }

        .action-button {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            font-size: 0.82rem;
            background: rgba(49, 103, 133, 0.55);
        }

        .action-button.skill {
            right: 0;
            bottom: 72px;
            left: auto;
            width: 68px;
            height: 68px;
            background: rgba(170, 76, 57, 0.58);
        }

        @media (pointer: coarse), (max-width: 760px) {
            .touch-controls {
                display: flex;
                flex: 0 0 clamp(156px, 30vh, 170px);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .level-label {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            color: #294955;
            font-size: 0.82rem;
            font-weight: 800;
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            z-index: 3;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(24, 48, 57, 0.48);
            backdrop-filter: blur(3px);
        }

        .overlay[hidden] {
            display: none;
        }

        .overlay-panel {
            width: min(390px, 100%);
            padding: 27px 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            background: #fffefa;
            text-align: center;
            box-shadow: 0 18px 50px rgba(15, 35, 42, 0.22);
            animation: arrive 220ms ease-out;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(9px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .overlay-icon {
            display: grid;
            width: 54px;
            height: 54px;
            margin: 0 auto 12px;
            place-items: center;
            border-radius: 17px;
            background: #e3f5eb;
            font-size: 1.65rem;
        }

        .overlay-panel h2 {
            margin: 0;
            color: #203b42;
            font-size: 1.5rem;
        }

        .overlay-panel p {
            margin: 8px 0 19px;
            color: #62757a;
            line-height: 1.6;
        }

        .overlay-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .overlay-button.primary {
            background: #318464;
        }

        .overlay-button.primary:hover {
            background: #24694f;
        }

        .instructions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 15px;
            color: #60737a;
            font-size: 0.88rem;
        }

        .key-list {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        kbd {
            padding: 3px 8px;
            border: 1px solid #d2e0df;
            border-bottom-width: 3px;
            border-radius: 7px;
            background: #f8fbfa;
            color: #294955;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 800;
        }

        @media (max-width: 620px) {
            body {
                padding: 12px 8px;
            }

            .game {
                padding: 13px;
                border-radius: 17px;
            }

            header {
                align-items: flex-start;
            }

            .restart {
                padding: 8px 10px;
                font-size: 0.83rem;
            }

            .hud {
                gap: 5px;
            }

            .hud-item {
                flex-direction: column;
                gap: 0;
                min-height: 53px;
                padding: 5px 3px;
                font-size: 0.7rem;
            }

            .hud-item strong {
                font-size: 0.87rem;
            }

            .stage-name {
                max-width: 95px;
            }

            .level-label {
                top: 7px;
                left: 7px;
                padding: 4px 8px;
                font-size: 0.68rem;
            }

            .instructions {
                align-items: flex-start;
                flex-direction: column;
                font-size: 0.82rem;
            }

            .screen {
                border-width: 3px;
            }

            .touch-controls {
                padding: 8px;
            }

            .touch-button {
                width: 40px;
                height: 40px;
                border-radius: 12px;
            }

            .action-pad {
                gap: 6px;
            }

            .action-button {
                width: 52px;
                height: 52px;
                font-size: 0.74rem;
            }

            .action-button.skill {
                width: 58px;
                height: 58px;
            }
        }

        @media (pointer: coarse), (max-width: 760px) {
            html,
            body {
                width: 100%;
                height: 100%;
                min-height: 100%;
                overflow: hidden;
            }

            body {
                padding: 0;
                background: #a9e3ed;
            }

            .game {
                display: flex;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                flex-direction: column;
                margin: 0;
                padding: 0;
                overflow: hidden;
                border: 0;
                border-radius: 0;
                background: #a9e3ed;
                box-shadow: none;
            }

            .game header,
            .instructions {
                display: none;
            }

            .screen {
                flex: 1;
                min-height: 0;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .screen canvas {
                width: 100%;
                height: 100%;
                aspect-ratio: auto;
            }

            .hud {
                position: absolute;
                z-index: 2;
                top: max(8px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                left: max(8px, env(safe-area-inset-left));
                gap: 5px;
                margin: 0;
                pointer-events: none;
            }

            .sound-toggle {
                pointer-events: auto;
            }

            .hud-item {
                min-width: 0;
                min-height: 36px;
                padding: 4px 5px;
                border-color: rgba(255, 255, 255, 0.72);
                background: rgba(255, 255, 255, 0.78);
                font-size: clamp(0.65rem, 3vw, 0.82rem);
            }

            .hud-item strong {
                font-size: clamp(0.72rem, 3.4vw, 0.9rem);
            }

            .touch-controls {
                flex-basis: clamp(100px, 22vh, 132px);
                padding:
                    6px
                    max(10px, env(safe-area-inset-right))
                    max(6px, env(safe-area-inset-bottom))
                    max(10px, env(safe-area-inset-left));
                border-top: 1px solid rgba(255, 255, 255, 0.16);
            }

            .joystick {
                width: clamp(96px, 25vh, 120px);
                height: clamp(96px, 25vh, 120px);
                flex: 0 0 auto;
            }

            .action-pad {
                width: clamp(132px, 22vw, 168px);
                height: clamp(100px, 20vh, 124px);
            }

            .action-button,
            .action-button.skill {
                position: absolute;
                display: grid;
                width: clamp(58px, 17vw, 72px);
                height: clamp(58px, 17vw, 72px);
                border: 2px solid rgba(255, 255, 255, 0.85);
                border-radius: 50%;
                font-size: clamp(0.72rem, 3.5vw, 0.9rem);
            }

            .action-button {
                bottom: 0;
                left: 0;
                background: rgba(49, 103, 133, 0.55);
            }

            .action-button.skill {
                right: 0;
                top: 0;
                bottom: auto;
                background: rgba(170, 76, 57, 0.58);
            }

            .level-label {
                top: max(54px, calc(env(safe-area-inset-top) + 46px));
                left: max(10px, env(safe-area-inset-left));
            }
        }

        @media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 760px) {
            .game {
                position: fixed;
                top: 50%;
                left: 50%;
                width: 100vh;
                width: 100dvh;
                height: 100vw;
                transform: translate(-50%, -50%) rotate(90deg);
                transform-origin: center;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="game">
        <header>
            <div>
                <p class="eyebrow">STICKMAN PLATFORM QUEST</p>
                <h1>火柴人勇者：五大試煉</h1>
            </div>
            <button class="restart" id="restart" type="button" title="重新開始目前關卡 (R)">重新開始本關 ↻</button>
        </header>

        <section class="screen" aria-label="火柴人闖關遊戲畫面">
            <canvas id="game-canvas" width="960" height="540" aria-label="使用方向鍵或觸控按鈕移動、跳躍與施放技能"></canvas>
            <section class="hud" aria-label="遊戲狀態" aria-live="polite">
                <div class="hud-item">關卡 <strong id="level-display">1 / 5</strong></div>
                <div class="hud-item">生命 <strong id="lives">♥ ♥ ♥</strong></div>
                <div class="hud-item">分數 <strong id="score">0</strong></div>
                <button class="hud-item sound-toggle" id="sound-toggle" type="button" aria-label="關閉遊戲音效" aria-pressed="true">🔊 音效</button>
            </section>
            <div class="level-label" id="level-name">第 1 關・新手訓練</div>
            <div class="overlay" id="overlay" hidden>
                <div class="overlay-panel">
                    <div class="overlay-icon" id="overlay-icon" aria-hidden="true">🏁</div>
                    <h2 id="overlay-title">恭喜過關！</h2>
                    <p id="overlay-message"></p>
                    <div class="overlay-actions">
                        <button class="overlay-button primary" id="next-level" type="button">下一關 →</button>
                        <button class="overlay-button" id="retry" type="button" hidden>重新挑戰</button>
                    </div>
                </div>
            </div>
        </section>
        <div class="touch-controls" aria-label="觸控遊戲操作">
            <button class="touch-button joystick" id="joystick" type="button" data-action="joystick" aria-label="方向輪盤，拖曳以控制上下左右">
                <span class="joystick-arrow up" aria-hidden="true">▲</span>
                <span class="joystick-arrow right" aria-hidden="true">▶</span>
                <span class="joystick-arrow down" aria-hidden="true">▼</span>
                <span class="joystick-arrow left" aria-hidden="true">◀</span>
                <span class="joystick-knob" aria-hidden="true"></span>
            </button>
            <div class="action-pad">
                <button class="touch-button action-button" type="button" data-action="jump">跳躍</button>
                <button class="touch-button action-button skill" type="button" data-action="skill">技能</button>
            </div>
        </div>

        <div class="instructions">
            <span>躲開陷阱、擊退敵人、收集金幣，勇闖五大關卡！</span>
            <div class="key-list" aria-label="遊戲操作">
                <kbd>←</kbd><kbd>→</kbd><span>移動</span>
                <kbd>Space</kbd><span>跳躍</span>
                <kbd>X</kbd><span>施放技能</span>
                <kbd>R</kbd><span>重玩本關</span>
            </div>
        </div>
    </main>

            function unlockAudio() {
                if (!audioEnabled) return;
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) {
                    soundToggle.disabled = true;
                    soundToggle.textContent = "無音";
                    soundToggle.setAttribute("aria-label", "此瀏覽器不支援遊戲音效");
                    return;
                }
                if (!audioContext) audioContext = new AudioContextClass();
                if (audioContext.state === "suspended") {
                    audioContext.resume().catch((error) => console.error("無法啟用遊戲音效：", error));
                }
            }

            function startAudioFromGesture() {
                unlockAudio();
                if (audioGestureUnlocked || !audioEnabled || !audioContext) return;
                audioGestureUnlocked = true;
                playSound("coin");
            }

            function playSound(kind) {
                if (!audioEnabled) return;
                unlockAudio();
                if (!audioContext) return;

                const sounds = {
                    jump: { start: 360, end: 620, duration: 0.13, wave: "sine" },
                    skill: { start: 720, end: 180, duration: 0.2, wave: "sawtooth" },
                    coin: { start: 820, end: 1180, duration: 0.11, wave: "sine" },
                    stomp: { start: 250, end: 440, duration: 0.12, wave: "triangle" },
                    hit: { start: 190, end: 75, duration: 0.24, wave: "triangle" },
                    clear: { start: 520, end: 1040, duration: 0.32, wave: "sine" }
                };
                const sound = sounds[kind];
                if (!sound) return;

                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.type = sound.wave;
                oscillator.frequency.setValueAtTime(sound.start, now);
                oscillator.frequency.exponentialRampToValueAtTime(sound.end, now + sound.duration);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.12, now + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + sound.duration);
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start(now);
                oscillator.stop(now + sound.duration);
            }

            async function requestLandscape() {
                if (document.documentElement.requestFullscreen) {
                    try {
                        await document.documentElement.requestFullscreen();
                    } catch (error) {
                        console.warn("瀏覽器未允許進入全螢幕，請手動旋轉手機。", error);
                    }
                }
                if (window.screen.orientation && window.screen.orientation.lock) {
                    try {
                        await window.screen.orientation.lock("landscape");
                    } catch (error) {
                        console.warn("瀏覽器未允許鎖定橫向，請手動旋轉手機。", error);
                    }
                }
            }

            function resizeCanvas() {
                const width = gameScreen.offsetWidth;
                const height = gameScreen.offsetHeight;
                if (!width || !height) return;
                const nextWidth = Math.max(1, Math.round(HEIGHT * width / height));
                if (canvas.width === nextWidth) return;
                canvas.width = nextWidth;
                WIDTH = nextWidth;
                if (level) cameraX = Math.max(0, Math.min(level.width - WIDTH, cameraX));
            }

            function updateJoystick(event) {
                const bounds = joystick.getBoundingClientRect();
                const radius = Math.min(bounds.width, bounds.height) / 2;
                let dx = (event.clientX - (bounds.left + bounds.width / 2)) / radius;
                let dy = (event.clientY - (bounds.top + bounds.height / 2)) / radius;
                if (window.matchMedia("(orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 760px)").matches) {
                    const screenX = dx;
                    dx = dy;
                    dy = -screenX;
                }
                const magnitude = Math.hypot(dx, dy);
                if (magnitude > 1) {
                    dx /= magnitude;
                    dy /= magnitude;
                }

                const wasUp = keys.has("ArrowUp");
                keys.delete("ArrowLeft");
                keys.delete("ArrowRight");
                keys.delete("ArrowUp");
                keys.delete("ArrowDown");
                if (dx < -0.3) keys.add("ArrowLeft");
                if (dx > 0.3) keys.add("ArrowRight");
                if (dy < -0.3) keys.add("ArrowUp");
                if (dy > 0.3) keys.add("ArrowDown");
                if (!wasUp && keys.has("ArrowUp")) jumpQueued = true;

                joystick.style.setProperty("--stick-x", `${dx * radius * 0.52}px`);
                joystick.style.setProperty("--stick-y", `${dy * radius * 0.52}px`);
            }

            function rectsOverlap(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
            }

            function makeLevel(template) {
                return {
                    name: template.name,
                    width: template.width,
                    ground: template.ground.map(([x, end]) => ({ x, y: FLOOR, w: end - x, h: HEIGHT - FLOOR + 30 })),
                    platforms: template.platforms.map((platform) => ({ ...platform, h: platform.h || 16 })),
                    spikes: template.spikes.map((hazard) => ({ ...hazard })),
                    movers: template.movers.map((mover) => ({ ...mover, w: mover.w, h: mover.h, previousX: mover.x, previousY: mover.y, dx: 0, dy: 0 })),
                    traps: template.traps.map((trap) => ({ ...trap })),
                    enemies: template.enemies.map((enemy) => ({ ...enemy, alive: true })),
                    boss: template.boss ? { ...template.boss } : null,
                    coins: template.coins.map((coin, index) => ({
                        ...coin,
                        id: `${levelIndex}-${index}`,
                        collected: collectedCoins.has(`${levelIndex}-${index}`)
                    }))
                };
            }

            function buildSolids() {
                return [...level.ground, ...level.platforms, ...level.movers];
            }

                livesDisplay.textContent = `${"♥ ".repeat(lives).trim()}${lives < 3 ? ` ${"♡ ".repeat(3 - lives).trim()}` : ""}`;

            function showOverlay(kind, title, message, icon) {

            function completeLevel() {
                playSound("clear");
                if (levelIndex === levelTemplates.length - 1) {
                    showOverlay("cleared", "恭喜你完成全部關卡！", `五大試煉全部通過，最終分數 ${score} 分！`, "🏆");
                } else {

            }

            function loseLife() {
                if (gameState !== "playing" || player.invulnerable > 0) return;
                playSound("hit");
                lives -= 1;
                updateHud();
                if (lives <= 0) {
                    showOverlay("gameover", "生命用盡了！", `你目前的分數是 ${score} 分。重新挑戰本關，再試一次吧！`, "💪");
                    return;

                resetActors();

            function restartLevel() {
                lives = 3;

            function movePatrol(actor, delta) {
                const oldX = actor.x;
                actor.x += actor.speed * actor.dir * delta;
                if (actor.x < actor.min) {
                    actor.x = actor.min;
                    actor.dir = 1;
                } else if (actor.x + actor.w > actor.max) {
                    actor.x = actor.max - actor.w;
                    actor.dir = -1;
                }
                return actor.x - oldX;
            }

            function updateMovers(delta) {
                for (const mover of level.movers) {
                    mover.previousX = mover.x;
                    mover.previousY = mover.y;
                    if (mover.axis === "x") {
                        mover.x += mover.speed * mover.dir * delta;
                        if (mover.x < mover.min || mover.x > mover.max) {
                            mover.x = Math.max(mover.min, Math.min(mover.max, mover.x));
                            mover.dir *= -1;
                        }
                    } else {
                        mover.y += mover.speed * mover.dir * delta;
                        if (mover.y < mover.min || mover.y > mover.max) {
                            mover.y = Math.max(mover.min, Math.min(mover.max, mover.y));
                            mover.dir *= -1;
                        }
                    }
                    mover.dx = mover.x - mover.previousX;
                    mover.dy = mover.y - mover.previousY;
                }
            }

            function updateTraps(delta) {
                for (const trap of level.traps) {
                    const coordinate = trap.axis === "x" ? "x" : "y";
                    trap[coordinate] += trap.speed * trap.dir * delta;
                    if (trap[coordinate] < trap.min || trap[coordinate] > trap.max) {
                        trap[coordinate] = Math.max(trap.min, Math.min(trap.max, trap[coordinate]));
                        trap.dir *= -1;
                    }
                }
                for (const enemy of level.enemies) {
                    if (enemy.alive) movePatrol(enemy, delta);
                }
                if (level.boss && level.boss.hp > 0) movePatrol(level.boss, delta);
            }

            function update(delta) {
                if (gameState !== "playing") return;
                const step = Math.min(delta, 0.032);
                animationTime += step;
                player.invulnerable = Math.max(0, player.invulnerable - step);
                skillCooldown = Math.max(0, skillCooldown - step);
                skillEffect = Math.max(0, skillEffect - step);
                updateMovers(step);
                updateTraps(step);

                if (player.supportMover >= 0) {
                    const support = level.movers[player.supportMover];
                    if (support) {
                        player.x += support.dx;
                        player.y += support.dy;
                    }
                }

                const left = keys.has("ArrowLeft") || keys.has("KeyA");
                const right = keys.has("ArrowRight") || keys.has("KeyD");
                player.vx = (Number(right) - Number(left)) * SPEED;
                if (player.vx !== 0) player.facing = Math.sign(player.vx);

                if (skillQueued) castSkill();
                skillQueued = false;

                if (jumpQueued && player.grounded) {
                    playSound("jump");
                    player.vy = -JUMP;
                    player.grounded = false;
                    player.supportMover = -1;
                }
                jumpQueued = false;
                if (keys.has("ArrowDown") && !player.grounded) {
                    player.vy = Math.max(player.vy, JUMP * 0.65);
                }

                const solids = buildSolids();
                player.x += player.vx * step;
                for (const solid of solids) {
                    if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) {
                        if (player.vx > 0) player.x = solid.x - PLAYER_WIDTH;
                        else if (player.vx < 0) player.x = solid.x + solid.w;
                    }
                }

                const previousY = player.y;
                const previousBottom = previousY + PLAYER_HEIGHT;
                player.vy += GRAVITY * step;
                player.y += player.vy * step;
                player.grounded = false;
                player.supportMover = -1;

                for (const solid of solids) {
                    if (!rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, solid)) continue;
                    if (player.vy >= 0 && previousBottom <= solid.y + 8) {
                        player.y = solid.y - PLAYER_HEIGHT;
                        player.vy = 0;
                        player.grounded = true;
                        const moverIndex = level.movers.indexOf(solid);
                        if (moverIndex >= 0) player.supportMover = moverIndex;
                    } else if (player.vy < 0 && previousY >= solid.y + solid.h - 4) {
                        player.y = solid.y + solid.h;
                        player.vy = 0;
                    }
                }

                player.x = Math.max(0, Math.min(level.width - PLAYER_WIDTH, player.x));
                collectCoins();
                const activeLevel = level;
                handleHazards();
                if (level !== activeLevel || gameState !== "playing") return;
                handleEnemies(previousBottom);
                if (level !== activeLevel || gameState !== "playing") return;

                if (player.y > HEIGHT + 70) {
                    loseLife();
                    return;
                }

                const exit = { x: level.width - 80, y: FLOOR - 82, w: 42, h: 82 };
                if (rectsOverlap({ x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT }, exit) &&
                    (!level.boss || level.boss.hp <= 0)) {
                    completeLevel();
                    return;
                }

                const targetCamera = Math.max(0, Math.min(level.width - WIDTH, player.x - WIDTH * 0.36));
                cameraX += (targetCamera - cameraX) * Math.min(1, step * 6);
            }

            function collectCoins() {
                const playerBox = { x: player.x, y: player.y, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
                for (const coin of level.coins) {
                    if (coin.collected) continue;
                    if (rectsOverlap(playerBox, { x: coin.x - 12, y: coin.y - 12, w: 24, h: 24 })) {
                        coin.collected = true;
                        collectedCoins.add(coin.id);
                        score += 100;
                        playSound("coin");
                        updateHud();
                    }
                }
            }

            function castSkill() {
                if (gameState !== "playing" || skillCooldown > 0) return;
                skillCooldown = 0.8;
                skillEffect = 0.22;
                playSound("skill");
                const reach = 165;
                const playerCenterX = player.x + PLAYER_WIDTH / 2;
                const playerCenterY = player.y + PLAYER_HEIGHT / 2;
                for (const enemy of level.enemies) {
                    if (!enemy.alive) continue;
                    const targetX = enemy.x + enemy.w / 2;
                    const inFront = (targetX - playerCenterX) * player.facing >= 0;
                    if (inFront && Math.abs(targetX - playerCenterX) <= reach &&
                        Math.abs(enemy.y + enemy.h / 2 - playerCenterY) <= 55) {
                        enemy.alive = false;
                        score += 150;
                    }
                }

                const boss = level.boss;
                if (boss && boss.hp > 0) {
                    const targetX = boss.x + boss.w / 2;
                    const inFront = (targetX - playerCenterX) * player.facing >= 0;
                    if (inFront && Math.abs(targetX - playerCenterX) <= reach &&
                        Math.abs(boss.y + boss.h / 2 - playerCenterY) <= 65) {
                        boss.hp -= 1;
                        score += 250;
                    }
                }
                updateHud();
            }

            function handleHazards() {
                const playerBox = { x: player.x + 4, y: player.y + 3, w: PLAYER_WIDTH - 8, h: PLAYER_HEIGHT - 4 };
                for (const spike of level.spikes) {
                    if (rectsOverlap(playerBox, spike)) {
                        loseLife();
                        return;
                    }
                }
                for (const trap of level.traps) {
                    const box = { x: trap.x - trap.r + 4, y: trap.y - trap.r + 4, w: trap.r * 2 - 8, h: trap.r * 2 - 8 };
                    if (rectsOverlap(playerBox, box)) {
                        loseLife();
                        return;
                    }
                }
            }

            function handleEnemies(previousBottom) {
                const playerBox = { x: player.x + 3, y: player.y, w: PLAYER_WIDTH - 6, h: PLAYER_HEIGHT };
                for (const enemy of level.enemies) {
                    if (!enemy.alive || !rectsOverlap(playerBox, enemy)) continue;
                    if (player.vy > 0 && previousBottom <= enemy.y + 14) {
                        enemy.alive = false;
                        player.y = enemy.y - PLAYER_HEIGHT;
                        player.vy = -JUMP * 0.55;
                        player.grounded = false;
                        score += 150;
                        playSound("stomp");
                        updateHud();
                    } else {
                        loseLife();
                        return;
                    }
                }

                const boss = level.boss;
                if (boss && boss.hp > 0 && rectsOverlap(playerBox, boss)) {
                    if (player.vy > 0 && previousBottom <= boss.y + 18) {
                        boss.hp -= 1;
                        player.y = boss.y - PLAYER_HEIGHT;
                        player.vy = -JUMP * 0.68;
                        player.grounded = false;
                        score += 250;
                        playSound("stomp");
                        updateHud();
                    } else {
                        loseLife();
                    }
                }
            }

            function drawMountainLayer(spacing, baseY, peakHeight, parallax, color, phase) {
                const firstMountain = Math.floor(cameraX * parallax / spacing) - 1;
                const lastMountain = Math.ceil((cameraX * parallax + WIDTH) / spacing) + 1;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(0, HEIGHT);
                for (let index = firstMountain; index <= lastMountain; index += 1) {
                    const centerX = index * spacing + spacing / 2 - cameraX * parallax;
                    const peakY = baseY - peakHeight * (0.72 + Math.sin(index * 1.7 + phase) * 0.18);
                    ctx.lineTo(centerX - spacing / 2, baseY);
                    ctx.lineTo(centerX, peakY);
                    ctx.lineTo(centerX + spacing / 2, baseY);
                }
                ctx.lineTo(WIDTH, HEIGHT);
                ctx.closePath();
                ctx.fill();
            }

            function drawBackground() {
                const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
                sky.addColorStop(0, "#8bd8ef");
                sky.addColorStop(1, "#e1f8d7");
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                drawMountainLayer(250, 405, 150, 0.13, "#a2c9bd", 0.4);
                drawMountainLayer(330, 420, 115, 0.25, "#81b7a5", 1.2);

                ctx.fillStyle = "#fff4b8";
                ctx.beginPath();
                const sunCycle = WIDTH + 200;
                const sunX = ((790 - cameraX * 0.08) % sunCycle + sunCycle) % sunCycle - 100;
                ctx.arc(sunX, 92, 37, 0, Math.PI * 2);
                ctx.fill();

                for (let i = 0; i < 7; i += 1) {
                    const x = ((i * 190 - cameraX * 0.17) % (WIDTH + 220) + WIDTH + 220) % (WIDTH + 220) - 100;
                    const y = 110 + (i % 3) * 35;
                    ctx.fillStyle = "rgba(255,255,255,0.64)";
                    ctx.beginPath();
                    ctx.ellipse(x, y, 37, 12, 0, 0, Math.PI * 2);
                    ctx.ellipse(x + 22, y - 9, 22, 16, 0, 0, Math.PI * 2);
                    ctx.ellipse(x + 43, y, 30, 11, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = "#abdccf";
                ctx.beginPath();
                ctx.moveTo(0, 405);
                for (let x = 0; x <= WIDTH + 70; x += 70) {
                    ctx.lineTo(x, 336 + Math.sin((x + cameraX * 0.2) * 0.012) * 24);
                }
                ctx.lineTo(WIDTH, FLOOR);
                ctx.lineTo(0, FLOOR);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#c5e8ce";
                ctx.beginPath();
                ctx.moveTo(0, 442);
                for (let x = 0; x <= WIDTH + 60; x += 60) {
                    ctx.lineTo(x, 387 + Math.sin((x + cameraX * 0.34) * 0.016) * 15);
                }
                ctx.lineTo(WIDTH, FLOOR);
                ctx.lineTo(0, FLOOR);
                ctx.closePath();
                ctx.fill();
            }

            function drawPlatforms() {
                for (const ground of level.ground) {
                    const x = ground.x - cameraX;
                    if (x + ground.w < -5 || x > WIDTH + 5) continue;
                    ctx.fillStyle = "#5d9c61";
                    ctx.fillRect(x, ground.y, ground.w, ground.h);
                    ctx.fillStyle = "#83cc72";
                    ctx.fillRect(x, ground.y, ground.w, 10);
                    ctx.fillStyle = "rgba(255,255,255,.14)";
                    for (let detail = 24; detail < ground.w; detail += 48) {
                        ctx.fillRect(x + detail, ground.y + 24, 16, 4);
                    }
                }

                for (const platform of [...level.platforms, ...level.movers]) {
                    const x = platform.x - cameraX;
                    if (x + platform.w < -5 || x > WIDTH + 5) continue;
                    ctx.fillStyle = platform.h > 25 ? "#bf8755" : "#b77e4f";
                    ctx.beginPath();
                    ctx.roundRect(x, platform.y, platform.w, platform.h, 6);
                    ctx.fill();
                    ctx.fillStyle = platform.h > 25 ? "#f5c27b" : "#f3ca82";
                    ctx.beginPath();
                    ctx.roundRect(x, platform.y, platform.w, Math.min(8, platform.h), 5);
                    ctx.fill();
                    if (level.movers.includes(platform)) {
                        ctx.fillStyle = "#fff3c0";
                        ctx.beginPath();
                        ctx.arc(x + 12, platform.y + platform.h / 2, 3, 0, Math.PI * 2);
                        ctx.arc(x + platform.w - 12, platform.y + platform.h / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawSpikes() {
                for (const spike of level.spikes) {
                    const x = spike.x - cameraX;
                    if (x + spike.w < -5 || x > WIDTH + 5) continue;
                    const count = Math.max(2, Math.floor(spike.w / 17));
                    const w = spike.w / count;
                    ctx.fillStyle = "#e45f5a";
                    ctx.strokeStyle = "#ad4645";
                    ctx.lineWidth = 2;
                    for (let i = 0; i < count; i += 1) {
                        ctx.beginPath();
                        ctx.moveTo(x + i * w, spike.y + spike.h);
                        ctx.lineTo(x + (i + 0.5) * w, spike.y);
                        ctx.lineTo(x + (i + 1) * w, spike.y + spike.h);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }
            }

            function drawTraps() {
                for (const trap of level.traps) {
                    const x = trap.x - cameraX;
                    ctx.save();
                    ctx.translate(x, trap.y);
                    ctx.rotate(animationTime * 4 * trap.dir);
                    ctx.fillStyle = "#e75d58";
                    ctx.strokeStyle = "#a8363d";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let i = 0; i < 8; i += 1) {
                        const angle = i * Math.PI / 4;
                        const inner = i % 2 === 0 ? trap.r : trap.r * 0.68;
                        const px = Math.cos(angle) * inner;
                        const py = Math.sin(angle) * inner;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#fff1cf";
                    ctx.beginPath();
                    ctx.arc(0, 0, trap.r * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function drawCoins() {
                for (const coin of level.coins) {
                    if (coin.collected) continue;
                    const x = coin.x - cameraX;
                    if (x < -20 || x > WIDTH + 20) continue;
                    const bob = Math.sin(animationTime * 5 + coin.x) * 3;
                    ctx.fillStyle = "rgba(255, 194, 54, 0.22)";
                    ctx.beginPath();
                    ctx.arc(x, coin.y + bob, 16, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#ffc83d";
                    ctx.strokeStyle = "#d99425";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(x, coin.y + bob, 9, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = "#fff4ae";
                    ctx.fillRect(x - 1, coin.y - 5 + bob, 2, 10);
                }
            }

            function drawEnemies() {
                for (const enemy of level.enemies) {
                    if (!enemy.alive) continue;
                    const x = enemy.x - cameraX;
                    ctx.fillStyle = "#d95652";
                    ctx.beginPath();
                    ctx.roundRect(x, enemy.y + 7, enemy.w, enemy.h - 7, 11);
                    ctx.fill();
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(x + 10, enemy.y + 18, 4, 0, Math.PI * 2);
                    ctx.arc(x + 22, enemy.y + 18, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#382938";
                    ctx.beginPath();
                    ctx.arc(x + 11, enemy.y + 18, 1.8, 0, Math.PI * 2);
                    ctx.arc(x + 23, enemy.y + 18, 1.8, 0, Math.PI * 2);
                    ctx.fill();
                }

                const boss = level.boss;
                if (boss && boss.hp > 0) {
                    const x = boss.x - cameraX;
                    ctx.fillStyle = "#6f3a7d";
                    ctx.beginPath();
                    ctx.roundRect(x, boss.y + 12, boss.w, boss.h - 12, 18);
                    ctx.fill();
                    ctx.fillStyle = "#f08365";
                    ctx.beginPath();
                    ctx.moveTo(x + 7, boss.y + 18);
                    ctx.lineTo(x + 9, boss.y - 1);
                    ctx.lineTo(x + 23, boss.y + 14);
                    ctx.lineTo(x + 38, boss.y - 1);
                    ctx.lineTo(x + 51, boss.y + 18);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = "#fff1d2";
                    ctx.fillRect(x + 12, boss.y + 31, 10, 7);
                    ctx.fillRect(x + 36, boss.y + 31, 10, 7);
                    ctx.fillStyle = "#382938";
                    ctx.fillRect(x + 16, boss.y + 32, 4, 5);
                    ctx.fillRect(x + 40, boss.y + 32, 4, 5);
                    ctx.fillStyle = "#673548";
                    ctx.fillRect(x, boss.y - 12, boss.w, 6);
                    ctx.fillStyle = "#ffca62";
                    ctx.fillRect(x, boss.y - 12, boss.w * (boss.hp / boss.maxHp), 6);
                    ctx.fillStyle = "#573e66";
                    ctx.font = "bold 12px Segoe UI, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(`BOSS ${boss.hp}/${boss.maxHp}`, x + boss.w / 2, boss.y - 19);
                }
            }

            function drawPlayer() {
                if (player.invulnerable > 0 && Math.floor(animationTime * 14) % 2 === 0) return;
                const x = player.x - cameraX + PLAYER_WIDTH / 2;
                const y = player.y;
                const walk = player.grounded && Math.abs(player.vx) > 0;
                const swing = walk ? Math.sin(animationTime * 14) * 6 : 0;
                ctx.save();
                ctx.strokeStyle = "#101820";
                ctx.fillStyle = "#101820";
                ctx.lineWidth = 5;
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.beginPath();
                ctx.arc(x, y + 8, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x, y + 17);
                ctx.lineTo(x, y + 33);
                ctx.moveTo(x, y + 22);
                ctx.lineTo(x - 10, y + 29 - swing * 0.35);
                ctx.moveTo(x, y + 22);
                ctx.lineTo(x + 10, y + 29 + swing * 0.35);
                ctx.moveTo(x, y + 33);
                ctx.lineTo(x - 8 - swing * 0.45, y + 47);
                ctx.moveTo(x, y + 33);
                ctx.lineTo(x + 8 + swing * 0.45, y + 47);
                ctx.stroke();
                ctx.restore();
            }

            function drawSkillEffect() {
                if (skillEffect <= 0) return;
                const progress = 1 - skillEffect / 0.22;
                const x = player.x + PLAYER_WIDTH / 2 + player.facing * (24 + progress * 35) - cameraX;
                const y = player.y + PLAYER_HEIGHT / 2;
                ctx.save();
                ctx.globalAlpha = 1 - progress;
                ctx.strokeStyle = "#ffdb70";
                ctx.lineWidth = 6 - progress * 3;
                ctx.beginPath();
                ctx.arc(x, y, 15 + progress * 22, -Math.PI * 0.72, Math.PI * 0.72);
                ctx.stroke();
                ctx.restore();
            }

            function drawExit() {
                const x = level.width - 64 - cameraX;
                ctx.strokeStyle = "#39535d";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x, FLOOR);
                ctx.lineTo(x, FLOOR - 76);
                ctx.stroke();
                ctx.fillStyle = "#fffefa";
                ctx.fillRect(x + 3, FLOOR - 74, 45, 31);
                ctx.fillStyle = "#38a77b";
                ctx.beginPath();
                ctx.moveTo(x + 3, FLOOR - 74);
                ctx.lineTo(x + 25, FLOOR - 74);
                ctx.lineTo(x + 25, FLOOR - 59);
                ctx.lineTo(x + 3, FLOOR - 59);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#f07862";
                ctx.fillRect(x + 25, FLOOR - 59, 23, 16);
                if (level.boss && level.boss.hp > 0) {
                    ctx.fillStyle = "rgba(76,45,68,.9)";
                    ctx.font = "bold 11px Segoe UI, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("擊敗 Boss", x + 23, FLOOR - 87);
                }
            }

            function draw() {
                drawBackground();
                drawPlatforms();
                drawSpikes();
                drawTraps();
                drawCoins();
                drawEnemies();
                drawExit();
                drawSkillEffect();
                drawPlayer();
            }

            function loop(timestamp) {
                const delta = lastTime ? (timestamp - lastTime) / 1000 : 0;
                lastTime = timestamp;
                update(delta);
                draw();
                requestAnimationFrame(loop);
            }

            function advanceLevel() {
                if (gameState !== "cleared") return;
                if (nextButton.dataset.finish === "true") {
                    restartCampaign();
                    return;
                }
                levelIndex += 1;
                resetActors();
            }

            function restartCampaign() {
                levelIndex = 0;
                lives = 3;
                score = 0;
                collectedCoins.clear();
                resetActors();
            }

            window.addEventListener("keydown", (event) => {
                startAudioFromGesture();
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(event.code)) {
                    event.preventDefault();
                }
                if (event.code === "KeyR") {
                    restartLevel();
                    return;
                }
                if (["Space", "ArrowUp"].includes(event.code) && !event.repeat) jumpQueued = true;
                if (event.code === "KeyX" && !event.repeat) skillQueued = true;
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "KeyA", "KeyD", "KeyW"].includes(event.code)) {
                    keys.add(event.code);
                }
            });

            window.addEventListener("keyup", (event) => {
                keys.delete(event.code);
            });

            window.addEventListener("blur", () => keys.clear());
            touchButtons.forEach((button) => {
                let activePointerId = null;
                const press = (event) => {
                    event.preventDefault();
                    startAudioFromGesture();
                    if (!landscapeRequested) {
                        landscapeRequested = true;
                        requestLandscape();
                    }
                    activePointerId = event.pointerId;
                    button.classList.add("is-pressed");
                    if (button.dataset.key) {
                        keys.add(button.dataset.key);
                        if (button.dataset.key === "ArrowUp") jumpQueued = true;
                    } else if (button.dataset.action === "joystick") {
                        updateJoystick(event);
                    } else if (button.dataset.action === "jump") {
                        jumpQueued = true;
                    } else if (button.dataset.action === "skill") {
                        skillQueued = true;
                    }
                    if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
                };
                const move = (event) => {
                    if (button.dataset.action === "joystick" && event.pointerId === activePointerId) {
                        event.preventDefault();
                        updateJoystick(event);
                    }
                };
                const release = (event) => {
                    if (activePointerId !== event.pointerId) return;
                    event.preventDefault();
                    button.classList.remove("is-pressed");
                    if (button.dataset.key) keys.delete(button.dataset.key);
                    if (button.dataset.action === "joystick") {
                        keys.delete("ArrowLeft");
                        keys.delete("ArrowRight");
                        keys.delete("ArrowUp");
                        keys.delete("ArrowDown");
                        joystick.style.setProperty("--stick-x", "0px");
                        joystick.style.setProperty("--stick-y", "0px");
                    }
                    activePointerId = null;
                };
                button.addEventListener("pointerdown", press);
                button.addEventListener("pointermove", move);
                button.addEventListener("pointerup", release);
                button.addEventListener("pointercancel", release);
                button.addEventListener("lostpointercapture", release);
            });
            soundToggle.addEventListener("click", () => {
                audioEnabled = !audioEnabled;
                soundToggle.textContent = audioEnabled ? "🔊 音效" : "🔇 靜音";
                soundToggle.setAttribute("aria-label", audioEnabled ? "關閉遊戲音效" : "開啟遊戲音效");
                soundToggle.setAttribute("aria-pressed", String(audioEnabled));
                if (audioEnabled) {
                    startAudioFromGesture();
                }
            });
            restartButton.addEventListener("click", restartLevel);
            nextButton.addEventListener("click", advanceLevel);
            retryButton.addEventListener("click", restartLevel);

            window.addEventListener("resize", resizeCanvas);
            window.addEventListener("orientationchange", () => requestAnimationFrame(resizeCanvas));
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", resizeCanvas);
            }
            new ResizeObserver(resizeCanvas).observe(gameScreen);
            if (window.matchMedia("(pointer: coarse)").matches) {
                requestLandscape();
            }
            resizeCanvas();
            resetActors();
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
