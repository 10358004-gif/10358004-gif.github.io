<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程用計算機 - Casio FX-991ES PLUS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 50%, #0f1419 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 380px;
        }

        .user-name {
            position: absolute;
            top: -35px;
            right: 0;
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .calculator {
            background: #1a1f2e;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05),
                        inset 0 0 0 2px #ffffff,
                        0 0 0 2px rgba(232, 232, 232, 0.35);
            border: 4px solid #e8e8e8;
            position: relative;
            overflow: hidden;
        }

        .calculator::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(100, 200, 255, 0.05) 20%,
                rgba(100, 200, 255, 0.1) 50%,
                rgba(100, 200, 255, 0.05) 80%,
                transparent 100%);
            animation: waveFlow 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes waveFlow {
            0%, 100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }

        .top-section {
            background: transparent;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            position: relative;
            z-index: 1;
        }

        .top-btn {
            padding: 8px 5px;
            font-size: 9px;
            background: #2a2f3e;
            color: #a0a8b8;
            border: 2px solid #e8e8e8;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.4),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .top-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.2), transparent);
            transition: left 0.4s;
        }

        .top-btn:hover {
            background: #3a3f4e;
            color: #c0c8d8;
            border-color: #e8e8e8;
        }

        .top-btn:hover::before {
            left: 100%;
        }

        .top-btn.active {
            background: #2a5a8a;
            color: #fff;
            border-color: #e8e8e8;
        }

        .display-area {
            background: #16191f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2.5px solid #e8e8e8;
            position: relative;
            z-index: 1;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3),
                        inset 0 0 0 1px rgba(232, 232, 232, 0.5);
        }

        .main-display {
            background: #0d0f15;
            color: #64d5ff;
            font-size: 26px;
            padding: 10px;
            border-radius: 6px;
            text-align: right;
            min-height: 38px;
            word-wrap: break-word;
            word-break: break-all;
            border: 2px solid #e8e8e8;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5),
                        inset 0 0 0 1px rgba(232, 232, 232, 0.3);
        }

        .sub-display {
            background: #0d0f15;
            color: #4a9fb5;
            font-size: 11px;
            padding: 5px;
            border-radius: 4px;
            text-align: right;
            height: 18px;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            border: 2px solid #e8e8e8;
            letter-spacing: 0.3px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .main-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 11px 4px;
            font-size: 13px;
            border: 2px solid #e8e8e8;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s ease;
            color: #fff;
            position: relative;
            overflow: hidden;
            background: #2a2f3e;
            box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.5),
                        inset 0 2px 2px rgba(255, 255, 255, 0.1),
                        0 4px 0 rgba(0, 0, 0, 0.5),
                        0 7px 10px rgba(0, 0, 0, 0.45);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: #e8e8e8;
            background: #333844;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: translateY(3px);
            border-color: #e8e8e8;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.5),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1),
                        0 1px 0 rgba(0, 0, 0, 0.4),
                        0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-number {
            background: linear-gradient(135deg, #2a3a4a 0%, #252d38 100%);
            color: #64d5ff;
            text-shadow: 0 0 4px rgba(100, 200, 255, 0.3);
        }

        .btn-number:hover {
            background: linear-gradient(135deg, #3a4a5a 0%, #353d48 100%);
            box-shadow: inset 0 0 8px rgba(100, 200, 255, 0.15);
        }

        .btn-operator {
            background: linear-gradient(135deg, #4a3a2a 0%, #3a322a 100%);
            color: #ffb366;
            text-shadow: 0 0 4px rgba(255, 180, 100, 0.3);
        }

        .btn-operator:hover {
            background: linear-gradient(135deg, #5a4a3a 0%, #4a423a 100%);
            box-shadow: inset 0 0 8px rgba(255, 180, 100, 0.15);
        }

        .btn-function {
            background: linear-gradient(135deg, #2a4a3a 0%, #252d30 100%);
            color: #4affe0;
            font-size: 11px;
            text-shadow: 0 0 4px rgba(74, 255, 224, 0.3);
        }

        .btn-function:hover {
            background: linear-gradient(135deg, #3a5a4a 0%, #353d40 100%);
            box-shadow: inset 0 0 8px rgba(74, 255, 224, 0.15);
        }

        .btn-del {
            background: linear-gradient(135deg, #4a2a2a 0%, #3a2525 100%);
            color: #ff8080;
            font-size: 11px;
            text-shadow: 0 0 4px rgba(255, 128, 128, 0.3);
        }

        .btn-del:hover {
            background: linear-gradient(135deg, #5a3a3a 0%, #4a3535 100%);
            box-shadow: inset 0 0 8px rgba(255, 128, 128, 0.15);
        }

        .btn-equals {
            background: linear-gradient(135deg, #2a5a3a 0%, #252d2a 100%);
            color: #64ff64;
            grid-column: span 2;
            text-shadow: 0 0 4px rgba(100, 255, 100, 0.3);
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #3a6a4a 0%, #353d3a 100%);
            box-shadow: inset 0 0 8px rgba(100, 255, 100, 0.15);
        }

        .title {
            text-align: center;
            color: #a0a8b8;
            font-size: 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-name">張依琳</div>
        
        <div class="calculator">
            <div class="title">工程用計算機</div>

            <div class="top-section">
                <button class="top-btn" onclick="toggleShift()">SHIFT</button>
                <button class="top-btn" onclick="toggleAlpha()">ALPHA</button>
                <button class="top-btn" onclick="toggleMode()">MODE</button>
                <button class="top-btn" onclick="toggleSetup()">SETUP</button>
                <button class="top-btn btn-del" onclick="deleteLastChar()">DEL</button>
            </div>

            <div class="display-area">
                <div class="main-display" id="display">0</div>
                <div class="sub-display" id="subDisplay"></div>
            </div>

            <div class="main-buttons">
                <!-- Row 1 -->
                <button class="btn btn-function" onclick="calculateArcSin()">asin</button>
                <button class="btn btn-function" onclick="calculateArcCos()">acos</button>
                <button class="btn btn-function" onclick="calculateArcTan()">atan</button>
                <button class="btn btn-function" onclick="calculatePI()">π</button>
                <button class="btn btn-del" onclick="clearDisplay()">AC</button>

                <!-- Row 2 -->
                <button class="btn btn-function" onclick="calculateSin()">sin</button>
                <button class="btn btn-function" onclick="calculateCos()">cos</button>
                <button class="btn btn-function" onclick="calculateTan()">tan</button>
                <button class="btn btn-function" onclick="calculateExp()">e^x</button>
                <button class="btn btn-operator" onclick="appendOperator('÷')">÷</button>

                <!-- Row 3 -->
                <button class="btn btn-function" onclick="calculateLog()">log</button>
                <button class="btn btn-function" onclick="calculateLn()">ln</button>
                <button class="btn btn-function" onclick="calculateSqrt()">√</button>
                <button class="btn btn-function" onclick="calculatePower()">x^2</button>
                <button class="btn btn-operator" onclick="appendOperator('×')">×</button>

                <!-- Row 4 -->
                <button class="btn btn-number" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" onclick="appendNumber('9')">9</button>
                <button class="btn btn-function" onclick="calculateReciprocal()">1/x</button>
                <button class="btn btn-operator" onclick="appendOperator('−')">−</button>

                <!-- Row 5 -->
                <button class="btn btn-number" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" onclick="appendNumber('6')">6</button>
                <button class="btn btn-function" onclick="calculateFact()">x!</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

                <!-- Row 6 -->
                <button class="btn btn-number" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" onclick="appendNumber('3')">3</button>
                <button class="btn btn-function" onclick="toggleSign()">+/−</button>
                <button class="btn btn-equals" onclick="calculate()">=</button>

                <!-- Row 7 -->
                <button class="btn btn-number" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" onclick="appendNumber('.')">.</button>
                <button class="btn btn-function" onclick="retrieveAns()">Ans</button>
                <button class="btn btn-operator" style="background: linear-gradient(135deg, #2a3a4a, #1a2a3a); border: 2px solid #e8e8e8;">()</button>
                <button class="btn btn-operator" style="background: linear-gradient(135deg, #2a3a4a, #1a2a3a); border: 2px solid #e8e8e8;">M+</button>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let subDisplay = document.getElementById('subDisplay');
        let currentValue = '0';
        let previousValue = '';
        let operator = '';
        let isDegrees = true;
        let lastAnswer = 0;
        let shiftActive = false;
        let alphaActive = false;

        function updateDisplay() {
            display.textContent = currentValue.length > 16 ? currentValue.substring(0, 16) : currentValue;
        }

        function updateSubDisplay() {
            if (previousValue && operator) {
                subDisplay.textContent = previousValue + ' ' + operator;
            } else {
                subDisplay.textContent = '';
            }
        }

        function clearDisplay() {
            currentValue = '0';
            previousValue = '';
            operator = '';
            updateDisplay();
            updateSubDisplay();
        }

        function deleteLastChar() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay();
        }

        function appendNumber(num) {
            if (currentValue === '0' && num !== '.') {
                currentValue = num;
            } else if (num === '.' && !currentValue.includes('.')) {
                currentValue += num;
            } else if (num !== '.') {
                currentValue += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentValue !== '' && currentValue !== '0') {
                previousValue = currentValue;
                operator = op;
                currentValue = '0';
                updateDisplay();
                updateSubDisplay();
            }
        }

        function calculate() {
            if (previousValue === '' || operator === '') return;
            
            let result;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);

            switch(operator) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current !== 0 ? prev / current : 'Error';
                    break;
                default:
                    return;
            }

            lastAnswer = result;
            currentValue = result.toString();
            operator = '';
            previousValue = '';
            updateDisplay();
            updateSubDisplay();
        }

        function toggleSign() {
            const num = parseFloat(currentValue);
            currentValue = (-num).toString();
            updateDisplay();
        }

        function calculateSin() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.sin(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateCos() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.cos(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateTan() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.tan(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateArcSin() {
            const num = parseFloat(currentValue);
            if (num >= -1 && num <= 1) {
                const result = Math.asin(num);
                lastAnswer = isDegrees ? result * 180 / Math.PI : result;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateArcCos() {
            const num = parseFloat(currentValue);
            if (num >= -1 && num <= 1) {
                const result = Math.acos(num);
                lastAnswer = isDegrees ? result * 180 / Math.PI : result;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateArcTan() {
            const num = parseFloat(currentValue);
            const result = Math.atan(num);
            lastAnswer = isDegrees ? result * 180 / Math.PI : result;
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateSqrt() {
            const num = parseFloat(currentValue);
            if (num >= 0) {
                lastAnswer = Math.sqrt(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateLog() {
            const num = parseFloat(currentValue);
            if (num > 0) {
                lastAnswer = Math.log10(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateLn() {
            const num = parseFloat(currentValue);
            if (num > 0) {
                lastAnswer = Math.log(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculatePower() {
            lastAnswer = Math.pow(parseFloat(currentValue), 2);
            currentValue = lastAnswer.toString();
            updateDisplay();
        }

        function calculateReciprocal() {
            const num = parseFloat(currentValue);
            if (num !== 0) {
                lastAnswer = 1 / num;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateFact() {
            const num = parseInt(currentValue);
            if (num >= 0 && num <= 170) {
                let result = 1;
                for (let i = 2; i <= num; i++) {
                    result *= i;
                }
                lastAnswer = result;
                currentValue = result.toString();
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculatePI() {
            currentValue = Math.PI.toString();
            lastAnswer = Math.PI;
            updateDisplay();
        }

        function calculateExp() {
            const num = parseFloat(currentValue);
            lastAnswer = Math.exp(num);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function retrieveAns() {
            currentValue = lastAnswer.toString();
            updateDisplay();
        }

        function toggleShift() {
            shiftActive = !shiftActive;
            document.querySelector('[onclick="toggleShift()"]').classList.toggle('active');
        }

        function toggleAlpha() {
            alphaActive = !alphaActive;
            document.querySelector('[onclick="toggleAlpha()"]').classList.toggle('active');
        }

        function toggleMode() {
            isDegrees = !isDegrees;
            alert(isDegrees ? '度數模式 (DEG)' : '弧度模式 (RAD)');
        }

        function toggleSetup() {
            alert('設定功能選單');
        }

        // 支援鍵盤輸入
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('−');
            if (e.key === '*') appendOperator('×');
            if (e.key === '/') { e.preventDefault(); appendOperator('÷'); }
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') deleteLastChar();
            if (e.key === 'Escape') clearDisplay();
        });

        updateDisplay();
    </script>
</body>
</html>
