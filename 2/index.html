<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工程用計算機 - Casio FX-991ES PLUS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            animation: bgShimmer 8s ease-in-out infinite;
        }

        @keyframes bgShimmer {
            0%, 100% {
                background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0a0e27 100%);
            }
            50% {
                background: linear-gradient(135deg, #1a1f3a 0%, #2a2f4a 50%, #1a1f3a 100%);
            }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 380px;
            filter: drop-shadow(0 0 20px rgba(100, 200, 255, 0.3));
        }

        .user-name {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #00ccff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5);
        }

        .calculator {
            background: linear-gradient(135deg, #1a1f3a 0%, #2a3f5f 50%, #1a1f3a 100%);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.4),
                        0 0 60px rgba(255, 0, 255, 0.2),
                        0 20px 50px rgba(0, 0, 0, 0.8),
                        inset 0 1px 20px rgba(255, 255, 255, 0.1);
            border: 3px solid;
            border-image: linear-gradient(135deg, #00ccff, #ff00ff, #00ccff) 1;
            position: relative;
            overflow: hidden;
        }

        .calculator::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shimmerAnimation 3s infinite;
            pointer-events: none;
        }

        @keyframes shimmerAnimation {
            0% {
                transform: translate(-100%, -100%) rotate(45deg);
            }
            100% {
                transform: translate(100%, 100%) rotate(45deg);
            }
        }

        .top-section {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2a 50%, #0a0a1a 100%);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            border: 1.5px solid #0088ff;
            box-shadow: 0 0 10px rgba(0, 136, 255, 0.2);
        }

        .top-btn {
            padding: 8px 5px;
            font-size: 10px;
            background: linear-gradient(135deg, #1a2a4a, #0a1a3a);
            color: #88ccff;
            border: 1px solid #0088ff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 2px 8px rgba(0, 136, 255, 0.2);
        }

        .top-btn:hover {
            background: linear-gradient(135deg, #2a3a5a, #1a2a4a);
            color: #00ffff;
            box-shadow: 0 2px 12px rgba(0, 255, 255, 0.3);
        }

        .top-btn.active {
            background: linear-gradient(135deg, #0088ff, #0066dd);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.6);
        }

        .display-area {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2a 50%, #0a0a1a 100%);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 2px solid #0088ff;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3),
                        inset 0 0 10px rgba(0, 136, 255, 0.1);
        }

        .main-display {
            background: linear-gradient(135deg, #001100 0%, #002200 50%, #001100 100%);
            color: #00ff00;
            font-size: 28px;
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            min-height: 40px;
            word-wrap: break-word;
            word-break: break-all;
            border: 2px solid #00ff00;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5),
                        inset 0 0 15px rgba(0, 255, 0, 0.1);
            text-shadow: 0 0 10px #00ff00;
        }

        .sub-display {
            background: linear-gradient(135deg, #001100 0%, #002200 50%, #001100 100%);
            color: #00aa00;
            font-size: 12px;
            padding: 6px;
            border-radius: 6px;
            text-align: right;
            height: 20px;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            border: 1px solid #00aa00;
            box-shadow: 0 0 10px rgba(0, 170, 0, 0.4);
        }

        .main-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(0, 136, 255, 0.05), rgba(255, 0, 255, 0.05));
            border-radius: 10px;
        }

        .btn {
            padding: 12px 5px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(100, 200, 255, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: btnShine 2s infinite;
        }

        @keyframes btnShine {
            0% {
                left: -100%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: 100%;
            }
        }

        .btn:hover {
            transform: scale(1.08) translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 6px 20px rgba(100, 200, 255, 0.6),
                        0 0 20px rgba(255, 0, 255, 0.3);
        }

        .btn:active {
            transform: scale(0.96) translateY(0);
            box-shadow: 0 2px 8px rgba(100, 200, 255, 0.4);
        }

        .btn-number {
            background: linear-gradient(135deg, #1a3a5a, #0a2a4a);
            color: #00ff88;
            border: 1.5px solid #0088ff;
            text-shadow: 0 0 5px #00ff88;
        }

        .btn-number:hover {
            background: linear-gradient(135deg, #2a4a6a, #1a3a5a);
            border-color: #00ffff;
        }

        .btn-operator {
            background: linear-gradient(135deg, #5a3a1a, #4a2a0a);
            color: #ffff00;
            border: 1.5px solid #ff8800;
            text-shadow: 0 0 5px #ffff00;
        }

        .btn-operator:hover {
            background: linear-gradient(135deg, #6a4a2a, #5a3a1a);
            border-color: #ffff00;
        }

        .btn-function {
            background: linear-gradient(135deg, #2a5a1a, #1a4a0a);
            color: #00ff00;
            font-size: 11px;
            border: 1.5px solid #00aa00;
            text-shadow: 0 0 5px #00ff00;
        }

        .btn-function:hover {
            background: linear-gradient(135deg, #3a6a2a, #2a5a1a);
            border-color: #00ffff;
        }

        .btn-del {
            background: linear-gradient(135deg, #5a1a1a, #4a0a0a);
            color: #ff6666;
            border: 1.5px solid #ff4444;
            font-size: 12px;
            text-shadow: 0 0 5px #ff6666;
        }

        .btn-del:hover {
            background: linear-gradient(135deg, #6a2a2a, #5a1a1a);
            border-color: #ff0000;
        }

        .btn-equals {
            background: linear-gradient(135deg, #00aa44, #00aa33);
            color: #fff;
            border: 1.5px solid #00ff88;
            grid-column: span 2;
            text-shadow: 0 0 5px #00ff88;
        }

        .btn-equals:hover {
            background: linear-gradient(135deg, #00cc55, #00bb44);
            border-color: #00ffff;
        }

        .secondary-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .title {
            text-align: center;
            background: linear-gradient(135deg, #00ccff, #ff00ff, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 16px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(100, 200, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-name">張依琳</div>
        
        <div class="calculator">
            <div class="title">工程用計算機</div>

            <div class="top-section">
                <button class="top-btn" onclick="toggleShift()">SHIFT</button>
                <button class="top-btn" onclick="toggleAlpha()">ALPHA</button>
                <button class="top-btn" onclick="toggleMode()">MODE</button>
                <button class="top-btn" onclick="toggleSetup()">SETUP</button>
                <button class="top-btn btn-del" onclick="deleteLastChar()">DEL</button>
            </div>

            <div class="display-area">
                <div class="main-display" id="display">0</div>
                <div class="sub-display" id="subDisplay"></div>
            </div>

            <div class="main-buttons">
                <!-- Row 1 -->
                <button class="btn btn-function" onclick="calculateArcSin()">asin</button>
                <button class="btn btn-function" onclick="calculateArcCos()">acos</button>
                <button class="btn btn-function" onclick="calculateArcTan()">atan</button>
                <button class="btn btn-function" onclick="calculatePI()">π</button>
                <button class="btn btn-del" onclick="clearDisplay()">AC</button>

                <!-- Row 2 -->
                <button class="btn btn-function" onclick="calculateSin()">sin</button>
                <button class="btn btn-function" onclick="calculateCos()">cos</button>
                <button class="btn btn-function" onclick="calculateTan()">tan</button>
                <button class="btn btn-function" onclick="calculateExp()">e^x</button>
                <button class="btn btn-operator" onclick="appendOperator('÷')">÷</button>

                <!-- Row 3 -->
                <button class="btn btn-function" onclick="calculateLog()">log</button>
                <button class="btn btn-function" onclick="calculateLn()">ln</button>
                <button class="btn btn-function" onclick="calculateSqrt()">√</button>
                <button class="btn btn-function" onclick="calculatePower()">x^2</button>
                <button class="btn btn-operator" onclick="appendOperator('×')">×</button>

                <!-- Row 4 -->
                <button class="btn btn-number" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" onclick="appendNumber('9')">9</button>
                <button class="btn btn-function" onclick="calculateReciprocal()">1/x</button>
                <button class="btn btn-operator" onclick="appendOperator('−')">−</button>

                <!-- Row 5 -->
                <button class="btn btn-number" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" onclick="appendNumber('6')">6</button>
                <button class="btn btn-function" onclick="calculateFact()">x!</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

                <!-- Row 6 -->
                <button class="btn btn-number" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" onclick="appendNumber('3')">3</button>
                <button class="btn btn-function" onclick="toggleSign()">+/−</button>
                <button class="btn btn-equals" onclick="calculate()">=</button>

                <!-- Row 7 -->
                <button class="btn btn-number" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" onclick="appendNumber('.')">.</button>
                <button class="btn btn-function" onclick="retrieveAns()">Ans</button>
                <button class="btn btn-operator" style="background: linear-gradient(135deg, #2a3a4a, #1a2a3a); border: 1.5px solid #0088ff;">()</button>
                <button class="btn btn-operator" style="background: linear-gradient(135deg, #2a3a4a, #1a2a3a); border: 1.5px solid #0088ff;">M+</button>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let subDisplay = document.getElementById('subDisplay');
        let currentValue = '0';
        let previousValue = '';
        let operator = '';
        let isDegrees = true;
        let lastAnswer = 0;
        let shiftActive = false;
        let alphaActive = false;

        function updateDisplay() {
            display.textContent = currentValue.length > 16 ? currentValue.substring(0, 16) : currentValue;
        }

        function updateSubDisplay() {
            if (previousValue && operator) {
                subDisplay.textContent = previousValue + ' ' + operator;
            } else {
                subDisplay.textContent = '';
            }
        }

        function clearDisplay() {
            currentValue = '0';
            previousValue = '';
            operator = '';
            updateDisplay();
            updateSubDisplay();
        }

        function deleteLastChar() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
            updateDisplay();
        }

        function appendNumber(num) {
            if (currentValue === '0' && num !== '.') {
                currentValue = num;
            } else if (num === '.' && !currentValue.includes('.')) {
                currentValue += num;
            } else if (num !== '.') {
                currentValue += num;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentValue !== '' && currentValue !== '0') {
                previousValue = currentValue;
                operator = op;
                currentValue = '0';
                updateDisplay();
                updateSubDisplay();
            }
        }

        function calculate() {
            if (previousValue === '' || operator === '') return;
            
            let result;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);

            switch(operator) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current !== 0 ? prev / current : 'Error';
                    break;
                default:
                    return;
            }

            lastAnswer = result;
            currentValue = result.toString();
            operator = '';
            previousValue = '';
            updateDisplay();
            updateSubDisplay();
        }

        function toggleSign() {
            const num = parseFloat(currentValue);
            currentValue = (-num).toString();
            updateDisplay();
        }

        function calculateSin() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.sin(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateCos() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.cos(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateTan() {
            const num = parseFloat(currentValue);
            const angle = isDegrees ? num * Math.PI / 180 : num;
            lastAnswer = Math.tan(angle);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateArcSin() {
            const num = parseFloat(currentValue);
            if (num >= -1 && num <= 1) {
                const result = Math.asin(num);
                lastAnswer = isDegrees ? result * 180 / Math.PI : result;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateArcCos() {
            const num = parseFloat(currentValue);
            if (num >= -1 && num <= 1) {
                const result = Math.acos(num);
                lastAnswer = isDegrees ? result * 180 / Math.PI : result;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateArcTan() {
            const num = parseFloat(currentValue);
            const result = Math.atan(num);
            lastAnswer = isDegrees ? result * 180 / Math.PI : result;
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function calculateSqrt() {
            const num = parseFloat(currentValue);
            if (num >= 0) {
                lastAnswer = Math.sqrt(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateLog() {
            const num = parseFloat(currentValue);
            if (num > 0) {
                lastAnswer = Math.log10(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateLn() {
            const num = parseFloat(currentValue);
            if (num > 0) {
                lastAnswer = Math.log(num);
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculatePower() {
            lastAnswer = Math.pow(parseFloat(currentValue), 2);
            currentValue = lastAnswer.toString();
            updateDisplay();
        }

        function calculateReciprocal() {
            const num = parseFloat(currentValue);
            if (num !== 0) {
                lastAnswer = 1 / num;
                currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculateFact() {
            const num = parseInt(currentValue);
            if (num >= 0 && num <= 170) {
                let result = 1;
                for (let i = 2; i <= num; i++) {
                    result *= i;
                }
                lastAnswer = result;
                currentValue = result.toString();
            } else {
                currentValue = 'Error';
            }
            updateDisplay();
        }

        function calculatePI() {
            currentValue = Math.PI.toString();
            lastAnswer = Math.PI;
            updateDisplay();
        }

        function calculateExp() {
            const num = parseFloat(currentValue);
            lastAnswer = Math.exp(num);
            currentValue = lastAnswer.toFixed(10).replace(/\.?0+$/, '');
            updateDisplay();
        }

        function retrieveAns() {
            currentValue = lastAnswer.toString();
            updateDisplay();
        }

        function toggleShift() {
            shiftActive = !shiftActive;
            document.querySelector('[onclick="toggleShift()"]').classList.toggle('active');
        }

        function toggleAlpha() {
            alphaActive = !alphaActive;
            document.querySelector('[onclick="toggleAlpha()"]').classList.toggle('active');
        }

        function toggleMode() {
            isDegrees = !isDegrees;
            alert(isDegrees ? '度數模式 (DEG)' : '弧度模式 (RAD)');
        }

        function toggleSetup() {
            alert('設定功能選單');
        }

        // 支援鍵盤輸入
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('−');
            if (e.key === '*') appendOperator('×');
            if (e.key === '/') { e.preventDefault(); appendOperator('÷'); }
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') deleteLastChar();
            if (e.key === 'Escape') clearDisplay();
        });

        updateDisplay();
    </script>
</body>
</html>
