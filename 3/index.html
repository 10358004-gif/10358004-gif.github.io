<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文單字測驗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: white;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
        }

        .container {
            max-width: 800px;
            margin: 60px auto 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .title h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .score-info {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .question-container {
            display: none;
            animation: slideIn 0.3s ease-in;
        }

        .question-container.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress {
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        .question-number {
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .option:hover {
            border-color: #667eea;
            background: #f5f5f5;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-submit {
            background: #4caf50;
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-submit:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .results {
            display: none;
            text-align: center;
            animation: slideIn 0.3s ease-in;
        }

        .results.show {
            display: block;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .score-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }

        .result-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            margin-top: 20px;
        }

        .result-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .answer-review {
            margin-top: 30px;
            text-align: left;
        }

        .answer-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            border-radius: 3px;
        }

        .answer-item.correct {
            border-left-color: #4caf50;
        }

        .answer-item.incorrect {
            border-left-color: #f44336;
        }

        .answer-item-question {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .answer-item-details {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="header">張依琳</div>

    <div class="container">
        <div class="title">
            <h1>📚 英文單字測驗</h1>
            <div class="score-info">20 題選擇題，共 100 分</div>
        </div>

        <div class="content">
            <!-- 測驗部分 -->
            <div id="quiz-section">
                <div class="progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text">
                        第 <span id="currentQuestion">1</span> / 20 題
                    </div>
                </div>

                <form id="quizForm">
                    <div id="questionsContainer"></div>

                    <div class="buttons">
                        <button type="button" class="btn-next" id="prevBtn" style="display:none;">← 上一題</button>
                        <button type="button" class="btn-next" id="nextBtn">下一題 →</button>
                        <button type="submit" class="btn-submit" id="submitBtn" style="display:none;">提交答卷</button>
                    </div>
                </form>
            </div>

            <!-- 結果部分 -->
            <div id="results-section" class="results"></div>
        </div>
    </div>

    <script>
        // 題庫資料 - 根據 Google Sheets 題庫整理
        const quizData = [
            {
                question: "What does 'ability' mean?",
                options: ["Disability", "Power or skill to do something", "Weakness", "Uncertainty"],
                correct: 1,
                translation: "能力"
            },
            {
                question: "Which word means 'to receive and agree to something'?",
                options: ["Reject", "Accept", "Ignore", "Refuse"],
                correct: 1,
                translation: "接受"
            },
            {
                question: "What does 'accident' refer to?",
                options: ["Planned event", "Unexpected event causing damage", "Celebration", "Meeting"],
                correct: 1,
                translation: "事故"
            },
            {
                question: "'Achieve' means to ___?",
                options: ["Fail", "Succeed in reaching a goal", "Avoid", "Forget"],
                correct: 1,
                translation: "達成"
            },
            {
                question: "What is an 'activity'?",
                options: ["Laziness", "An action or task that you do", "Sleep", "Boredom"],
                correct: 1,
                translation: "活動"
            },
            {
                question: "The word 'actually' means ___?",
                options: ["Maybe", "In reality or in fact", "Supposedly", "Probably not"],
                correct: 1,
                translation: "實際上"
            },
            {
                question: "What does 'advice' mean?",
                options: ["A warning", "Suggestions or recommendations", "A rule", "A joke"],
                correct: 1,
                translation: "建議"
            },
            {
                question: "'Afford' in the sentence 'I cannot afford this phone' means ___?",
                options: ["To like", "To dislike", "To have enough money for", "To want"],
                correct: 2,
                translation: "負擔得起"
            },
            {
                question: "To 'agree' with someone means to ___?",
                options: ["Argue with them", "Have the same opinion", "Ignore them", "Forget them"],
                correct: 1,
                translation: "同意"
            },
            {
                question: "What does 'allow' mean?",
                options: ["To stop", "To permit or let something happen", "To refuse", "To prevent"],
                correct: 1,
                translation: "允許"
            },
            {
                question: "'Amazing' describes something that is ___?",
                options: ["Boring", "Ordinary", "Surprising and wonderful", "Average"],
                correct: 2,
                translation: "令人驚奇的"
            },
            {
                question: "To 'announce' means to ___?",
                options: ["Keep secret", "Make something known publicly", "Hide", "Forget"],
                correct: 1,
                translation: "宣布"
            },
            {
                question: "What does 'appear' mean?",
                options: ["To disappear", "To become visible", "To hide", "To think"],
                correct: 1,
                translation: "出現"
            },
            {
                question: "To 'apply' for something means to ___?",
                options: ["To use it", "To request it formally", "To reject it", "To ignore it"],
                correct: 1,
                translation: "申請"
            },
            {
                question: "An 'appointment' is a ___?",
                options: ["Surprise gift", "Arranged time to meet", "Decoration", "Punishment"],
                correct: 1,
                translation: "約會；預約"
            },
            {
                question: "To 'arrange' something means to ___?",
                options: ["Break it", "To organize and plan it", "To forget it", "To sell it"],
                correct: 1,
                translation: "安排"
            },
            {
                question: "'Attend' means to ___?",
                options: ["To ignore", "To be present at", "To cancel", "To avoid"],
                correct: 1,
                translation: "參加"
            },
            {
                question: "What does 'attention' mean?",
                options: ["Ignorance", "Interest and focus", "Distraction", "Sleep"],
                correct: 1,
                translation: "注意"
            },
            {
                question: "Something that is 'available' is ___?",
                options: ["Broken", "Unavailable", "Able to be used or obtained", "Lost"],
                correct: 2,
                translation: "可取得的；有空的"
            },
            {
                question: "'Average' means ___?",
                options: ["Excellent", "Terrible", "Typical or mean value", "Unique"],
                correct: 2,
                translation: "平均的"
            }
        ];

        let currentQuestionIndex = 0;
        const userAnswers = new Array(quizData.length).fill(null);

        // 隨機打亂陣列
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 隨機打亂題目和選項
        function randomizeQuiz() {
            // 隨機打亂題目順序
            const shuffledIndices = shuffleArray(Array.from({length: quizData.length}, (_, i) => i));
            const randomizedQuizData = shuffledIndices.map(i => quizData[i]);
            
            // 隨機打亂每個題目的選項順序
            randomizedQuizData.forEach(question => {
                const optionsWithIndex = question.options.map((option, index) => ({
                    option,
                    originalIndex: index
                }));
                
                const shuffledOptions = shuffleArray(optionsWithIndex);
                
                // 找到正確答案的新位置
                const newCorrectIndex = shuffledOptions.findIndex(
                    item => item.originalIndex === question.correct
                );
                
                question.options = shuffledOptions.map(item => item.option);
                question.correct = newCorrectIndex;
            });
            
            return randomizedQuizData;
        }

        // 初始化測驗
        function initQuiz() {
            // 隨機打亂題目和選項
            const randomizedData = randomizeQuiz();
            quizData.length = 0;
            quizData.push(...randomizedData);
            
            renderQuestion();
            setupEventListeners();
        }

        // 渲染當前問題
        function renderQuestion() {
            const container = document.getElementById('questionsContainer');
            const data = quizData[currentQuestionIndex];
            
            let html = `
                <div class="question-container active">
                    <div class="question-number">第 ${currentQuestionIndex + 1} 題 (${data.translation})</div>
                    <div class="question-text">${data.question}</div>
                    <div class="options">
            `;

            data.options.forEach((option, index) => {
                const isSelected = userAnswers[currentQuestionIndex] === index;
                html += `
                    <div class="option ${isSelected ? 'selected' : ''}">
                        <label>
                            <input type="radio" name="answer" value="${index}" 
                                   ${isSelected ? 'checked' : ''}
                                   onchange="selectAnswer(${index})">
                            <span>${String.fromCharCode(65 + index)}. ${option}</span>
                        </label>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;

            updateProgress();
            updateButtons();
        }

        // 選擇答案
        function selectAnswer(index) {
            userAnswers[currentQuestionIndex] = index;
        }

        // 更新進度條
        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
        }

        // 更新按鈕
        function updateButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const submitBtn = document.getElementById('submitBtn');

            prevBtn.style.display = currentQuestionIndex > 0 ? 'block' : 'none';
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }

        // 設置事件監聽
        function setupEventListeners() {
            document.getElementById('prevBtn').onclick = () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    renderQuestion();
                }
            };

            document.getElementById('nextBtn').onclick = () => {
                if (currentQuestionIndex < quizData.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion();
                }
            };

            document.getElementById('quizForm').onsubmit = (e) => {
                e.preventDefault();
                submitQuiz();
            };
        }

        // 提交測驗
        function submitQuiz() {
            let score = 0;
            userAnswers.forEach((answer, index) => {
                if (answer === quizData[index].correct) {
                    score += 5; // 每題 5 分
                }
            });

            showResults(score);
        }

        // 顯示結果
        function showResults(score) {
            document.getElementById('quiz-section').style.display = 'none';
            const resultsSection = document.getElementById('results-section');
            resultsSection.classList.add('show');

            let message = '';
            if (score === 100) {
                message = '🎉 完美滿分！你是英文高手！';
            } else if (score >= 80) {
                message = '🌟 非常出色！';
            } else if (score >= 60) {
                message = '👍 不錯！繼續加油！';
            } else {
                message = '📚 需要加強練習！';
            }

            let reviewHtml = '<div class="answer-review"><h3 style="margin-bottom:15px;">答題檢視</h3>';
            userAnswers.forEach((answer, index) => {
                const isCorrect = answer === quizData[index].correct;
                const className = isCorrect ? 'correct' : 'incorrect';
                const status = isCorrect ? '✓ 正確' : '✗ 錯誤';
                const userAnswer = answer !== null ? quizData[index].options[answer] : '未作答';
                const correctAnswer = quizData[index].options[quizData[index].correct];

                reviewHtml += `
                    <div class="answer-item ${className}">
                        <div class="answer-item-question">${status} 第 ${index + 1} 題 (${quizData[index].translation})</div>
                        <div class="answer-item-details">
                            <div>題目: ${quizData[index].question}</div>
                            <div>你的答案: ${userAnswer}</div>
                            ${!isCorrect ? `<div style="color:#4caf50;">正確答案: ${correctAnswer}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            reviewHtml += '</div>';

            resultsSection.innerHTML = `
                <div style="text-align:center;">
                    <h2 style="margin-top:30px;color:#333;">測驗完成！</h2>
                    <div class="score-display">${score} / 100</div>
                    <div class="score-message">${message}</div>
                </div>
                ${reviewHtml}
                <div style="text-align:center;margin-top:30px;">
                    <button class="result-button" onclick="location.reload();">重新測驗</button>
                </div>
            `;
        }

        // 頁面加載時初始化
        window.onload = initQuiz;
    </script>
</body>
</html>
