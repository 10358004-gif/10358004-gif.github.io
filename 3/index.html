<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>英文單字測驗</title>
  <style>
    :root{color-scheme:light;--ink:#172b36;--muted:#61737b;--paper:#f6f5ef;--line:#d9dfd9;--green:#175b4a;--orange:#cf653e}
    *{box-sizing:border-box}
    body{font-family:Georgia,"Noto Serif TC",serif;max-width:900px;margin:0 auto;padding:32px 20px 56px;background:var(--paper);color:var(--ink)}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:0 0 24px;border-bottom:2px solid var(--ink)}
    h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.4rem)}
    header p{margin:0;color:var(--muted);font-family:Arial,sans-serif}
    #owner{font-weight:700;white-space:nowrap;border-top:3px solid var(--orange);padding-top:8px}
    .controls{margin:22px 0;padding:18px 0;border-bottom:1px solid var(--line);font-family:Arial,sans-serif}
    .controls-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    select,button{min-height:42px;padding:0 14px;font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink)}
    button{background:var(--green);border-color:var(--green);color:#fff;font-weight:700;cursor:pointer}
    button:disabled{background:#a5b0aa;border-color:#a5b0aa;cursor:not-allowed}
    #timer{margin-left:auto;font:700 1.25rem Arial,sans-serif;color:var(--orange);font-variant-numeric:tabular-nums}
    #status{margin:12px 0 0;color:var(--muted);font-size:.9rem}
    .question{padding:20px 0;border-bottom:1px solid var(--line)}
    .question-type{display:inline-block;margin-bottom:9px;color:var(--green);font:700 .78rem Arial,sans-serif;text-transform:uppercase}
    .question-prompt{font-size:1.1rem;line-height:1.6}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-top:12px;font-family:Arial,sans-serif}
    .choices label{display:flex;align-items:center;gap:8px;cursor:pointer}
    .fill-input{width:min(100%,360px);min-height:42px;margin-top:12px;padding:8px 10px;border:1px solid #aab6af;background:#fff;font:1rem Arial,sans-serif}
    .result{margin-top:26px;padding:20px 0;border-top:3px solid var(--green)}
    .result h2{margin:0 0 8px}
    .review-item{padding:10px 0;border-bottom:1px solid var(--line);line-height:1.6}
    @media(max-width:560px){body{padding:22px 16px 40px}.choices{grid-template-columns:1fr}#timer{width:100%;margin:4px 0 0}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>英文單字測驗</h1>
      <p>選擇題、填充題、英翻中 · 共 20 題 · 100 分 · 限時 10 分鐘</p>
    </div>
    <div id="owner">張依琳</div>
  </header>

  <div class="controls">
    <div>
      <label>選擇難度：
        <select id="level">
          <option value="all">全部難度</option>
          <option value="初級">初級</option>
          <option value="中級">中級</option>
          <option value="高級">高級</option>
        </select>
      </label>
      <button id="startBtn" disabled>開始測驗</button>
      <button id="submitBtn" disabled>繳交答案</button>
      <span id="timer" aria-live="polite">10:00</span>
    </div>
    <p id="status" role="status">正在載入試算表單字…</p>
  </div>

  <main id="quiz"></main>

  <div id="result" class="result" style="display:none"></div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1fXQbM-9gAE_KGmzl11YqkTzTP0qa8nVuLI8xLjmJyJw/export?format=csv&gid=71115281';
    const TIME_SECONDS = 10*60;
    const TOTAL_POINTS = 100;
    const QUESTION_COUNT = 20;
    const POINTS_PER_QUESTION = TOTAL_POINTS / QUESTION_COUNT;

    let allQuestions = [];
    let currentQuestions = [];
    let timerId = null;
    let remaining = TIME_SECONDS;
    let userAnswers = {};

    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      for(let i=0;i<text.length;i++){
        const ch = text[i];
        if(inQuotes){
          if(ch === '"'){
            if(text[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
          } else { cur += ch; }
        } else {
          if(ch === '"'){ inQuotes = true; }
          else if(ch === ','){ row.push(cur); cur=''; }
          else if(ch === '\r'){ continue; }
          else if(ch === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
          else { cur += ch; }
        }
      }
      if(cur !== '' || row.length) row.push(cur);
      if(row.length) rows.push(row);
      return rows;
    }

    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

    function normalizeHeader(value){ return value.replace(/^\uFEFF/,'').trim().toLowerCase(); }

    function prepareVocabulary(rows){
      if(rows.length < 2) return [];
      const headers = rows[0].map(normalizeHeader);
      const findColumn = names => headers.findIndex(header=>names.includes(header));
      const englishColumn = findColumn(['english','英文','word','單字','英文字']);
      const chineseColumn = findColumn(['chinese','中文','meaning','translation','翻譯','中文意思']);
      const levelColumn = findColumn(['difficulty','level','等級','難度']);
      const wordColumn = englishColumn >= 0 ? englishColumn : 0;
      const meaningColumn = chineseColumn >= 0 ? chineseColumn : 1;
      const dataRows = rows.slice(1).filter(row=>row[wordColumn] && row[meaningColumn]);

      return dataRows.map((row,index)=>{
        let difficulty = levelColumn >= 0 ? row[levelColumn].trim() : '';
        if(!difficulty){
          const tier = Math.min(2,Math.floor(index * 3 / dataRows.length));
          difficulty = ['初級','中級','高級'][tier];
        } else if(/beginner|basic|easy|初級/i.test(difficulty)){ difficulty = '初級'; }
        else if(/intermediate|中級/i.test(difficulty)){ difficulty = '中級'; }
        else if(/advanced|高級/i.test(difficulty)){ difficulty = '高級'; }

        return { word:row[wordColumn].trim().replace(/^\d+[.)、]\s*/,''), meaning:row[meaningColumn].trim(), difficulty };
      });
    }

    function buildExam(vocabulary){
      const selected = vocabulary.slice();
      shuffle(selected);
      return selected.slice(0,QUESTION_COUNT).map((entry,index)=>{
        const type = index < 8 ? 'multiple' : index < 14 ? 'fill' : 'translate';
        const question = {...entry,type};
        if(type === 'multiple'){
          const distractors = vocabulary.filter(item=>item.word !== entry.word && item.meaning !== entry.meaning);
          shuffle(distractors);
          question.choices = [entry.meaning,...distractors.slice(0,3).map(item=>item.meaning)];
          shuffle(question.choices);
        }
        return question;
      });
    }

    function renderQuestions(){
      const container = document.getElementById('quiz'); container.innerHTML='';
      currentQuestions.forEach((q,i)=>{
        const div = document.createElement('div'); div.className='question';
        
        const typeLabel = document.createElement('div');
        typeLabel.className='question-type';
        if(q.type==='multiple') typeLabel.textContent='選擇題';
        else if(q.type==='fill') typeLabel.textContent='填充題';
        else typeLabel.textContent='英翻中';
        div.appendChild(typeLabel);
        
        const qDiv = document.createElement('div');
        qDiv.className='question-prompt';
        qDiv.textContent = `第 ${i+1} 題（${POINTS_PER_QUESTION} 分）：${q.type === 'fill' ? `請寫出「${q.meaning}」的英文單字` : q.type === 'translate' ? `請將「${q.word}」翻譯成中文` : `請選出「${q.word}」的中文意思`}`;
        div.appendChild(qDiv);
        
        if(q.type === 'multiple'){
          const choicesDiv = document.createElement('div'); choicesDiv.className='choices';
          q.choices.forEach((c,ci)=>{
            const lab = document.createElement('label');
            const input = document.createElement('input');
            input.type='radio'; input.name=`q${i}`; input.value=c; input.checked=userAnswers[i]===c;
            input.addEventListener('change',()=>{ userAnswers[i]=c; });
            lab.append(input,document.createTextNode(` ${String.fromCharCode(65+ci)}. ${c}`));
            choicesDiv.appendChild(lab);
          });
          div.appendChild(choicesDiv);
        } else if(q.type === 'fill'){
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'fill-input';
          input.id = `q${i}_fill`;
          input.value = userAnswers[i] || '';
          input.placeholder = '請填入英文單字';
          input.addEventListener('input',()=>{ userAnswers[i] = input.value; });
          div.appendChild(input);
        } else if(q.type === 'translate'){
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'fill-input';
          input.id = `q${i}_translate`;
          input.value = userAnswers[i] || '';
          input.placeholder = '請填入中文意思';
          input.addEventListener('input',()=>{ userAnswers[i] = input.value; });
          div.appendChild(input);
        }
        
        container.appendChild(div);
      });
    }

    function startTimer(){
      remaining = TIME_SECONDS; 
      document.getElementById('submitBtn').disabled=false;
      document.getElementById('startBtn').disabled=true;
      document.getElementById('level').disabled=true;
      document.getElementById('status').textContent='作答中';
      updateTimerDisplay();
      timerId = setInterval(()=>{
        remaining--; updateTimerDisplay(); if(remaining<=0){ clearInterval(timerId); doSubmit(); }
      },1000);
    }

    function updateTimerDisplay(){
      const m = Math.floor(remaining/60); const s = remaining%60; 
      document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function doSubmit(){
      if(timerId) clearInterval(timerId);
      document.getElementById('submitBtn').disabled=true;
      document.getElementById('status').textContent='測驗已繳交';
      document.querySelectorAll('#quiz input').forEach(input=>{ input.disabled=true; });
      
      let score = 0;
      const result = document.getElementById('result');
      result.replaceChildren();
      
      for(let i=0;i<currentQuestions.length;i++){
        const q = currentQuestions[i];
        const userAns = userAnswers[i] || '';
        const expected = q.type === 'fill' ? q.word : q.meaning;
        
        const normalizeAnswer = value=>value.trim().toLowerCase().replace(/\s+/g,'');
        const accepted = [normalizeAnswer(expected),...expected.split(/[、，,；;\/]/).map(normalizeAnswer)];
        const isCorrect = accepted.includes(normalizeAnswer(userAns));
        if(isCorrect) score += POINTS_PER_QUESTION;

        const detail = document.createElement('p');
        detail.className='review-item';
        detail.textContent=`${isCorrect ? '✓' : '✗'} 第 ${i+1} 題　你的答案：${userAns || '未作答'}　正確答案：${expected}`;
        result.appendChild(detail);
      }
      
      const heading = document.createElement('h2');
      heading.textContent=`測驗結果：${score} / ${TOTAL_POINTS} 分`;
      result.prepend(heading);
      result.style.display='block';
    }

    document.getElementById('startBtn').addEventListener('click',()=>{
      const level = document.getElementById('level').value;
      let pool = allQuestions.slice();
      if(level !== 'all') pool = pool.filter(q=>q.difficulty === level);
      
      if(pool.length < QUESTION_COUNT){ alert(`此難度目前只有 ${pool.length} 個單字，至少需要 ${QUESTION_COUNT} 個才能開始測驗。`); return; }

      currentQuestions = buildExam(pool);
      userAnswers = {};
      renderQuestions();
      startTimer();
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{ if(confirm('確定要繳交嗎？')) doSubmit(); });

    fetch(CSV_URL).then(r=>{
      if(!r.ok) throw new Error('無法存取試算表');
      return r.text();
    }).then(text=>{
      const rows = parseCSV(text);
      allQuestions = prepareVocabulary(rows);
      if(allQuestions.length < QUESTION_COUNT) throw new Error('試算表至少需要 20 組英文與中文單字');
      document.getElementById('startBtn').disabled=false;
      document.getElementById('status').textContent=`已載入 ${allQuestions.length} 個單字`;
    }).catch(err=>{
      console.error(err);
      const main = document.getElementById('quiz');
      document.getElementById('status').textContent='無法載入試算表，請確認分享權限已設為「知道連結的任何人都可以檢視」。';
      main.replaceChildren();
    });
  </script>
</body>
</html>
