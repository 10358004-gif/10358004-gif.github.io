<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>英文單字測驗</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#222}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    h1{margin:0 0 8px 0;font-size:1.5rem}
    #owner{font-weight:700;font-size:1.1rem}
    .controls{margin:16px 0;padding:12px;background:#f0f0f0;border-radius:4px}
    .question{border-bottom:1px solid #ddd;padding:16px 0;margin:12px 0}
    .question-type{background:#e8f4f8;padding:4px 8px;display:inline-block;border-radius:3px;font-size:0.9rem;margin-bottom:8px}
    .choices label{display:block;margin:8px 0;cursor:pointer}
    .fill-input{border:1px solid #999;padding:6px;width:200px}
    #timer{font-size:1.2rem;font-weight:700;color:#d00;margin-left:20px}
    button{padding:8px 16px;margin-right:8px;cursor:pointer;background:#007;color:#fff;border:none;border-radius:3px}
    button:disabled{background:#ccc}
    .result{margin-top:20px;padding:16px;border:2px solid #007;background:#e8f4ff;border-radius:4px}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>英文單字測驗</h1>
      <div>選擇題、填充題、中翻英 — 共 100 分 — 時間限制 20 分鐘</div>
    </div>
    <div id="owner">張依琳</div>
  </header>

  <div class="controls">
    <div>
      <label>選擇難度：
        <select id="level">
          <option value="all">全部（預設）</option>
          <option value="初級">初級</option>
          <option value="中級">中級</option>
          <option value="高級">高級</option>
        </select>
      </label>
      <button id="startBtn">開始測驗</button>
      <button id="submitBtn" disabled>繳交</button>
      <span id="timer">20:00</span>
    </div>
  </div>

  <main id="quiz"></main>

  <div id="result" class="result" style="display:none"></div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1fXQbM-9gAE_KGmzl11YqkTzTP0qa8nVuLI8xLjmJyJw/export?format=csv&gid=71115281';
    const TIME_SECONDS = 20*60;
    const TOTAL_POINTS = 100;

    let allQuestions = [];
    let currentQuestions = [];
    let timerId = null;
    let remaining = TIME_SECONDS;
    let userAnswers = {};

    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;
      for(let i=0;i<text.length;i++){
        const ch = text[i];
        if(inQuotes){
          if(ch === '"'){
            if(text[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
          } else { cur += ch; }
        } else {
          if(ch === '"'){ inQuotes = true; }
          else if(ch === ','){ row.push(cur); cur=''; }
          else if(ch === '\r'){ continue; }
          else if(ch === '\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
          else { cur += ch; }
        }
      }
      if(cur !== '' || row.length) row.push(cur);
      if(row.length) rows.push(row);
      return rows;
    }

    function rowsToObjects(rows){
      if(!rows.length) return [];
      const header = rows[0].map(h=>h.trim().toLowerCase());
      const objs = [];
      for(let i=1;i<rows.length;i++){
        const r = rows[i]; if(r.every(c=>c==='') ) continue;
        const obj = {};
        for(let j=0;j<header.length;j++) obj[header[j]] = (r[j]||'').trim();
        objs.push(obj);
      }
      return objs;
    }

    function normalizeChoiceFields(obj){
      const choices = [];
      const tryKeys = ['a','b','c','d','e','choice1','choice2','choice3','choice4','choice5','option1','option2','option3','option4','option5'];
      for(const k of tryKeys){ if(obj[k]) choices.push(obj[k]); if(choices.length===5) break; }
      return choices.filter(s=>s&&s.length);
    }

    function prepareQuestions(objs){
      return objs.map((o,idx)=>{
        const q_text = o['question'] || o['word'] || o['prompt'] || o['題目'] || '';
        const q_type = (o['type'] || o['題型'] || 'multiple choice').trim().toLowerCase();
        const choices = normalizeChoiceFields(o);
        const answer = (o['answer']||o['ans']||o['correct']||'').trim();
        const chinese = (o['chinese'] || o['中文'] || '').trim();
        const difficulty = (o['difficulty']||o['level']||o['等級']||'').trim() || '初級';
        
        let type = 'multiple';
        if(q_type.includes('fill') || q_type.includes('blank')) type = 'fill';
        else if(q_type.includes('chinese') || q_type.includes('中文') || q_type.includes('翻譯')) type = 'chinese';
        
        return {
          id: idx, 
          question: q_text, 
          type, 
          choices, 
          answer,
          chinese,
          difficulty
        };
      }).filter(x=>x.question && (x.type!=='multiple' || x.choices.length>=2));
    }

    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} }

    function renderQuestions(){
      const container = document.getElementById('quiz'); container.innerHTML='';
      currentQuestions.forEach((q,i)=>{
        const div = document.createElement('div'); div.className='question';
        
        const typeLabel = document.createElement('div');
        typeLabel.className='question-type';
        if(q.type==='multiple') typeLabel.textContent='選擇題';
        else if(q.type==='fill') typeLabel.textContent='填充題';
        else typeLabel.textContent='中翻英';
        div.appendChild(typeLabel);
        
        const qDiv = document.createElement('div');
        qDiv.innerHTML = `<strong>第 ${i+1} 題 (${getQPoints(q)}分)</strong>： ${q.question}`;
        div.appendChild(qDiv);
        
        if(q.type === 'multiple'){
          const choicesDiv = document.createElement('div'); choicesDiv.className='choices';
          q.choices.forEach((c,ci)=>{
            const id = `q${i}_c${ci}`;
            const lab = document.createElement('label');
            const checked = userAnswers[i] === c ? 'checked' : '';
            lab.innerHTML = `<input type="radio" name="q${i}" value="${c}" id="${id}" ${checked}> ${String.fromCharCode(65+ci)}. ${c}`;
            choicesDiv.appendChild(lab);
          });
          div.appendChild(choicesDiv);
        } else if(q.type === 'fill'){
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'fill-input';
          input.id = `q${i}_fill`;
          input.value = userAnswers[i] || '';
          input.placeholder = '請填入答案';
          input.onchange = ()=>{ userAnswers[i] = input.value; };
          div.appendChild(input);
        } else if(q.type === 'chinese'){
          const p = document.createElement('p');
          p.textContent = `中文意思：${q.chinese}`;
          div.appendChild(p);
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'fill-input';
          input.id = `q${i}_chinese`;
          input.value = userAnswers[i] || '';
          input.placeholder = '請填入英文';
          input.onchange = ()=>{ userAnswers[i] = input.value; };
          div.appendChild(input);
        }
        
        container.appendChild(div);
      });
    }

    function getQPoints(q){
      if(q.type==='multiple') return 25;
      else if(q.type==='fill') return 25;
      else return 50;
    }

    function startTimer(){
      remaining = TIME_SECONDS; 
      document.getElementById('submitBtn').disabled=false;
      document.getElementById('startBtn').disabled=true;
      updateTimerDisplay();
      timerId = setInterval(()=>{
        remaining--; updateTimerDisplay(); if(remaining<=0){ clearInterval(timerId); doSubmit(); }
      },1000);
    }

    function updateTimerDisplay(){
      const m = Math.floor(remaining/60); const s = remaining%60; 
      document.getElementById('timer').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function doSubmit(){
      if(timerId) clearInterval(timerId);
      document.getElementById('submitBtn').disabled=true;
      
      let score = 0;
      const details = [];
      
      for(let i=0;i<currentQuestions.length;i++){
        const q = currentQuestions[i];
        const userAns = userAnswers[i] || '';
        const points = getQPoints(q);
        const expected = q.answer || q.chinese || (q.choices && q.choices[0]) || '';
        
        const isCorrect = userAns.trim().toLowerCase() === expected.trim().toLowerCase();
        if(isCorrect) score += points;
        
        const status = isCorrect ? '<span style="color:green">✓</span>' : '<span style="color:red">✗</span>';
        details.push(`題 ${i+1}: ${status} 你的答案：「${userAns}」 正確答案：「${expected}」`);
      }
      
      const div = document.getElementById('result');
      div.style.display='block';
      div.innerHTML = `<strong>最終成績：${score} / ${TOTAL_POINTS}</strong><br><br>`;
      details.forEach(d=>{ div.innerHTML += d + '<br>'; });
    }

    document.getElementById('startBtn').addEventListener('click',()=>{
      const level = document.getElementById('level').value;
      let pool = allQuestions.slice();
      if(level !== 'all') pool = pool.filter(q=> q.difficulty.indexOf(level)!==-1 );
      
      if(pool.length === 0){ alert('試算表無題目或篩選後無題目，請檢查試算表或難度選擇'); return; }
      
      shuffle(pool);
      currentQuestions = pool;
      userAnswers = {};
      renderQuestions();
      startTimer();
    });

    document.getElementById('submitBtn').addEventListener('click', ()=>{ if(confirm('確定要繳交嗎？')) doSubmit(); });

    fetch(CSV_URL).then(r=>{
      if(!r.ok) throw new Error('無法存取試算表');
      return r.text();
    }).then(text=>{
      const rows = parseCSV(text);
      const objs = rowsToObjects(rows);
      allQuestions = prepareQuestions(objs);
      console.log('載入題數：', allQuestions.length);
    }).catch(err=>{
      console.error(err);
      const main = document.getElementById('quiz');
      main.innerHTML = '<p style="color:#a00">無法自動載入試算表內容。請確認該試算表已「公開」或分享權限改為「任何有連結的人可檢視」。</p>';
    });
  </script>
</body>
</html>
