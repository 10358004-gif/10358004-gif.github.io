<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .player-name {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            z-index: 100;
        }

        .game-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            text-align: center;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .game-board {
            background: linear-gradient(135deg, #90c240 0%, #7ab33f 100%);
            border-radius: 15px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        inset 0 2px 5px rgba(255, 255, 255, 0.2);
            min-height: 500px;
        }

        .hole {
            position: relative;
            background: radial-gradient(circle at 30% 30%, #8b7355, #5c4033);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.4),
                        0 5px 10px rgba(0, 0, 0, 0.2);
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 3px solid #4a3728;
            transition: all 0.1s;
        }

        .hole:hover {
            transform: scale(1.02);
        }

        .hole:active {
            transform: scale(0.98);
        }

        .mole {
            position: absolute;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 35% 35%, #8B4513, #6B3410);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: popUp 0.3s ease-out;
            cursor: pointer;
        }

        @keyframes popUp {
            0% {
                transform: translateY(100%);
            }
            100% {
                transform: translateY(0);
            }
        }

        @keyframes popDown {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(100%);
            }
        }

        .mole.hiding {
            animation: popDown 0.2s ease-in forwards;
        }

        .mole-eyes {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .eye {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .pupil {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
        }

        .mole-mouth {
            position: absolute;
            bottom: 20%;
            width: 12px;
            height: 4px;
            background: #000;
            border-radius: 2px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        .btn-start {
            background: linear-gradient(135deg, #48bb78, #38a169);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(72, 187, 120, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-start:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-reset {
            background: linear-gradient(135deg, #f56565, #e53e3e);
            box-shadow: 0 5px 15px rgba(245, 101, 101, 0.3);
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(245, 101, 101, 0.4);
        }

        .btn-reset:active {
            transform: translateY(0);
        }

        .difficulty {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }

        .difficulty label {
            color: #fff;
            font-weight: bold;
        }

        .difficulty input[type="radio"] {
            margin-right: 5px;
        }

        .game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
        }

        .modal-content button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 40px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                min-height: 400px;
                gap: 10px;
                padding: 15px;
            }

            .game-header {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .stat-value {
                font-size: 24px;
            }

            .player-name {
                font-size: 12px;
                padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .game-board {
                grid-template-columns: repeat(2, 1fr);
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="player-name">👤 張依琳</div>

        <div class="game-header">
            <div class="stat">
                <div class="stat-label">分數</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">剩餘時間</div>
                <div class="stat-value" id="timer">30</div>
            </div>
            <div class="stat">
                <div class="stat-label">難度</div>
                <div class="stat-value" id="difficultyDisplay">簡單</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- 遊戲板會被動態填充 -->
        </div>

        <div class="controls">
            <div class="difficulty">
                <label>難度:</label>
                <label>
                    <input type="radio" name="difficulty" value="easy" checked> 簡單
                </label>
                <label>
                    <input type="radio" name="difficulty" value="normal"> 中等
                </label>
                <label>
                    <input type="radio" name="difficulty" value="hard"> 困難
                </label>
            </div>
            <button class="btn-start" id="startBtn" onclick="startGame()">開始遊戲</button>
            <button class="btn-reset" onclick="resetGame()">重置遊戲</button>
        </div>
    </div>

    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2>遊戲結束!</h2>
            <p>最終分數: <span id="finalScore">0</span></p>
            <button onclick="resetGame(); closeGameOverModal();">再玩一次</button>
        </div>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const difficultyRadios = document.querySelectorAll('input[name="difficulty"]');
        const difficultyDisplay = document.getElementById('difficultyDisplay');

        let score = 0;
        let timeLeft = 30;
        let gameActive = false;
        let difficulty = 'easy';
        let timerInterval;
        let activeMole = null;
        let molePopInterval;

        const difficultySettings = {
            easy: { time: 30, speed: 1000, count: 9 },
            normal: { time: 20, speed: 600, count: 12 },
            hard: { time: 15, speed: 400, count: 16 }
        };

        // 初始化遊戲板
        function initGameBoard() {
            gameBoard.innerHTML = '';
            const holeCount = difficultySettings[difficulty].count;
            for (let i = 0; i < holeCount; i++) {
                const hole = document.createElement('div');
                hole.className = 'hole';
                hole.id = `hole-${i}`;
                hole.style.cursor = 'pointer';
                gameBoard.appendChild(hole);
            }
        }

        // 創建地鼠
        function createMole() {
            if (!gameActive) return;

            // 隱藏之前的地鼠
            if (activeMole) {
                activeMole.classList.add('hiding');
                setTimeout(() => {
                    activeMole.remove();
                    activeMole = null;
                }, 200);
            }

            // 隨機選擇一個洞
            const holes = document.querySelectorAll('.hole');
            const randomHole = holes[Math.floor(Math.random() * holes.length)];

            // 創建新地鼠
            const mole = document.createElement('div');
            mole.className = 'mole';
            mole.innerHTML = `
                <div class="mole-eyes">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                </div>
                <div class="mole-mouth"></div>
            `;
            mole.onclick = (e) => {
                e.stopPropagation();
                hitMole();
            };

            randomHole.appendChild(mole);
            activeMole = mole;

            // 地鼠在洞裡停留的時間
            const stayTime = difficultySettings[difficulty].speed + Math.random() * 500;
            setTimeout(() => {
                if (activeMole === mole && gameActive) {
                    mole.classList.add('hiding');
                    setTimeout(() => {
                        if (mole.parentNode) {
                            mole.remove();
                        }
                        activeMole = null;
                    }, 200);
                }
            }, stayTime);
        }

        // 敲擊地鼠
        function hitMole() {
            if (!gameActive || !activeMole) return;
            
            score += 10;
            scoreDisplay.textContent = score;
            
            activeMole.classList.add('hiding');
            setTimeout(() => {
                if (activeMole && activeMole.parentNode) {
                    activeMole.remove();
                }
                activeMole = null;
                createMole();
            }, 200);
        }

        // 開始遊戲
        function startGame() {
            if (gameActive) return;

            difficulty = document.querySelector('input[name="difficulty"]:checked').value;
            const settings = difficultySettings[difficulty];
            
            const difficultyNames = { easy: '簡單', normal: '中等', hard: '困難' };
            difficultyDisplay.textContent = difficultyNames[difficulty];

            score = 0;
            timeLeft = settings.time;
            gameActive = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startBtn.disabled = true;

            difficultyRadios.forEach(radio => radio.disabled = true);

            // 開始生成地鼠
            createMole();
            molePopInterval = setInterval(() => {
                if (gameActive && !activeMole) {
                    createMole();
                }
            }, 300);

            // 開始計時
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 結束遊戲
        function endGame() {
            gameActive = false;
            startBtn.disabled = false;
            difficultyRadios.forEach(radio => radio.disabled = false);

            clearInterval(timerInterval);
            clearInterval(molePopInterval);

            if (activeMole) {
                activeMole.classList.add('hiding');
                setTimeout(() => {
                    if (activeMole && activeMole.parentNode) {
                        activeMole.remove();
                    }
                    activeMole = null;
                }, 200);
            }

            showGameOverModal();
        }

        // 重置遊戲
        function resetGame() {
            gameActive = false;
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startBtn.disabled = false;
            difficultyRadios.forEach(radio => radio.disabled = false);
            difficultyDisplay.textContent = '簡單';

            clearInterval(timerInterval);
            clearInterval(molePopInterval);

            if (activeMole && activeMole.parentNode) {
                activeMole.remove();
            }
            activeMole = null;

            initGameBoard();
        }

        // 顯示遊戲結束模態框
        function showGameOverModal() {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverModal').style.display = 'flex';
        }

        // 關閉遊戲結束模態框
        function closeGameOverModal() {
            document.getElementById('gameOverModal').style.display = 'none';
        }

        // 初始化遊戲
        initGameBoard();
    </script>
</body>
</html>
