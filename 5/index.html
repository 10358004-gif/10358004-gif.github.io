<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人冒險：終點衝刺</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", "Noto Sans TC", sans-serif;
            background: #e9f4f7;
            color: #172d3a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px;
            display: grid;
            place-items: center;
            background: linear-gradient(160deg, #f3fbfc, #dcecf2);
        }

        .game-shell {
            width: min(100%, 1020px);
            padding: 22px;
            border: 1px solid #d5e5e9;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 22px 60px rgba(34, 74, 91, 0.15);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .eyebrow {
            margin: 0 0 4px;
            color: #168b8c;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.35rem, 3vw, 2rem);
            letter-spacing: 0.03em;
        }

        .restart {
            flex: 0 0 auto;
            padding: 10px 15px;
            border: 0;
            border-radius: 12px;
            background: #173847;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease;
        }

        .restart:hover {
            transform: translateY(-2px);
            background: #236078;
        }

        .restart:focus-visible {
            outline: 3px solid #f4ba4e;
            outline-offset: 3px;
        }

        .game-frame {
            position: relative;
            overflow: hidden;
            border: 5px solid #fff;
            border-radius: 16px;
            background: #bfe9ef;
            box-shadow: 0 6px 20px rgba(27, 62, 74, 0.16);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .hud {
            position: absolute;
            top: 14px;
            left: 14px;
            display: flex;
            gap: 9px;
            pointer-events: none;
        }

        .badge {
            padding: 7px 11px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: #173847;
            font-size: 0.88rem;
            font-weight: 800;
            box-shadow: 0 3px 10px rgba(35, 75, 88, 0.1);
        }

        .instructions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 15px;
            color: #506975;
            font-size: 0.92rem;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        kbd {
            padding: 4px 8px;
            border: 1px solid #cedde1;
            border-bottom-width: 3px;
            border-radius: 7px;
            background: #f7fbfc;
            color: #244453;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 800;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px 8px;
            }

            .game-shell {
                padding: 13px;
                border-radius: 17px;
            }

            header {
                align-items: flex-start;
            }

            .instructions {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .hud {
                top: 8px;
                left: 8px;
                gap: 5px;
            }

            .badge {
                padding: 5px 8px;
                font-size: 0.74rem;
            }
        }
    </style>
</head>
<body>
    <main class="game-shell">
        <header>
            <div>
                <p class="eyebrow">STICKMAN ADVENTURE</p>
                <h1>火柴人冒險：終點衝刺</h1>
            </div>
            <button class="restart" id="restart" type="button">重新開始 ↻</button>
        </header>

        <section class="game-frame" aria-label="火柴人闖關遊戲">
            <canvas id="game" width="960" height="540" aria-label="使用方向鍵移動、空白鍵跳躍"></canvas>
            <div class="hud" aria-live="polite">
                <span class="badge" id="coin-count">🪙 金幣 0 / 10</span>
                <span class="badge" id="checkpoint-status">旗幟：尚未抵達</span>
            </div>
        </section>

        <div class="instructions">
            <span>躲開尖刺、跳過深谷，收集金幣並抵達終點旗幟！</span>
            <div class="keys" aria-label="遊戲操作">
                <kbd>←</kbd><kbd>→</kbd><span>移動</span>
                <kbd>空白鍵</kbd><span>跳躍</span>
                <kbd>R</kbd><span>重玩</span>
            </div>
        </div>
    </main>

    <script>
        (() => {
            const canvas = document.getElementById("game");
            const ctx = canvas.getContext("2d");
            const coinCount = document.getElementById("coin-count");
            const checkpointStatus = document.getElementById("checkpoint-status");
            const restartButton = document.getElementById("restart");

            const WORLD_WIDTH = 2900;
            const FLOOR_Y = 470;
            const GRAVITY = 1850;
            const MOVE_SPEED = 320;
            const JUMP_SPEED = 690;
            const player = { x: 70, y: FLOOR_Y - 50, width: 28, height: 50, vx: 0, vy: 0, grounded: false };

            const platforms = [
                { x: 0, y: FLOOR_Y, width: 530, height: 100 },
                { x: 670, y: FLOOR_Y, width: 440, height: 100 },
                { x: 1260, y: FLOOR_Y, width: 460, height: 100 },
                { x: 1880, y: FLOOR_Y, width: 440, height: 100 },
                { x: 2480, y: FLOOR_Y, width: 420, height: 100 },
                { x: 290, y: 380, width: 125, height: 17 },
                { x: 775, y: 385, width: 135, height: 17 },
                { x: 1410, y: 365, width: 130, height: 17 },
                { x: 2045, y: 385, width: 145, height: 17 },
                { x: 2550, y: 390, width: 120, height: 17 }
            ];

            const spikes = [
                { x: 365, width: 48 }, { x: 830, width: 52 },
                { x: 1510, width: 48 }, { x: 2110, width: 54 },
                { x: 2635, width: 48 }
            ];

            const coins = [
                { x: 220, y: 405 }, { x: 350, y: 330 },
                { x: 725, y: 405 }, { x: 840, y: 335 },
                { x: 1355, y: 405 }, { x: 1475, y: 315 },
                { x: 1985, y: 405 }, { x: 2115, y: 335 },
                { x: 2585, y: 405 }, { x: 2690, y: 350 }
            ];

            const checkpoints = [
                { x: 1320, active: false },
                { x: 2505, active: false }
            ];

            const keys = new Set();
            let cameraX = 0;
            let lastTime = 0;
            let animationTime = 0;
            let collected = 0;
            let respawnX = 70;
            let won = false;
            let deathFlash = 0;

            function resetGame() {
                player.x = 70;
                player.y = FLOOR_Y - player.height;
                player.vx = 0;
                player.vy = 0;
                player.grounded = false;
                cameraX = 0;
                collected = 0;
                respawnX = 70;
                won = false;
                deathFlash = 0;
                coins.forEach((coin) => { coin.collected = false; });
                checkpoints.forEach((checkpoint) => { checkpoint.active = false; });
                coinCount.textContent = `🪙 金幣 0 / ${coins.length}`;
                checkpointStatus.textContent = "旗幟：尚未抵達";
            }

            function respawn() {
                player.x = respawnX;
                player.y = FLOOR_Y - player.height;
                player.vx = 0;
                player.vy = 0;
                player.grounded = false;
                deathFlash = 0.35;
            }

            function overlaps(a, b) {
                return a.x < b.x + b.width &&
                    a.x + a.width > b.x &&
                    a.y < b.y + b.height &&
                    a.y + a.height > b.y;
            }

            function update(delta) {
                if (won) return;
                const step = Math.min(delta, 0.032);
                animationTime += step;
                deathFlash = Math.max(0, deathFlash - step);

                const movingLeft = keys.has("ArrowLeft") || keys.has("KeyA");
                const movingRight = keys.has("ArrowRight") || keys.has("KeyD");
                player.vx = (Number(movingRight) - Number(movingLeft)) * MOVE_SPEED;

                if ((keys.has("Space") || keys.has("ArrowUp") || keys.has("KeyW")) && player.grounded) {
                    player.vy = -JUMP_SPEED;
                    player.grounded = false;
                }

                const previousBottom = player.y + player.height;
                player.x = Math.max(0, Math.min(WORLD_WIDTH - player.width, player.x + player.vx * step));
                player.vy += GRAVITY * step;
                player.y += player.vy * step;
                player.grounded = false;

                for (const platform of platforms) {
                    const horizontalOverlap = player.x + player.width > platform.x &&
                        player.x < platform.x + platform.width;
                    const newBottom = player.y + player.height;
                    if (horizontalOverlap && player.vy >= 0 &&
                        previousBottom <= platform.y && newBottom >= platform.y) {
                        player.y = platform.y - player.height;
                        player.vy = 0;
                        player.grounded = true;
                    }
                }

                if (player.y > canvas.height + 100) {
                    respawn();
                }

                for (const spike of spikes) {
                    const hitBox = { x: spike.x + 5, y: FLOOR_Y - 25, width: spike.width - 10, height: 25 };
                    if (overlaps(player, hitBox)) {
                        respawn();
                        break;
                    }
                }

                for (const coin of coins) {
                    if (!coin.collected &&
                        player.x < coin.x + 12 && player.x + player.width > coin.x - 12 &&
                        player.y < coin.y + 12 && player.y + player.height > coin.y - 12) {
                        coin.collected = true;
                        collected += 1;
                        coinCount.textContent = `🪙 金幣 ${collected} / ${coins.length}`;
                    }
                }

                for (const checkpoint of checkpoints) {
                    if (!checkpoint.active && player.x + player.width / 2 >= checkpoint.x) {
                        checkpoint.active = true;
                        respawnX = checkpoint.x;
                        checkpointStatus.textContent = "旗幟：已存檔 ✓";
                    }
                }

                if (player.x + player.width >= WORLD_WIDTH - 100) {
                    won = true;
                }

                const targetCamera = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, player.x - canvas.width * 0.38));
                cameraX += (targetCamera - cameraX) * Math.min(1, step * 7);
            }

            function roundedRect(x, y, width, height, radius) {
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, radius);
            }

            function drawBackground() {
                const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
                sky.addColorStop(0, "#9edce7");
                sky.addColorStop(1, "#e5f7e9");
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
                for (const cloud of [{ x: 115, y: 92 }, { x: 420, y: 145 }, { x: 760, y: 82 }]) {
                    const x = ((cloud.x - cameraX * 0.16) % (canvas.width + 150) + canvas.width + 150) % (canvas.width + 150) - 70;
                    ctx.beginPath();
                    ctx.ellipse(x, cloud.y, 34, 13, 0, 0, Math.PI * 2);
                    ctx.ellipse(x + 24, cloud.y - 8, 24, 17, 0, 0, Math.PI * 2);
                    ctx.ellipse(x + 48, cloud.y, 31, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = "#b0dcd2";
                ctx.beginPath();
                ctx.moveTo(0, 380);
                for (let x = 0; x <= canvas.width + 80; x += 80) {
                    const y = 330 + Math.sin((x + cameraX * 0.22) * 0.012) * 26;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(canvas.width, FLOOR_Y);
                ctx.lineTo(0, FLOOR_Y);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "#c8e8d1";
                ctx.beginPath();
                ctx.moveTo(0, 420);
                for (let x = 0; x <= canvas.width + 60; x += 60) {
                    const y = 390 + Math.sin((x + cameraX * 0.38) * 0.016) * 18;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(canvas.width, FLOOR_Y);
                ctx.lineTo(0, FLOOR_Y);
                ctx.closePath();
                ctx.fill();
            }

            function drawPlatforms() {
                for (const platform of platforms) {
                    const x = platform.x - cameraX;
                    if (x + platform.width < -20 || x > canvas.width + 20) continue;

                    ctx.fillStyle = platform.y === FLOOR_Y ? "#398c69" : "#dfaa62";
                    roundedRect(x, platform.y, platform.width, platform.height, platform.y === FLOOR_Y ? 5 : 8);
                    ctx.fill();

                    ctx.fillStyle = platform.y === FLOOR_Y ? "#74bd75" : "#f7ca78";
                    roundedRect(x, platform.y, platform.width, platform.y === FLOOR_Y ? 10 : 7, 5);
                    ctx.fill();
                }
            }

            function drawSpikes() {
                for (const spike of spikes) {
                    const x = spike.x - cameraX;
                    if (x + spike.width < -10 || x > canvas.width + 10) continue;
                    const count = Math.floor(spike.width / 16);
                    const triangleWidth = spike.width / count;
                    ctx.fillStyle = "#e76d62";
                    ctx.strokeStyle = "#b94f4a";
                    ctx.lineWidth = 2;
                    for (let i = 0; i < count; i += 1) {
                        ctx.beginPath();
                        ctx.moveTo(x + i * triangleWidth, FLOOR_Y);
                        ctx.lineTo(x + (i + 0.5) * triangleWidth, FLOOR_Y - 24);
                        ctx.lineTo(x + (i + 1) * triangleWidth, FLOOR_Y);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                }
            }

            function drawCoins() {
                for (const coin of coins) {
                    if (coin.collected) continue;
                    const x = coin.x - cameraX;
                    if (x < -20 || x > canvas.width + 20) continue;
                    const shimmer = Math.sin(animationTime * 5 + coin.x) * 2;
                    ctx.fillStyle = "#f6b93b";
                    ctx.beginPath();
                    ctx.ellipse(x, coin.y, 10 + shimmer * 0.2, 12, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#d88b22";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = "#fff0a8";
                    ctx.fillRect(x - 1, coin.y - 6, 2, 12);
                }
            }

            function drawCheckpoints() {
                for (const checkpoint of checkpoints) {
                    const x = checkpoint.x - cameraX;
                    if (x < -30 || x > canvas.width + 30) continue;
                    ctx.strokeStyle = "#344d57";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(x, FLOOR_Y);
                    ctx.lineTo(x, FLOOR_Y - 66);
                    ctx.stroke();
                    ctx.fillStyle = checkpoint.active ? "#38b88a" : "#f39d54";
                    ctx.beginPath();
                    ctx.moveTo(x + 2, FLOOR_Y - 65);
                    ctx.lineTo(x + 35, FLOOR_Y - 54);
                    ctx.lineTo(x + 2, FLOOR_Y - 42);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            function drawGoal() {
                const x = WORLD_WIDTH - 88 - cameraX;
                if (x < -40 || x > canvas.width + 40) return;
                ctx.strokeStyle = "#344d57";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(x, FLOOR_Y);
                ctx.lineTo(x, FLOOR_Y - 110);
                ctx.stroke();
                ctx.fillStyle = "#fff";
                ctx.fillRect(x + 3, FLOOR_Y - 108, 48, 34);
                ctx.fillStyle = "#168b8c";
                ctx.beginPath();
                ctx.moveTo(x + 3, FLOOR_Y - 108);
                ctx.lineTo(x + 27, FLOOR_Y - 108);
                ctx.lineTo(x + 27, FLOOR_Y - 91);
                ctx.lineTo(x + 3, FLOOR_Y - 91);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = "#e76d62";
                ctx.beginPath();
                ctx.moveTo(x + 27, FLOOR_Y - 91);
                ctx.lineTo(x + 51, FLOOR_Y - 91);
                ctx.lineTo(x + 51, FLOOR_Y - 74);
                ctx.lineTo(x + 27, FLOOR_Y - 74);
                ctx.closePath();
                ctx.fill();
            }

            function drawPlayer() {
                const x = player.x - cameraX + player.width / 2;
                const y = player.y;
                const walking = player.grounded && Math.abs(player.vx) > 0;
                const swing = walking ? Math.sin(animationTime * 15) * 7 : 0;
                const color = deathFlash > 0 ? "#d94c43" : "#17232a";

                ctx.save();
                ctx.lineCap = "round";
                ctx.lineJoin = "round";
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 5;

                ctx.beginPath();
                ctx.arc(x, y + 9, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x, y + 18);
                ctx.lineTo(x, y + 34);
                ctx.moveTo(x, y + 22);
                ctx.lineTo(x - 10, y + 29 + swing * 0.35);
                ctx.moveTo(x, y + 22);
                ctx.lineTo(x + 10, y + 29 - swing * 0.35);
                ctx.moveTo(x, y + 34);
                ctx.lineTo(x - 8 + swing * 0.45, y + 48);
                ctx.moveTo(x, y + 34);
                ctx.lineTo(x + 8 - swing * 0.45, y + 48);
                ctx.stroke();
                ctx.restore();
            }

            function drawOverlay() {
                if (!won) return;
                ctx.fillStyle = "rgba(17, 45, 54, 0.55)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.textAlign = "center";
                ctx.fillStyle = "#fff";
                ctx.font = "800 42px Segoe UI, sans-serif";
                ctx.fillText("闖關成功！", canvas.width / 2, 225);
                ctx.font = "600 20px Segoe UI, sans-serif";
                ctx.fillText(`你收集了 ${collected} 枚金幣`, canvas.width / 2, 267);
                ctx.font = "600 16px Segoe UI, sans-serif";
                ctx.fillText("按 R 或點擊「重新開始」再玩一次", canvas.width / 2, 306);
            }

            function render() {
                drawBackground();
                drawPlatforms();
                drawSpikes();
                drawCoins();
                drawCheckpoints();
                drawGoal();
                drawPlayer();
                drawOverlay();
            }

            function loop(timestamp) {
                const delta = lastTime ? (timestamp - lastTime) / 1000 : 0;
                lastTime = timestamp;
                update(delta);
                render();
                requestAnimationFrame(loop);
            }

            window.addEventListener("keydown", (event) => {
                if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(event.code)) {
                    event.preventDefault();
                }
                if (event.code === "KeyR") {
                    resetGame();
                    return;
                }
                keys.add(event.code);
            });

            window.addEventListener("keyup", (event) => {
                keys.delete(event.code);
            });

            window.addEventListener("blur", () => keys.clear());
            restartButton.addEventListener("click", resetGame);
            requestAnimationFrame(loop);
        })();
    </script>
</body>
</html>
